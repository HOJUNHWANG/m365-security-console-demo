<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <title>MS365 SecOps Console</title>
  <style>
    :root {
      --bg:#0a0e16; --bg2:#0c1119; --panel:#10151f; --panel2:#151b27; --elev:#1a2230;
      --border:#273244; --border2:#354258; --text:#eef1f6; --muted:#9aa6ba;
      --accent:#3b9eff; --accent2:#6366f1;
      --ok:#22c55e; --warn:#f5a623; --bad:#ef4444; --info:#7c8ba0;
      --hover:rgba(255,255,255,.04); --scroll:#2b3647; --radius:12px;
      --shadow:0 1px 2px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.28);
      --on-accent:#081019;
    }
    [data-theme="light"]{
      --bg:#f4f6f9; --bg2:#eceff4; --panel:#ffffff; --panel2:#f7f9fc; --elev:#ffffff;
      --border:#dde3ec; --border2:#c2cbd8; --text:#141a24; --muted:#5b6777;
      --accent:#1667c7; --accent2:#4f46e5; --on-accent:#ffffff;
      --ok:#15803d; --warn:#a15c07; --bad:#c62828; --info:#5b6777;
      --hover:rgba(20,26,36,.045); --scroll:#c9d2de;
      --shadow:0 1px 2px rgba(20,30,50,.06), 0 6px 18px rgba(20,30,50,.07);
    }
    * { box-sizing:border-box; }
    * { scrollbar-width:thin; scrollbar-color:var(--scroll) transparent; }
    ::-webkit-scrollbar { width:10px; height:10px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:var(--scroll); border-radius:6px; border:2px solid var(--bg); }
    ::-webkit-scrollbar-thumb:hover { background:var(--border2); }
    ::-webkit-scrollbar-corner { background:transparent; }
    .nw { white-space:nowrap; }
    html,body { margin:0; height:100%; }
    body { font-family:"Segoe UI",system-ui,-apple-system,sans-serif; background:var(--bg);
           color:var(--text); font-size:14px; display:flex; flex-direction:column; height:100vh;
           -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; text-rendering:optimizeLegibility; }
    code, .mono { font-family:"Cascadia Code",Consolas,monospace; }

    header { display:flex; align-items:center; justify-content:space-between; gap:16px;
             height:56px; padding:0 20px; background:var(--panel); border-bottom:1px solid var(--border);
             flex-shrink:0; }
    .brand { display:flex; align-items:center; gap:10px; font-weight:600; font-size:15px; letter-spacing:.2px; }
    .brand .dot { width:9px; height:9px; border-radius:50%; background:var(--ok); box-shadow:0 0 8px var(--ok); }
    .hdr-right { display:flex; align-items:center; gap:14px; }
    .hdr-meta { color:var(--muted); font-size:12px; }
    .hdr-meta.stale { color:var(--bad); font-weight:600; }
    .hdr-meta.stale::before { content:'⚠ '; }
    .chip { font-size:12px; padding:4px 10px; border-radius:6px; border:1px solid var(--border);
            background:var(--panel2); }
    .chip.alert { color:var(--warn); border-color:rgba(245,166,35,.4); }
    .chip.src-ok   { color:var(--muted); }
    .chip.src-down { color:var(--bad); border-color:rgba(224,72,72,.45); font-weight:600; cursor:help; }
    .chip.src-down::before { content:'⚠ '; }
    button.refresh { background:transparent; color:var(--accent);
                     border:1px solid color-mix(in srgb, var(--accent) 40%, transparent);
                     border-radius:6px; padding:6px 14px; font-weight:600; cursor:pointer; font-size:13px; }
    button.refresh:disabled { opacity:.5; cursor:default; }

    .shell { display:flex; flex:1; min-height:0; }
    nav.side { width:236px; background:var(--panel); border-right:1px solid var(--border);
               padding:12px 0; flex-shrink:0; overflow-y:auto; }
    nav.side .nav-item { display:flex; align-items:center; gap:10px; padding:8px 14px 8px 18px; cursor:pointer;
               color:var(--muted); font-size:13.5px; border-left:3px solid transparent; }
    nav.side .nav-item:hover { background:var(--panel2); color:var(--text); }
    nav.side .nav-item.active { color:var(--text); background:var(--panel2); border-left-color:var(--accent); font-weight:600; }
    nav.side .nav-item .ic { width:18px; text-align:center; flex-shrink:0; }
    nav.side .nav-item .nav-txt { display:flex; flex-direction:column; gap:1px; min-width:0; flex:1; }
    nav.side .nav-item .nav-hint { font-size:9.5px; letter-spacing:.06em; text-transform:uppercase;
               font-weight:600; color:var(--muted); opacity:.62; white-space:nowrap;
               overflow:hidden; text-overflow:ellipsis; }
    nav.side .nav-item.active .nav-hint { opacity:.85; color:var(--accent); }
    nav.side .nav-item:hover .nav-hint { opacity:.8; }
    nav.side .nav-badge { flex-shrink:0; min-width:18px; height:18px; padding:0 5px; border-radius:9px;
               font-size:10px; font-weight:700; display:inline-flex; align-items:center;
               justify-content:center; line-height:1; }
    nav.side .nav-badge.nb-high { background:var(--bad); color:#fff; }
    nav.side .nav-badge.nb-med  { background:rgba(245,166,35,.22); color:var(--warn);
               box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--warn) 45%, transparent); }
    nav.side .nav-sub { max-height:0; overflow:hidden; opacity:0; position:relative;
      transition:max-height .22s cubic-bezier(.4,0,.2,1), opacity .16s ease; }
    nav.side .nav-group:hover .nav-sub, nav.side .nav-group.open .nav-sub { max-height:260px; opacity:1; }
    nav.side .nav-sub::before { content:''; position:absolute; left:27px; top:1px; bottom:5px;
      width:1px; background:var(--border); }
    nav.side .nav-sub .nav-item { padding:6px 14px 6px 40px; font-size:12.5px; position:relative; }
    nav.side .nav-sub .nav-item::before { content:''; position:absolute; left:26px; top:50%;
      width:8px; height:1px; background:var(--border); }
    nav.side .nav-sub .nav-item .nav-hint { font-size:9px; }
    nav.side .nav-sub .nav-item.active { background:color-mix(in srgb,var(--accent) 16%, transparent);
      color:var(--text); font-weight:600; border-radius:0 8px 8px 0; }
    nav.side .nav-sub .nav-item.active::before { background:var(--accent); width:10px; left:25px; }
    nav.side .nav-item.parent-open { color:var(--text); }
    nav.side .nav-item.parent-open .ic { color:var(--accent); }
    nav.side .nav-item .caret { margin-left:auto; font-size:9px; opacity:.4;
      transition:transform .22s cubic-bezier(.4,0,.2,1), opacity .16s ease; }
    nav.side .nav-group:hover .nav-item .caret, nav.side .nav-group.open .nav-item .caret {
      opacity:.9; transform:rotate(180deg); }
    nav.side .nav-sec { padding:14px 18px 6px; font-size:10.5px; letter-spacing:.08em; color:var(--muted);
               opacity:.7; text-transform:uppercase; }

    main { flex:1; overflow-y:auto; padding:22px 26px; min-width:0; }
    .tab-head { margin:0 0 4px; font-size:19px; font-weight:600; }
    .tab-sub { color:var(--muted); font-size:13px; margin-bottom:18px; }

    .panel { background:var(--panel); border:1px solid var(--border); border-radius:10px;
             margin-bottom:18px; overflow:hidden; }
    .panel-h { display:flex; align-items:center; justify-content:space-between; gap:8px;
               padding:13px 16px; border-bottom:1px solid var(--border); font-weight:600; font-size:14px; }
    .panel-h .sub { color:var(--muted); font-size:12px; font-weight:400; }
    .panel-b { padding:14px 16px; }
    .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
    .grid2 > :only-child { grid-column: 1 / -1; }
    @media (max-width:980px){ .grid2 { grid-template-columns:1fr; } }

    .kpis { display:grid; grid-template-columns:repeat(auto-fill,minmax(172px,1fr)); gap:14px; margin-bottom:18px; }
    .kpi { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:15px 16px 14px 19px; position:relative; overflow:hidden; }
    .kpi::before { content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--info); }
    .kpi.ok::before{background:var(--ok);} .kpi.warn::before{background:var(--warn);} .kpi.bad::before{background:var(--bad);}
    .kpi-val { font-size:27px; font-weight:700; line-height:1.05; overflow-wrap:anywhere; }
    .kpi-val.long { font-size:19px; letter-spacing:0; }
    .kpi-val small { font-size:14px; color:var(--muted); font-weight:600; }
    .kpi-label { color:var(--muted); font-size:12px; margin-top:6px; font-weight:500; }
    .kpi-sub { font-size:11px; margin-top:3px; color:var(--info); }

    .tbl-wrap { overflow-x:auto; }
    .tbl-scroll { overflow-y:auto; overscroll-behavior:contain;
                  border:1px solid var(--border); border-radius:8px; }
    .tbl-scroll table.tbl th { position:sticky; top:0; z-index:2; background:var(--panel);
                  box-shadow:inset 0 -1px 0 var(--border2); }
    .tbl-scroll table.tbl tr:last-child td { border-bottom:0; }
    .tbl-note { color:var(--muted); font-size:11.5px; margin-top:6px; text-align:right; }
    table.tbl { width:100%; border-collapse:collapse; font-size:13px; }
    table.tbl th { text-align:left; color:var(--muted); font-weight:600; font-size:11px; text-transform:uppercase;
                   letter-spacing:.05em; padding:9px 12px; border-bottom:1px solid var(--border2); white-space:nowrap; }
    table.tbl td { padding:9px 12px; border-bottom:1px solid var(--border);
                   vertical-align:baseline; line-height:1.5; }
    table.tbl tbody tr:nth-child(even) td { background:color-mix(in srgb, var(--text) 3%, transparent); }
    table.tbl tr:last-child td { border-bottom:0; }
    table.tbl tbody tr:hover td { background:var(--hover); }
    .del-controls { display:flex; align-items:center; gap:14px; margin-bottom:11px; flex-wrap:wrap; }
    .del-search { flex:1; min-width:190px; color:var(--text); border:1px solid var(--border); border-radius:8px;
                  padding:7px 11px; font-size:12.5px; outline:none; background:color-mix(in srgb, var(--text) 4%, transparent); }
    .del-search:focus { border-color:color-mix(in srgb,var(--accent) 45%, transparent); }
    .del-search::placeholder { color:var(--muted); }
    .del-lnk { cursor:pointer; color:var(--muted); font-size:12px; user-select:none; white-space:nowrap; }
    .del-lnk:hover { color:var(--accent); }
    .del-acc { border:1px solid var(--border); border-radius:9px; margin-bottom:7px; overflow:hidden;
               background:color-mix(in srgb, var(--text) 2%, transparent); }
    .del-acc[open] { border-color:var(--border2); }
    .del-acc > summary { list-style:none; cursor:pointer; display:flex; align-items:center; gap:10px; padding:9px 12px; user-select:none; }
    .del-acc > summary::-webkit-details-marker { display:none; }
    .del-acc > summary:hover { background:var(--hover); }
    .del-caret { color:var(--muted); font-size:10px; transition:transform .15s ease; flex-shrink:0; }
    .del-acc[open] > summary .del-caret { transform:rotate(90deg); }
    .del-name { font-weight:600; font-size:13px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .del-count { display:inline-block; flex-shrink:0; padding:1px 8px; border-radius:999px; font-size:11px; font-weight:600;
                 color:var(--muted); background:color-mix(in srgb, var(--text) 8%, transparent); }
    .del-inner { padding:0 12px 8px 34px; }
    .del-inner table { width:100%; border-collapse:collapse; font-size:12.5px; }
    .del-inner td { padding:6px 8px; border-top:1px solid var(--border); vertical-align:top; }
    .del-inner tr:first-child td { border-top:0; }
    .del-inner td.di-perms { text-align:right; white-space:nowrap; width:1%; }
    .del-empty { color:var(--muted); font-size:12.5px; padding:10px 2px; }
    .trunc { max-width:340px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .cellwrap { display:block; max-width:360px; white-space:normal; overflow-wrap:anywhere; }
    .muted { color:var(--muted); } .mono.sm { font-size:12px; }

    .badge { font-size:11px; padding:2px 9px; border-radius:999px; font-weight:600; white-space:nowrap;
             display:inline-block; line-height:1.5; vertical-align:baseline; }
    .b-high{ background:rgba(239,68,68,.16); color:#fca5a5; }
    .b-med { background:rgba(245,166,35,.16); color:#fcd34d; }
    .b-low { background:rgba(59,158,255,.16); color:#93c5fd; }
    .b-ok  { background:rgba(34,197,94,.16); color:#86efac; }
    .b-info{ background:rgba(148,163,184,.16); color:#cbd5e1; }
    .b-zero{ background:transparent; color:var(--muted); font-weight:500; }

    .action { display:flex; align-items:baseline; gap:11px; padding:11px 0; border-bottom:1px solid var(--border); }
    .action:last-child { border-bottom:0; }
    .action .txt { flex:1; font-size:13.5px; }
    .action .act-go { flex-shrink:0; font-size:11.5px; font-weight:600; color:var(--accent);
               text-decoration:none; white-space:nowrap; opacity:.8; }
    .action .act-go:hover { opacity:1; text-decoration:underline; }
    .empty { color:var(--muted); font-size:13px; padding:6px 0; }

    .spark { width:200px; height:40px; }
    .spark polyline { fill:none; stroke:var(--accent); stroke-width:1.6; }
    .kpi .spark { width:100%; height:32px; margin-top:8px; }
    .score-row { display:flex; align-items:center; gap:22px; flex-wrap:wrap; }
    .bar { height:8px; border-radius:6px; background:var(--panel2); overflow:hidden; flex:1; min-width:160px; }
    .bar > span { display:block; height:100%; background:linear-gradient(90deg,var(--accent),#22c55e); }

    .notice { color:var(--warn); font-size:13px; padding:8px 0; }
    .stale-banner { color:var(--warn); font-size:13px; line-height:1.5; margin:0 0 14px;
      padding:10px 13px; border:1px solid var(--warn); border-left-width:3px; border-radius:8px;
      background:color-mix(in srgb, var(--warn) 10%, transparent); }
    .verdict { font-size:13px; line-height:1.5; margin:0 0 12px; padding:9px 12px;
      border:1px solid var(--info); border-left-width:3px; border-radius:8px;
      background:color-mix(in srgb, var(--info) 9%, transparent); color:var(--info); }
    .verdict.bad  { border-color:var(--bad);  color:var(--bad);
      background:color-mix(in srgb, var(--bad) 10%, transparent); }
    .verdict.warn { border-color:var(--warn); color:var(--warn);
      background:color-mix(in srgb, var(--warn) 10%, transparent); }
    .verdict.ok   { border-color:var(--ok);   color:var(--ok);
      background:color-mix(in srgb, var(--ok) 9%, transparent); }
    .verdict b { color:inherit; }
    .ai-text { font-size:13.5px; line-height:1.7; }
    .ai-text p { margin:6px 0; }
    .ai-h { font-weight:700; color:var(--accent); margin:13px 0 4px; font-size:13px; letter-spacing:.2px; }
    .ai-h:first-child { margin-top:0; }
    .ai-list { margin:4px 0; padding-left:18px; }
    .ai-list li { margin:3px 0; }
    .panel.ai { border-left:3px solid var(--accent); }
    .help { display:flex; gap:8px; align-items:baseline; font-size:12.5px; color:var(--muted);
      background:color-mix(in srgb,var(--accent) 7%, transparent);
      border:1px solid color-mix(in srgb,var(--accent) 18%, transparent);
      border-radius:8px; padding:9px 12px; margin-bottom:13px; line-height:1.55; }
    .help-ic { color:var(--accent); font-weight:700; flex-shrink:0; }
    .help b { color:var(--text); }
    .fpill { display:inline-block; cursor:pointer; padding:4px 11px; border-radius:999px; border:1px solid var(--border);
      font-size:12px; margin:0 6px 6px 0; color:var(--muted); user-select:none; }
    .fpill:hover { border-color:var(--border2); color:var(--text); }
    .fpill.active { background:color-mix(in srgb,var(--accent) 16%, transparent);
      border-color:color-mix(in srgb,var(--accent) 40%, transparent); color:var(--text); font-weight:600; }
    .dscroll { max-height:440px; overflow:auto; }

    .ph-right { display:flex; align-items:center; gap:10px; min-width:0; }
    .ph-right .sub { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .xlink { display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600;
      color:var(--accent); text-decoration:none; cursor:pointer; white-space:nowrap; border-radius:999px;
      padding:3px 10px; border:1px solid color-mix(in srgb,var(--accent) 28%, transparent);
      background:color-mix(in srgb,var(--accent) 9%, transparent); }
    .xlink:hover { background:color-mix(in srgb,var(--accent) 20%, transparent);
      border-color:color-mix(in srgb,var(--accent) 55%, transparent); }
    .xlink .arr { font-size:10px; opacity:.75; }
    td.acts { width:1%; white-space:nowrap; }
    .rowlink { display:inline-flex; align-items:center; justify-content:center; min-width:24px; height:22px;
      padding:0 6px; border-radius:6px; border:1px solid var(--border); color:var(--muted); cursor:pointer;
      text-decoration:none; font-size:11px; font-weight:600; background:transparent; }
    .rowlink + .rowlink { margin-left:5px; }
    .rowlink:hover { color:var(--accent); border-color:color-mix(in srgb,var(--accent) 45%, transparent);
      background:color-mix(in srgb,var(--accent) 12%, transparent); }
    a.dl, span.dl { color:inherit; text-decoration:none; cursor:pointer;
      border-bottom:1px dotted color-mix(in srgb,var(--accent) 50%, transparent); }
    a.dl:hover, span.dl:hover { color:var(--accent); border-bottom-style:solid; }
    #toast { position:fixed; left:50%; bottom:26px; z-index:50; max-width:min(600px,90vw);
      transform:translateX(-50%) translateY(14px); opacity:0; pointer-events:none;
      background:var(--elev); color:var(--text); border:1px solid var(--border2); border-radius:10px;
      padding:11px 16px; font-size:13px; line-height:1.5; box-shadow:var(--shadow);
      transition:opacity .18s ease, transform .18s ease; }
    #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
    a.kpi-link { display:block; color:inherit; text-decoration:none; }
    .kpi-arr { position:absolute; top:9px; right:11px; font-size:11px; color:var(--muted);
      opacity:0; transition:opacity .15s ease; }
    a.kpi-link:hover .kpi-arr { opacity:1; color:var(--accent); }

    body { background:
      radial-gradient(1100px 560px at 100% -8%, color-mix(in srgb, var(--accent) 9%, transparent), transparent 60%),
      radial-gradient(900px 520px at -8% 108%, color-mix(in srgb, var(--accent2) 8%, transparent), transparent 55%),
      var(--bg); }
    body, header, nav.side, main, .panel, .kpi, .nav-item, .theme-sel, button.refresh, table.tbl th, table.tbl td {
      transition: background-color .25s ease, border-color .25s ease, color .2s ease, box-shadow .2s ease, transform .15s ease; }
    header { box-shadow: var(--shadow); position:relative; z-index:5; }
    .logo { width:30px; height:30px; border-radius:9px; display:grid; place-items:center; font-size:15px;
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 45%, transparent); }
    .brand-txt { display:flex; flex-direction:column; line-height:1.16; }
    .brand-name { font-weight:700; font-size:14.5px; letter-spacing:.2px; }
    .brand-sub { font-size:11px; color:var(--muted); font-weight:500; }
    .theme-sel { background:var(--panel2); color:var(--text); border:1px solid var(--border);
      border-radius:8px; padding:6px 10px; font-size:12.5px; cursor:pointer; outline:none; }
    .theme-sel:hover { border-color:var(--border2); }
    button.refresh { background:linear-gradient(135deg,var(--accent),var(--accent2)); color:var(--on-accent); border:0;
      box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 32%, transparent); }
    button.refresh:hover:not(:disabled){ filter:brightness(1.08); }
    nav.side .nav-item { margin:1px 8px; padding-left:12px; border-radius:9px; border-left:0; }
    nav.side .nav-item.active { background:color-mix(in srgb,var(--accent) 14%, transparent); border-left:0;
      box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 28%, transparent); }
    nav.side .nav-item.active .ic { color:var(--accent); }
    .panel { box-shadow:var(--shadow); }
    .panel:hover { border-color:var(--border2); }
    .panel-h { background:linear-gradient(180deg, color-mix(in srgb,var(--text) 4%, transparent), transparent); }
    .kpi { box-shadow:var(--shadow); }
    .kpi:hover { transform:translateY(-2px); border-color:var(--border2); }
    .kpi-val { letter-spacing:-.4px; }
    .tab-head { font-size:21px; letter-spacing:-.3px; display:flex; align-items:center; gap:10px; }
    .tab-head::before { content:""; width:4px; height:19px; border-radius:3px;
      background:linear-gradient(180deg,var(--accent),var(--accent2)); }
    .chip { border-radius:8px; }
    .mono.sm:not(.trunc){ white-space:nowrap; }
    [data-theme="light"] .b-high{ background:#fde8e8; color:#b91c1c; }
    [data-theme="light"] .b-med { background:#fef2e0; color:#b45309; }
    [data-theme="light"] .b-low { background:#e9edfb; color:#3949ab; }
    [data-theme="light"] .b-ok  { background:#e4f7ec; color:#15803d; }
    [data-theme="light"] .b-info{ background:#eef1f6; color:#475569; }
  </style>
</head>
<body>
  <script>
    var THEMES = ['midnight','light'];
    var RETIRED = {
      carbon:'midnight', ocean:'midnight', violet:'midnight', bw:'midnight',
      blackgold:'midnight', 'pastel-dark':'midnight',
      whitegold:'light', 'pastel-light':'light'
    };
    (function(){
      function norm(t){ if(!t) return null; if(THEMES.indexOf(t)>=0) return t; return RETIRED[t] || null; }

    let DATA = {};
    const LOCALE = () => LANG==='ko' ? 'ko-KR' : 'en-US';

    const fmtMail = (s) => s ? new Date(s).toLocaleString('en-US',{dateStyle:'medium',timeStyle:'short'}) : '-';

    const PW_SETS = ['ABCDEFGHJKLMNPQRSTUVWXYZ','abcdefghijkmnopqrstuvwxyz','23456789','!@$^*?-_='];
    function randIndex(n){
      const max = 256 - (256 % n), b = new Uint8Array(1);
      for(;;){ crypto.getRandomValues(b); if(b[0] < max) return b[0] % n; }
    }
    function genTempPassword(){
      const all = PW_SETS.join('');
      const out = PW_SETS.map(s => s[randIndex(s.length)]);
      while(out.length < 16) out.push(all[randIndex(all.length)]);
      for(let i=out.length-1;i>0;i--){ const j=randIndex(i+1); [out[i],out[j]]=[out[j],out[i]]; }
      return out.join('');
    }
    const TEMP_PW = {};
    function tempPasswordFor(key){
      if(!TEMP_PW[key]) TEMP_PW[key] = genTempPassword();
      return TEMP_PW[key];
    }
    const day = (s) => s ? new Date(s).toLocaleDateString(LOCALE()) : '—';

    function t(s){
      if(s==null || s==='') return s;
      const k = String(s);
      const m = I18N[LANG] && I18N[LANG][k];
      if(m!=null) return m;
      if(T_MISS){
        const hasKo = /[\uAC00-\uD7A3]/.test(k);
        const hasLatin = /[A-Za-z]/.test(k);
        if(LANG==='ko' ? (!hasKo && hasLatin) : hasKo) T_MISS.add(k);
      }
      return k;
    }
    function tf(s, ...a){
      return String(t(s)).replace(/\{(\d+)\}/g, (m,i)=> a[i]==null ? m : a[i]);

    I18N.ko["<b>Excluded</b> lists who each policy does <i>not</i> apply to — an exclusion silently survives every later hardening. Set <code>CA_ACKNOWLEDGED_EXCLUSIONS</code> (semicolon-separated UPNs) to mark the intended ones (break-glass, room accounts) so anything unexpected stands out instead of every row looking the same."] = "<b>제외</b>는 각 정책이 <i>적용되지 않는</i> 대상입니다. 예외는 이후의 모든 하드닝을 조용히 살아남습니다. <code>CA_ACKNOWLEDGED_EXCLUSIONS</code>(세미콜론으로 구분한 UPN)에 의도한 것(break-glass, 회의실 계정)을 적어 두면, 모든 행이 똑같아 보이는 대신 예상 밖의 것만 눈에 띕니다.";
    I18N.ko["<b>FullAccess</b> lets someone open another mailbox; <b>SendAs</b> lets them send as that user. Switch between the by-mailbox and by-delegate views and expand any entry — review anything you do not recognise."] = "<b>FullAccess</b> 는 남의 사서함을 열 수 있게 하고, <b>SendAs</b> 는 그 사람인 것처럼 메일을 보낼 수 있게 합니다. 사서함 기준과 위임자 기준 보기를 오가며 항목을 펼쳐 보고, 모르는 것이 있으면 전부 확인하십시오.";
    I18N.ko["<b>How this is measured:</b> no API lists browser extensions, so this counts claim-bearing sign-ins instead. A claim only appears when the request actually reaches <code>login.microsoftonline.com</code> — so a user who installed it but has not signed out yet still shows as missing. <b>Missing = not yet proven, and an unproven install is an unproven CA outcome.</b>"] = "<b>무엇을 재는가:</b> 브라우저 확장을 목록으로 주는 API 가 없어서, 대신 클레임을 실은 사인인을 셉니다. 클레임은 요청이 실제로 <code>login.microsoftonline.com</code> 에 닿을 때만 생기므로, 설치는 했지만 아직 로그아웃하지 않은 사람은 여전히 '없음' 으로 나옵니다. <b>없음 = 아직 확인되지 않음이고, 확인되지 않은 설치는 확인되지 않은 CA 결과입니다.</b>";
    I18N.ko["<b>No collection window is configured</b>, so the loop runs around the clock — about 72 cycles a day instead of ~29. Set <span class=\"mono\">COLLECT_ACTIVE_HOURS</span> (e.g. <span class=\"mono\">7-17</span>) to restore a quiet period."] = "<b>수집 구간이 설정돼 있지 않습니다.</b> 그래서 루프가 하루 종일 돕니다 — 29회쯤이 아니라 하루 72회쯤입니다. <span class=\"mono\">COLLECT_ACTIVE_HOURS</span>(예: <span class=\"mono\">7-17</span>)를 설정하면 쉬는 시간이 생깁니다.";
    I18N.ko["<b>Pivots:</b> click a <b>Subject</b> to copy a KQL query for that one message and open Defender <b>Advanced Hunting</b> in a new tab — paste, Run, then click the <b>NetworkMessageId</b> in the results to reach the <b>Email entity</b> page. Click a <b>Sender</b> to pull all mail from that sender over the last 30 days. <b>EX</b> opens Threat Explorer."] = "<b>이동:</b> <b>제목</b>을 클릭하면 그 메시지 한 건에 대한 KQL 질의가 복사되고 Defender <b>Advanced Hunting</b> 이 새 탭에서 열립니다 — 붙여넣고 Run 한 뒤, 결과에서 <b>NetworkMessageId</b> 를 클릭하면 <b>Email entity</b> 페이지로 갑니다. <b>발신자</b>를 클릭하면 그 발신자가 최근 30일간 보낸 메일 전부를 가져옵니다. <b>EX</b> 는 Threat Explorer 를 엽니다.";
    I18N.ko["<b>Scope:</b> only sign-ins on platforms the device policies actually target are counted — <b>{0}</b>, read from {1} policy/policies. Sign-ins on other platforms are excluded because those policies never evaluate them, so they are not a rollout task."] = "<b>범위:</b> 기기 정책이 실제로 대상으로 삼는 플랫폼의 사인인만 셉니다 — <b>{0}</b>, 정책 {1}개에서 읽었습니다. 다른 플랫폼의 사인인은 그 정책들이 애초에 평가하지 않으므로 배포 과제가 아니고, 그래서 제외합니다.";

    I18N.ko["<b>Security Defaults</b> = free baseline (MFA for everyone, block legacy auth). <b>Conditional Access</b> (Entra ID P1) replaces it with granular rules. They are mutually exclusive — turning CA on requires Security Defaults off."] = "<b>Security Defaults</b> 는 무료 기본선입니다(전원 MFA, 레거시 인증 차단). <b>Conditional Access</b>(Entra ID P1)는 그것을 세밀한 규칙으로 대체합니다. 둘은 함께 켤 수 없어서, CA 를 켜려면 Security Defaults 를 꺼야 합니다.";
    I18N.ko["<b>Why they would be stopped</b> — this decides what you actually fix:"] = "<b>왜 막히는가</b> — 실제로 무엇을 고칠지가 여기서 갈립니다:";

    I18N.ko["<b>{0}</b> policy(ies) show \"No activity\" — they are unmeasured, not proven."] = "정책 <b>{0}</b>개가 \"활동 없음\" 입니다 — 확인된 것이 아니라 측정되지 않은 것입니다.";
    I18N.ko["<b>✉ Notify:</b> opens a warning <b>draft</b> in your own mail client, addressed to <b>every recipient of that message</b> (the number on the button) with the fixed Cc from <code>THREAT_NOTIFY_CC</code>. Review it and send it yourself — <b>the dashboard never sends mail</b>, and must never be given permission to: it is internet-exposed, and app-only <code>Mail.Send</code> would let a compromise send as any user in the tenant. The draft says the message <i>was delivered</i> rather than \"already deleted\", because this table only proves delivery; if ZAP removed it afterwards, edit that line before sending."] = "<b>✉ 알림:</b> 본인 메일 클라이언트에 경고 <b>초안</b>을 엽니다. 수신자는 <b>그 메시지를 받은 사람 전원</b>(버튼의 숫자)이고, Cc 는 <code>THREAT_NOTIFY_CC</code> 고정값입니다. 검토한 뒤 직접 보내십시오 — <b>대시보드는 메일을 보내지 않고</b>, 그 권한을 절대 줘서는 안 됩니다. 인터넷에 노출돼 있고, 앱 전용 <code>Mail.Send</code> 가 있으면 침해 시 테넌트의 아무 사용자로나 메일을 보낼 수 있게 됩니다. 초안은 \"이미 삭제됨\" 이 아니라 메일이 <i>전달되었다</i>고 씁니다. 이 표가 증명하는 것은 전달까지이기 때문입니다. 이후 ZAP 이 지웠다면 그 문장을 고쳐서 보내십시오.";
    I18N.ko["A Teams Rooms console or shared-device account signs in with <b>nobody present</b>. A policy that requires MFA cannot prompt it — it <b>locks it out</b>, and the failure looks like an ordinary sign-in error. Fix by excluding these accounts and giving them their own policy that requires a <b>trusted location or compliant device</b> instead of MFA — an excluded account has no authentication requirement at all, and a meeting room is physically open.<br><b>A narrowed block is not a lockout.</b> \"Deny outside the office\" is the recommended shape for a room account: it permits the room at its desk and denies a stolen password elsewhere. Those show as <i>Gated</i>, not as locked out."] = "Teams Rooms 콘솔이나 공용 기기 계정은 <b>사람이 없는 상태로</b> 사인인합니다. MFA 를 요구하는 정책은 이들에게 프롬프트를 띄울 수 없어서 <b>잠가 버리고</b>, 그 실패는 평범한 사인인 오류처럼 보입니다. 이 계정들을 제외한 뒤 MFA 대신 <b>신뢰할 수 있는 위치 또는 준수 기기</b>를 요구하는 별도 정책을 주는 것이 해법입니다 — 그냥 제외만 하면 인증 요구가 아예 없어지는데, 회의실은 물리적으로 열린 공간입니다.<br><b>좁힌 차단은 잠금이 아닙니다.</b> \"사무실 밖에서는 거부\"가 회의실 계정에 권장되는 모양입니다. 자기 자리에서는 되고, 훔친 비밀번호로 다른 곳에서 하면 막힙니다. 이런 건 잠김이 아니라 <i>제한됨</i>으로 표시됩니다.";
    I18N.ko["A delegated scope is a ceiling bounded by the signed-in user; an application (app-only) permission is bounded by nobody. The two counts are deliberately separate and must not be added."] = "위임 스코프는 로그인한 사용자의 권한에 묶인 **상한**입니다. 애플리케이션(앱 전용) 권한은 아무에게도 묶이지 않습니다. 두 숫자는 의도적으로 분리돼 있고 **더하면 안 됩니다.**";
    I18N.ko["A device policy stopping a sign-in is not the control working — it is somebody unable to reach their own mail on a laptop we already approved. Read <b>Why</b> before acting: <b>no device claim</b> is a browser problem and re-registering the machine will not fix it, while <b>device not compliant</b> is the opposite. The quickest remedy for the first is Edge with the work profile — it needs no install. Grant a time-boxed exception only when you cannot reach the person: it suspends every device requirement they have."] = "기기 정책이 사인인을 막은 것은 통제가 작동한 것이 아니라, 우리가 이미 승인한 노트북에서 자기 메일에 못 들어가는 사람이 생긴 것입니다. 조치 전에 <b>이유</b>부터 읽으십시오: <b>기기 클레임 없음</b>은 브라우저 문제라 기기를 다시 등록해도 안 고쳐지고, <b>기기 준수 안 함</b>은 그 반대입니다. 앞의 것은 Edge 의 작업 프로필이 가장 빠른 해결이고, 설치할 것이 없습니다. 기한을 정한 예외는 사람과 연락이 닿지 않을 때만 주십시오 — 그 사람의 기기 요구 조건 전부를 정지시킵니다.";
    I18N.ko["A flat run of identical partial failures is the signal that waiting will not fix something — that is how it became clear the sign-in backfill had to bank partial progress instead of discarding it. Cleared on restart."] = "똑같은 부분 실패가 평평하게 이어지는 것은 기다려도 안 고쳐진다는 신호입니다 — 사인인 백필이 진행분을 버리지 말고 저장해야 한다는 것이 그렇게 드러났습니다. 재시작하면 초기화됩니다.";
    I18N.ko["A guest is a standing external identity in your tenant. <b>Never accepted</b> = the invitation was never used; <b>Dormant</b> = accepted but idle, which is access nobody is watching. Idle time uses interactive <i>and</i> non-interactive sign-ins, so a guest who only opens shared files through a silently-refreshing client is not mistaken for dormant. Reporting latency is a few hours, so this measures months of idleness, not what happened in the last minute."] = "게스트는 테넌트 안에 상시로 존재하는 외부 신원입니다. <b>수락한 적 없음</b> = 초대가 한 번도 쓰이지 않음, <b>휴면</b> = 수락했지만 쓰지 않는 상태로, 아무도 지켜보지 않는 접근권입니다. 휴면 판정에는 대화형 <i>과</i> 비대화형 사인인을 함께 씁니다 — 조용히 토큰을 갱신하는 클라이언트로만 공유 파일을 여는 게스트를 휴면으로 오인하지 않기 위해서입니다. 리포팅 지연이 몇 시간이므로 이 값은 몇 달 단위의 휴면을 재는 것이지 방금 1분을 재는 것이 아닙니다.";

    I18N.ko["Read the <b>Status</b> column first — the rest is the evidence behind it. A block on its own is not a fault: what matters is <b>Not recovered</b> — users blocked with no successful sign-in afterwards. An MFA policy stopping bad sign-ins that then all succeed is the control working. <b>No activity</b> is not a pass either: the policy never engaged, so it has told you nothing. <b>In scope</b> = sign-ins by the users the policy can reach (include groups/roles/users, minus exclusions); Entra records an entry for every policy on <i>every</i> sign-in, so a raw evaluated count reads the same on every row and cannot tell a small pilot from a tenant-wide policy. <b>Applied</b> = the policy actually engaged. <b>Blocked</b> is what it <i>did</i>; <b>Would block</b> is what a report-only policy <i>would have</i> done — a policy with both changed mode inside the window (↻). For a <b>Block</b>-control policy, \"Passed\" is always 0 by design."] = "<b>상태</b> 열을 먼저 읽으십시오 — 나머지는 그 근거입니다. 차단 자체는 결함이 아닙니다. 중요한 것은 <b>복구 안 됨</b>, 즉 차단된 뒤 성공한 사인인이 없는 사용자입니다. 나쁜 사인인을 막았는데 그 뒤 전부 성공했다면 그건 통제가 작동한 것입니다. <b>활동 없음</b>도 통과가 아닙니다 — 정책이 한 번도 관여하지 않았으니 아무것도 말해 주지 않은 것입니다. <b>범위 안</b> = 그 정책이 닿을 수 있는 사용자의 사인인(포함된 그룹·역할·사용자에서 제외 대상을 뺀 것)입니다. Entra 는 <i>모든</i> 사인인에 대해 모든 정책의 항목을 남기므로, 가공하지 않은 평가 건수는 어느 행에서나 같게 보이고 소규모 파일럿과 테넌트 전역 정책을 구분하지 못합니다. <b>적용됨</b> = 정책이 실제로 관여한 것. <b>차단됨</b>은 실제로 <i>한</i> 일이고, <b>차단함</b>은 report-only 정책이 <i>했을</i> 일입니다 — 둘 다 있는 정책은 구간 안에서 모드가 바뀐 것입니다(↻). <b>Block</b> 제어 정책에서 \"통과\" 가 항상 0인 것은 설계상 정상입니다.";

    I18N.ko["{0} failure code(s) are not classified as either attack or policy-working and are counted in neither: {1}. They are printed rather than dropped — an allowlist that silently swallows an unknown code is the one way this can go quiet."] = "실패 코드 {0}종이 공격으로도 정책 작동으로도 분류되지 않아 **어느 쪽에도 안 세어졌습니다**: {1}. 버리지 않고 찍습니다 — 허용목록 방식이 조용해질 수 있는 유일한 경로가 **모르는 코드를 소리 없이 삼키는 것**이기 때문입니다.";
    I18N.ko["Spray leaves no successes — an IP where most sign-ins succeed is where your own people come out (SASE / VPN / office NAT), not an attacker. Those are listed below and excluded from the count above. ⚠ An IP that a takeover already succeeded from also has successes, so this exclusion cannot stand alone: the \"failures then a success\" rule in High-signal Sign-in Events deliberately ignores it."] = "스프레이는 성공을 남기지 않습니다 — 대부분의 사인인이 성공하는 IP 는 공격자가 아니라 <b>우리 사람들이 모여 나가는 곳</b>(SASE · VPN · 사무실 NAT)입니다. 아래에 따로 적고 위 집계에서는 뺐습니다. ⚠ <b>이미 탈취에 성공한 IP 도 성공을 남깁니다.</b> 그래서 이 제외는 혼자 설 수 없습니다 — 「주의해서 볼 사인인」의 \"실패 반복 뒤 성공\" 규칙은 이 분류를 일부러 무시합니다.";
    I18N.ko["Four rules, in priority order: (1) repeated credential failures followed by a SUCCESS from the same IP — a spray that worked; (2) a successful sign-in from a country under 1% of this tenant's traffic — travel and takeover look identical here, so ask the person; (3) credential failures from an IP with zero successes; (4) attempts against a disabled account. A single failure is only listed when it came from something that is not a human client — no device, no browser — because a single event from such a client (PowerShell from a hosting range, for example) can be the most useful signal."] = "규칙 넷, 우선순위 순서입니다: (1) 같은 IP 에서 자격증명 실패가 반복된 뒤 <b>성공</b> — 스프레이가 통한 모양입니다. (2) 이 테넌트 트래픽의 1% 미만인 국가에서의 <b>성공</b> — 출장과 탈취는 여기서 같은 모양이라 본인에게 묻는 것이 가장 빠릅니다. (3) 성공이 하나도 없는 IP 에서의 자격증명 실패. (4) 비활성 계정을 상대로 한 시도. 실패가 1건뿐일 때는 <b>사람이 쓰는 클라이언트가 아닐 때만</b> 싣습니다(기기 정보도 브라우저도 없음) — 그런 클라이언트에서 온 단발 이벤트(예: 호스팅 대역에서 온 PowerShell)가 가장 값어치 있는 신호일 수 있기 때문입니다.";
    I18N.ko["A <i>phantom</i> Intune link means Intune's <code>azureADDeviceId</code> points at an MDM-only stub (no <code>trustType</code>) instead of the real registration, so compliance is reported to an object Conditional Access never sees. Note Intune can <b>create</b> such a stub on its own to repair a dangling pointer — a new phantom does not mean the device changed."] = "<i>유령</i> Intune 연결은 Intune 의 <code>azureADDeviceId</code> 가 실제 등록이 아니라 <code>trustType</code> 이 없는 MDM 전용 껍데기를 가리킨다는 뜻입니다. 그래서 준수 상태가 <b>Conditional Access 가 보지 않는 객체</b>에 보고됩니다. Intune 이 끊긴 포인터를 고치려고 그 껍데기를 <b>스스로 만들기도</b> 합니다 — 유령이 새로 생겼다고 기기가 바뀐 것은 아닙니다.";
    I18N.ko["An untagged sign-in object just needs the tag moved onto the object the device actually authenticates with (not the one Intune points at)."] = "태그가 없는 사인인 객체는 태그를 <b>기기가 실제로 인증에 쓰는 객체</b>로 옮기기만 하면 됩니다 (Intune 이 가리키는 객체가 아니라).";
    I18N.ko["An asterisk (<b>*</b>) means the verdict comes from the Entra object the device <i>registers</i> with rather than from a sign-in claim, because no claim landed in the window. On split devices <code>dsregcmd /status</code> shows <code>WorkplaceDeviceId</code> matching that object, not the stub. Without this fallback such devices would drop out of the Tag Inert count, even though they can be blocked <i>and</i> invisible in the log."] = "별표(<b>*</b>)는 판정이 사인인 클레임이 아니라 기기가 <i>등록</i>한 Entra 객체에서 나왔다는 뜻입니다 — 창 안에 클레임이 하나도 안 들어왔기 때문입니다. 갈라진 기기에서 <code>dsregcmd /status</code> 를 보면 <code>WorkplaceDeviceId</code> 가 껍데기가 아니라 그 객체와 일치합니다. 이 대체 경로가 없으면 그런 기기는 Tag Inert 집계에서 빠집니다 — <i>막혀 있으면서 로그에도 안 보이는</i> 기기일 수 있는데도.";
    I18N.ko["<b>Tag inert:</b> the object is tagged but <code>isManaged</code> is not <code>true</code>, and the device filter does <b>not</b> honour the tag on such an object — such a device fails the policy even with an exact <code>Approved-Device</code> value. Tagging cannot fix it; the device must re-register (<i>Add a work or school account</i>) so Intune state attaches to the object it signs in with. Disconnect the existing work account first, then delete the stub, then re-add — deleting while the device is still attached makes Intune mint a new stub."] = "<b>태그 무효(Tag inert):</b> 객체에 태그는 있는데 <code>isManaged</code> 가 <code>true</code> 가 아니고, 기기 필터는 그런 객체의 태그를 <b>인정하지 않습니다</b> — <code>Approved-Device</code> 값이 정확해도 그런 기기는 정책에 막힙니다. <b>태그로는 못 고칩니다.</b> 기기가 <i>회사 또는 학교 계정 추가</i>로 재등록해서 Intune 상태가 실제 사인인하는 객체에 붙어야 합니다. 기존 회사 계정을 먼저 연결 해제하고, 그 다음 껍데기를 지우고, 그 다음 다시 추가하십시오 — 기기가 붙어 있는 상태에서 지우면 Intune 이 껍데기를 새로 만듭니다.";
    I18N.ko["<b>can't tell</b> in the Tagged? column now means something stronger than before: no sign-in carried a device claim <i>and</i> there is no non-stub Entra object to read instead, so this device has no sound registration anywhere. It is not simply \"unverified\"."] = "Tagged? 열의 <b>알 수 없음</b>은 이전보다 강한 뜻입니다: 사인인에 기기 클레임이 하나도 없었고 <i>그리고</i> 대신 읽을 껍데기 아닌 Entra 객체도 없다는 뜻이라, 이 기기는 어디에도 온전한 등록이 없습니다. 단순히 \"확인 안 됨\" 이 아닙니다.";

    I18N.ko["These hold no delegated consent, no application permission and no SSO mode, so the other panels on this tab cannot see them at all. When self-service consent is off, a sign-in attempt creates the service principal but never attaches consent — so most of this list is \"someone tried to connect this with a work account\", not \"this has access\". Ask before blocking. What makes it worth watching is the last column of the risk: approving the queue item in the portal consents tenant-wide while the gate is still off."] = "위임 동의도, 애플리케이션 권한도, SSO 모드도 없는 것들입니다. 그래서 이 탭의 다른 패널은 이들을 <b>아예 보지 못합니다.</b> 사용자 자체 동의가 꺼져 있으면, 로그인 시도를 하면 서비스 주체는 만들어지지만 동의는 붙지 않습니다 — 즉 이 목록은 대부분 \"누가 회사 계정으로 붙이려 했다\" 이지 \"접근 권한이 있다\" 가 아닙니다. <b>막기 전에 물어보십시오.</b> 그래도 지켜볼 값어치가 있는 이유는 마지막 한 칸입니다: 포털 큐에서 승인하면 <b>게이트가 없는 채로</b> 테넌트 전체 동의가 들어갑니다.";
    I18N.ko["Tenant-wide consent without a gate means every employee; a user consent without a gate means that one person, and it stops being contained the moment anyone else consents. Both belong here — counting only the tenant-wide ones would hide departmental apps nobody has formalised. Fix one with: scripts/Approve-EnterpriseApp.ps1 -DisplayName '<app>' -AppRole <role> -Apply — it raises the gate first and consents last, which is the order the portal button gets wrong."] = "게이트 없는 테넌트 전체 동의는 전 직원을 뜻하고, 게이트 없는 개인 동의는 그 한 사람을 뜻합니다 — 다른 누군가 동의하는 순간 그 한정도 사라집니다. <b>둘 다 여기 들어갑니다.</b> 테넌트 전체 동의만 세면 부서가 쓰는데 정식화되지 않은 앱들이 가려집니다. 하나를 고치려면: scripts/Approve-EnterpriseApp.ps1 -DisplayName '<app>' -AppRole <role> -Apply — 게이트를 먼저 올리고 동의를 마지막에 합니다. 포털 버튼이 틀리는 것이 그 순서입니다.";
    I18N.ko["The SSO extension fixes this browser"] = "SSO 확장으로 해결되는 브라우저입니다";

    I18N.ko["The device is healthy and was still stopped. Suspect the policy, not the device."] = "기기는 멀쩡한데도 막혔습니다. 기기가 아니라 정책을 의심하십시오.";
    I18N.ko["The user saw a warning and went anyway"] = "경고를 보고도 그대로 진행했습니다";
    I18N.ko["The raw alert stream. Defender groups related alerts into the <b>Security Incidents</b> above — use incidents as the primary view and this list to drill into individual signals."] = "가공되지 않은 경고 흐름입니다. Defender 는 관련 경고를 위의 <b>보안 인시던트</b>로 묶습니다 — 인시던트를 기본 화면으로 보고, 이 목록은 개별 신호를 파고들 때 쓰십시오.";

    I18N.ko["The sign-in never presented a device identity. Fix the CLIENT — Edge work profile, or the Chrome SSO extension. The machine itself is usually healthy, so re-registering it is the wrong move."] = "그 사인인은 기기 신원을 아예 내놓지 않았습니다. 고칠 것은 **클라이언트**입니다 — Edge 작업 프로필이나 Chrome SSO 확장. 기기 자체는 대개 멀쩡하므로 다시 등록하는 것은 잘못된 조치입니다.";
    I18N.ko["The tenant sharing level is only a <b>ceiling</b>. What matters is which links exist and what they grant. An anonymous link carries <b>no identity</b>: it produces no sign-in record and no Conditional Access evaluation, so MFA, device and location policies are all bypassed on that path. A link of type <b>edit</b> also allows modifying and downloading the file. <b>Per-site sharing level is not available in Microsoft Graph</b> — this scan targets a configured list of sites, so verify it with <span class=\"mono sm\">Get-SPOSite -Limit All | ft Url,SharingCapability</span>."] = "테넌트 공유 수준은 <b>천장</b>일 뿐입니다. 중요한 것은 어떤 링크가 실제로 있고 무엇을 허용하느냐입니다. 익명 링크에는 <b>신원이 없습니다</b>. 사인인 기록도, Conditional Access 평가도 생기지 않으므로 MFA·기기·위치 정책이 그 경로에서는 전부 우회됩니다. <b>edit</b> 유형의 링크는 파일 수정과 다운로드까지 허용합니다. <b>사이트별 공유 수준은 Microsoft Graph 에 없습니다</b> — 이 스캔은 지정된 사이트 목록만 봅니다. <span class=\"mono sm\">Get-SPOSite -Limit All | ft Url,SharingCapability</span> 로 대조하십시오.";
    I18N.ko["These are <b>app credentials</b>, not people, and they are not covered by MFA or Conditional Access user policies. Partner/CSP delegated-admin apps (e.g. <i>Support</i>, <i>Partner Center Web App</i>) appear here — if the partner relationship is no longer needed, remove it: it is a standing tenant-wide admin path. Review under Settings › Partner relationships."] = "이것들은 사람이 아니라 <b>앱 자격 증명</b>이고, MFA 나 Conditional Access 사용자 정책의 적용을 받지 않습니다. 파트너/CSP 위임 관리자 앱(<i>Support</i>, <i>Partner Center Web App</i> 등)이 여기 나옵니다 — 파트너 관계가 더 이상 필요 없으면 제거하십시오. 상시 열려 있는 테넌트 전역 관리자 경로입니다. 설정 › 파트너 관계에서 확인하십시오.";
    I18N.ko["These are sign-ins the portal hides by default: the <b>non-interactive</b> collection. A block here is usually <b>benign</b> — the client tried a silent token refresh, Conditional Access asked for MFA, the client then prompted and the user completed it. What matters is the exception:<br><b>Stuck</b> = blocked and nothing succeeded afterwards. An account that cannot complete a prompt is one that has nobody to answer it — a Teams Rooms console, a shared-device or workload identity. This is a real outage.<br><b>Still blocking</b> = something did succeed, yet blocks are still arriving. Typically one client stuck in a retry loop (a phone mail app) while the account's other clients work."] = "포털이 기본으로 숨기는 사인인, 즉 <b>비대화형</b> 로그입니다. 여기서의 차단은 대개 <b>무해합니다</b> — 클라이언트가 조용히 토큰을 갱신하려 했고, Conditional Access 가 MFA 를 요구했고, 그 다음 클라이언트가 프롬프트를 띄워 사용자가 통과한 경우입니다. 중요한 건 예외입니다:<br><b>멈춤</b> = 차단됐고 그 뒤로 아무것도 성공하지 못한 경우. 프롬프트를 통과하지 못하는 계정은 답할 사람이 없는 계정입니다 — Teams Rooms 콘솔, 공용 기기, 워크로드 신원. 이건 실제 장애입니다.<br><b>계속 차단 중</b> = 성공한 것도 있는데 차단이 계속 들어오는 경우. 보통 클라이언트 하나가 재시도 루프에 빠진 것(휴대폰 메일 앱)이고 그 계정의 다른 클라이언트는 정상입니다.";
    I18N.ko["These dates are not enforced."] = "이 기한은 강제되지 않습니다.";
    I18N.ko["These settings decide how much external access exists <b>outside</b> identity control. <b>Anonymous links</b> are the one that matters most: that access has no user, so it never appears in sign-in logs and no Conditional Access policy — MFA included — can apply to it. A domain allow-list is usually impractical for an org that shares with many customers and vendors; turning anonymous links off achieves the same containment without maintaining a list."] = "이 설정들은 신원 통제 <b>바깥</b>에 외부 접근이 얼마나 존재하는지를 정합니다. 그중 가장 중요한 것이 <b>익명 링크</b>입니다. 그 접근에는 사용자가 없어서 사인인 로그에 아예 남지 않고, MFA 를 포함해 어떤 Conditional Access 정책도 적용되지 않습니다. 고객·협력사가 많은 조직에서 도메인 허용 목록은 대개 현실적이지 않습니다. 익명 링크를 끄면 목록을 관리하지 않고도 같은 수준으로 막을 수 있습니다.";
    I18N.ko["This policy is in <b>simulation</b>: it records what would have matched and blocks nobody. It exists to answer one question before any rule is enforced — <b>what actually carries sensitive data, and where does it go</b>. Read the three numbers separately: <b>files at rest</b> (OneDrive/SharePoint) are stored, not sent; <b>matches in mail</b> travelled; <b>external-domain mail</b> is the part that leaves the group. ⚠ The domain breakdown comes from a <b>top-N sample</b>, and the field records addresses <b>involved</b> in a matched message — it does not say whether they sent or received."] = "이 정책은 <b>시뮬레이션</b> 상태입니다. 무엇이 걸렸을지를 기록만 하고 아무도 막지 않습니다. 규칙을 켜기 전에 하나를 답하려고 존재합니다 — <b>실제로 무엇이 민감정보를 싣고 있고, 그것이 어디로 가는가</b>. 세 숫자는 따로 읽으십시오. <b>보관 중인 파일</b>(OneDrive/SharePoint)은 쌓여 있는 것이지 나간 것이 아니고, <b>메일에서 매치</b>는 실제로 오간 것이며, <b>외부 도메인 메일</b>이 조직 밖으로 나가는 부분입니다. ⚠ 도메인 분해는 <b>상위 N개 표본</b>이고, 이 필드는 매치된 메시지에 <b>관여한</b> 주소를 담을 뿐 보냈는지 받았는지는 말해 주지 않습니다.";
    I18N.ko["This policy no longer exists in the tenant. The rows below are history from before it was deleted, not a forecast."] = "이 정책은 테넌트에 더 이상 없습니다. 아래 행은 삭제되기 전의 이력이지 예측이 아닙니다.";
    I18N.ko["This summary predates the bilingual output — showing the English one. The next collection will produce Korean."]= "이 요약은 두 언어 출력 이전에 만들어진 것이라 영어본을 보여 주고 있습니다. 다음 수집부터 한국어가 나옵니다.";
    I18N.ko["This tab analyzes inbound email threats from Microsoft Defender (last 7 days). Delivered threats are grouped as <b>Own-domain spoofing</b> (someone forging your own domain), <b>External</b>, and <b>Allowlisted</b> (expected senders such as the sales portal or affiliate domains — excluded from the review list). <b>ZAP Removed</b> means the message was auto-removed after delivery. Under Safe Links, <b>Allowed</b> clicks are normal browsing; <b>Blocked</b> clicks are the real risk signal."] = "이 탭은 Microsoft Defender 의 수신 메일 위협(최근 7일)을 분석합니다. 전달된 위협은 <b>자사 도메인 스푸핑</b>(누군가 우리 도메인을 사칭), <b>외부</b>, <b>허용 목록</b>(영업 포털이나 계열 도메인처럼 예상된 발신자 — 검토 목록에서 제외)으로 묶입니다. <b>ZAP 로 사후 삭제됨</b>은 전달된 뒤 자동으로 회수됐다는 뜻입니다. Safe Links 에서 <b>Allowed</b> 클릭은 정상 탐색이고, <b>Blocked</b> 클릭이 실제 위험 신호입니다.";

    function copyText(t){
      if(navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(t);
      return new Promise((res,rej)=>{
        const ta=document.createElement('textarea');
        ta.value=t; ta.style.position='fixed'; ta.style.opacity='0';
        document.body.appendChild(ta); ta.select();
        try{ document.execCommand('copy'); res(); }catch(e){ rej(e); }
        finally{ document.body.removeChild(ta); }
      });
    }

      const lines=esc(t).split(/\r?\n/);
      let out='', inList=false;
      const close=()=>{ if(inList){ out+='</ul>'; inList=false; } };
      for(const raw of lines){
        let l=raw.trim();
        if(!l){ close(); continue; }
        l=l.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/^#+\s*/,'');
        const b=l.match(/^[-*•]\s+(.*)/);
        if(b){ if(!inList){ out+='<ul class="ai-list">'; inList=true; } out+=`<li>${b[1]}</li>`; continue; }
        close();
        const plain=l.replace(/<[^>]+>/g,'');
        if(/:$/.test(plain) && plain.length<=42){ out+=`<div class="ai-h">${l.replace(/:\s*$/,'')}</div>`; }
        else { out+=`<p>${l}</p>`; }
      }
      close();
      return out;
    }
    function sparkline(vals){
      if(!vals || vals.length<2) return '';
      const w=200,h=40,p=3, mn=Math.min(...vals), mx=Math.max(...vals), rg=(mx-mn)||1, st=(w-p*2)/(vals.length-1);
      const pts=vals.map((v,i)=>`${(p+i*st).toFixed(1)},${(h-p-((v-mn)/rg)*(h-p*2)).toFixed(1)}`).join(' ');
      return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline points="${pts}"/></svg>`;
    }

    function buildActions(D){
      const a=[];
      const _cs = D._dataHealth?.code;
      if(_cs?.stale) a.push(['high', tf('The collector is running OLD code — {0} was changed at {1}, after the server started at {2}. Everything below may be stale. Restart: {3}', _cs.newestFile, fmt(_cs.newestChangedAt), fmt(_cs.processStarted), _cs.restartCmd),'health']);
      const {securityAlerts:al, appCredentials:ac, adminAccounts:adm, mfaStatus:mfa,
             riskySignins:rs, accountSummary:acc, securityIncidents:inc, threatHunting:th,
             intuneDevices:dv, entraAccess:ea} = D;
      if(inc?.available && inc.activeCount>0) a.push(['high', tf('{0} active security incident(s) — investigate in Defender', inc.activeCount),'threats']);
      if(al?.available && al.count>0) a.push(['high', tf('{0} active security alert(s) — needs review', al.count),'threats']);
      if(th?.available && (th.clickedThreats||[]).length) a.push(['high', tf('{0} malicious-URL click(s) — check exposed users', th.clickedThreats.length),'hunting']);
      if(ac?.available){
        const exp=ac.expiring.filter(x=>x.daysLeft<0).length;
        const soon=ac.expiring.filter(x=>x.daysLeft>=0&&x.daysLeft<=30).length;
        if(exp) a.push(['high', tf('{0} expired app credential(s)', exp),'appcreds']);
        if(soon) a.push(['med', tf('{0} app credential(s) expiring within 30 days', soon),'appcreds']);
      }
      if(adm?.available){
        if(adm.globalAdminCount>4) a.push(['med', tf('{0} Global Admins — exceeds recommended (2-4)', adm.globalAdminCount),'roles']);
        const o=adm.topAccounts?.[0];
        if(o && o.count>=8) a.push(['med', tf('{0} holds {1} high-risk roles — consider PIM', o.name||o.upn, o.count),'roles']);
      }
      if(mfa?.available && mfa.percent<90){
        const miss=mfa.total-mfa.mfaRegistered;
        a.push([mfa.percent<60?'high':'med', tf('{0} users without MFA ({1}% registered)', miss, mfa.percent),'mfa']);
      }
      if(acc?.available && acc.guestsPending>0) a.push(['med', tf('{0} pending guest invite(s) — review/clean up', acc.guestsPending),'accounts']);
      if(rs?.available && rs.failed>0) a.push([rs.failRate>=20?'med':'low',
        rs.failRate!=null ? tf('{0} failed sign-in(s) in the last {1}d ({2}% fail rate)', rs.failed, rs.windowDays||7, rs.failRate)
                          : tf('{0} failed sign-in(s) in the last {1}d', rs.failed, rs.windowDays||7),'signins']);
      if(rs?.available && (rs.sprayIps||[]).length) a.push(['high', tf('Password-spray pattern: {0} source IP(s) failing against multiple accounts', rs.sprayIps.length),'signins']);
      if(rs?.available && rs.riskSignalHigh) a.push(['high', tf('{0} high-signal sign-in event(s) — a success after repeated failures, or a success from a country this tenant does not normally use', rs.riskSignalHigh),'signins']);
      if(rs?.available && rs.caFailedCount>0) a.push(['med', tf('{0} Conditional Access failure(s) in {1}d — see CA diagnostics', rs.caFailedCount, rs.windowDays||7),'ca']);
      if(rs?.available && rs.caReportOnlyBlockCount>0) a.push(['high', tf('Report-only CA pilot would BLOCK {0} sign-in(s) / {1} user(s) — fix before enforcing', rs.caReportOnlyBlockCount, rs.caReportOnlyUsers),'ca']);
      else if(rs?.available && rs.caReportOnlyInterruptCount>0) a.push(['low', tf('Report-only CA pilot would interrupt {0} sign-in(s) — expected rollout cost, review', rs.caReportOnlyInterruptCount),'ca']);
      else if(rs?.available && rs.caReportOnlyPolicyCount>0) a.push(['info', tf('CA pilot running in report-only on {0} policy(ies) — no impact in {1}d so far', rs.caReportOnlyPolicyCount, rs.windowDays||7),'ca']);
      if(rs?.available && rs.legacyAuthCount>0) a.push(['med', tf('Legacy auth in use: {0} sign-in(s), {1} user(s) — bypasses MFA, block via CA', rs.legacyAuthCount, rs.legacyUsers),'ca']);
      if(dv?.available && dv.noncompliant>0) a.push([dv.noncompliant>=dv.total?'high':'med', tf('{0} non-compliant device(s) of {1} enrolled', dv.noncompliant, dv.total),'devices']);
      const di=D.deviceIdentity;
      if(di?.available && di.phantomLinkCount>0) a.push([di.phantomLinkCount>=di.enrolled/2?'high':'med',
        tf('{0} device(s) have Intune bound to a phantom stub — device-based CA cannot be enforced for them until they re-register', di.phantomLinkCount),'devid']);
      else if(di?.available && di.problem>0) a.push(['med',
        tf('{0} of {1} device(s) have an incoherent identity — device-based CA cannot be enforced for them', di.problem, di.enrolled),'devid']);
      if(di?.available && di.untaggedSignInCount>0) a.push(['high',
        tf('{0} device(s) sign in with an UNTAGGED object — device-filter policies will block them', di.untaggedSignInCount),'devid']);
      const spGA=(adm?.servicePrincipalRoles||[]).filter(s=>s.role==='Global Administrator');
      if(adm?.available && spGA.length) a.push(['high',
        tf('{0} service principal(s) hold Global Administrator ({1}) — not covered by MFA or CA; review partner relationships', spGA.length, spGA.map(s=>s.name).join(', ')),'roles']);
      if(adm?.available && (adm.disabledWithRoles||[]).length) a.push(['med',
        tf('{0} disabled account(s) still hold directory roles — remove the role, not just the sign-in', adm.disabledWithRoles.length),'roles']);
      const ni = rs?.nonInteractive;
      if(ni?.available && ni.stuckCount>0) a.push(['high',
        tf('{0} account(s) blocked by Conditional Access with NO successful sign-in afterwards ({1}h, non-interactive logs) — unattended identities cannot answer an MFA prompt', ni.stuckCount, ni.windowHours),'ca']);
      if(ni?.available && ni.flappingCount>0) a.push(['med',
        tf('{0} account(s) still being blocked in the last {1} minutes despite succeeding elsewhere — usually one client stuck in a retry loop', ni.flappingCount, ni.recentMinutes),'ca']);
      if(acc?.available && acc.guestsDormant>0) a.push(['med',
        tf('{0} guest account(s) with no sign-in in {1} days — standing external access', acc.guestsDormant, acc.dormantDays),'accounts']);
      if(acc?.available && acc.guestsNeverSignedIn>0) a.push(['low',
        tf('{0} guest(s) accepted an invitation but have never signed in', acc.guestsNeverSignedIn),'accounts']);
      const un=D.unattendedAccounts;
      if(un?.available && un.exposedCount>0) a.push(['high',
        tf('{0} unattended account(s) (Teams Rooms / shared device) are in scope of an MFA policy — they cannot answer a prompt, so they will be locked out', un.exposedCount),'ca']);
      const sp=D.sharepointSharing;
      if(sp?.available && sp.anonymousLinksEnabled) a.push(['high',
        t('SharePoint anonymous "Anyone with the link" sharing is ON — that access has no identity, so no Conditional Access or MFA policy applies to it'),'sharing']);
      if(sp?.available && sp.legacyAuthEnabled) a.push(['med',
        t('Legacy authentication protocols are enabled for SharePoint — an MFA bypass path'),'sharing']);
      if(sp?.available && sp.externalResharingEnabled) a.push(['med',
        t('External users can re-share SharePoint content — access spreads beyond who you invited'),'sharing']);
      const dlp=D.dlpSimulation;
      if(dlp?.available && dlp.policyCount===0) a.push(['med',
        t('No Purview DLP policy — nothing is measuring whether sensitive data leaves. That is an absence of measurement, not a clean result'),'dlp']);
      const dsim=dlp?.simulation;
      if(dsim && (dsim.exchangeByClass?.external||0)>0) a.push(['high',
        tf('DLP: {0} mail match(es) involve {1} external domain(s) — this is the evidence for the {2} decision on enforcing',
           dsim.exchangeByClass.external, dsim.exchangeDomains.filter(d=>d.kind==='external').length, dsim.reviewOn||t('review')),'dlp']);
      if(dsim && !dsim.testing) a.push(['med',
        tf('DLP policy "{0}" is in {1} — it is no longer measurement-only and can act on users', dsim.name, dsim.mode),'dlp']);
      if(dsim && dsim.daysToReview!=null && dsim.daysToReview<=0) a.push(['med',
        tf('DLP simulation review was due {0} — measuring without deciding just leaves a policy behind', dsim.reviewOn),'dlp']);
      if(dlp?.available && dlp.stale) a.push(['low',
        tf('DLP snapshot is {0}h old — re-run scripts/purview/dlp_simulation_collector.ps1', dlp.ageHours),'dlp']);
      if(adm?.available && (adm.readPrivileged||[]).length) {
        const n=adm.readPrivileged.reduce((s,r)=>s+r.members.length,0);
        a.push(['low', tf('{0} read-all role holder(s) (e.g. Global Reader) — can read all config and logs; confirm each is needed', n),'roles']);
      }
      if(ea?.available && !ea.securityDefaults && ea.caPolicyCount===0) a.push(['high', t('No baseline access policy — Security Defaults off and no Conditional Access policies'),'ca']);
      else if(ea?.available && !ea.securityDefaults && !ea.mfaEnforcedByCa) a.push(['high', t('No MFA-enforcing Conditional Access policy while Security Defaults is off'),'ca']);
      if(acc?.available && acc.disabled>0) a.push(['low', tf('{0} disabled account(s) — periodic cleanup', acc.disabled),'accounts']);
      const rank={high:0,med:1,low:2,info:3};
      return a.sort((x,y)=>rank[x[0]]-rank[y[0]]);
    }

    function tabAlerts(D){
      const out={};
      for(const [s,,tab] of buildActions(D)){
        if(!tab || (s!=='high' && s!=='med')) continue;
        const key = parentOf(resolveTab(tab));
        const e = out[key] || (out[key]={high:0, med:0});
        e[s]++;
      }
      return out;
    }

    function tabOverview(D){
      const ss=D.secureScore, mfa=D.mfaStatus, adm=D.adminAccounts, al=D.securityAlerts,
            acc=D.accountSummary, rs=D.riskySignins, dv=D.intuneDevices;
      const sPct = (ss?.available && ss.max) ? Math.round(ss.current/ss.max*100) : null;
      let k='';
      k+=kpi(sPct!=null?`${sPct}<small>%</small>`:'—', 'Secure Score', ss?.available?`${ss.current}/${ss.max}`:'', sPct==null?'':sPct>=80?'ok':sPct>=50?'warn':'bad', PORTAL.secureScore);
      k+=kpi(mfa?.available?`${mfa.percent}<small>%</small>`:'—', 'MFA Registration', mfa?.available?`${mfa.mfaRegistered}/${mfa.total}`:'', mfa?.available?(mfa.percent>=90?'ok':mfa.percent>=60?'warn':'bad'):'', PORTAL.entraMfaReg);
      k+=kpi(adm?.available?adm.globalAdminCount:'—', 'Global Admins', 'Recommended 2-4', adm?.available?(adm.globalAdminCount<=4?'ok':'warn'):'', PORTAL.entraRoles);
      k+=kpi(al?.available?al.count:'N/A', 'Active Alerts', al?.available?'':'Permission needed', al?.available?(al.count>0?'bad':'ok'):'info', PORTAL.alerts);
      k+=kpi(acc?.available?acc.guests:'—', 'External Guests', acc?.available?tf('{0} pending', acc.guestsPending):'', acc?.available?(acc.guestsPending>0?'warn':'ok'):'', PORTAL.entraGuests);
      k+=kpi(acc?.available?acc.total:'—', 'Total Accounts', acc?.available?tf('{0} disabled', acc.disabled):'', 'info', PORTAL.entraUsers);
      k+=kpi(rs?.available?rs.failed:'—', 'Failed Sign-ins', rs?.available?`last ${rs.windowDays||7}d`:'', rs?.available?(rs.failRate>=20?'bad':rs.failed>0?'warn':'ok'):'', PORTAL.entraSignIns);
      k+=kpi(dv?.available?dv.noncompliant:'—', 'Non-compliant Devices', dv?.available?tf('of {0} enrolled', dv.total):'', dv?.available?(dv.noncompliant>0?'bad':'ok'):'', PORTAL.intuneDevices);
      const dcb=rs?.deviceCaBlockUsers24h||0, dcbW=rs?.deviceCaBlockUsers||0;
      k+=kpi(!rs?.available?'—':rs.deviceCaClassifiable===false?'?':dcb,
             'Blocked by Device CA',
             !rs?.available?'':rs.deviceCaClassifiable===false?'policy list unreadable'
               :dcb?tf('{0} sign-in(s), last 24h', rs.deviceCaBlockEvents24h)
               :dcbW?tf('none in 24h · {0} earlier this week', dcbW)
               :`none in ${rs.windowDays}d`,
             !rs?.available?'':rs.deviceCaClassifiable===false?'warn'
               :dcb?'bad':dcbW?'warn':'ok',
             PORTAL.entraSignIns);

      const ce=D.caExceptions;
      const ceN=ce?.actionNeeded||0, ceX=ce?.expiringCount||0;
      k+=kpi(!ce?.available?'—':ceN||ceX,
             'CA Exceptions to Act On',
             !ce?.available?''
               :ceN?`${ce.overdueCount} overdue · ${ce.undocumentedCount} unrecorded`
               :ceX?`due within ${ce.expiringSoonDays}d — never expires by itself`
               :'all recorded and within date',
             !ce?.available?'':ceN?'bad':ceX?'warn':'ok',
             PORTAL.entraCA);

      const acts=buildActions(D);
      const tabLabel=id=>{ id=resolveTab(id);
        const p=t((PARENTS.find(x=>x.id===parentOf(id))||{}).label||'');
        const c=childOf(id);
        return c && c.id!==parentOf(id) ? `${p} › ${t(c.label)}` : p; };
      const actBody = acts.length ? acts.map(([s,txt,tab])=>{
        const dest = tab ? resolveTab(tab) : '';
        const go = tab ? `<a class="act-go" href="#${dest}" title="${esc(tf('Go to {0}', tabLabel(tab)))}">${esc(tabLabel(tab))} →</a>` : '';
        return `<div class="action">${fsev({severity:s})}<span class="txt">${esc(txt)}</span>${go}</div>`;
      }).join('')
        : `<div class="empty">${esc(t('✅ No priority action items.'))}</div>`;

      const hist=D._history||[];
      let trendBody;
      if(hist.length>=2){
        const tcard=(label,key,suffix)=>{
          const vals=hist.map(h=>h[key]).filter(v=>v!=null);
          if(vals.length<2) return '';
          const last=vals[vals.length-1];
          return `<div class="kpi"><div class="kpi-val" style="font-size:19px">${last}${suffix||''}</div>
                  <div class="kpi-label">${label}</div>${sparkline(vals)}</div>`;
        };
        trendBody=`<div class="kpis" style="margin:0">${tcard('Secure Score','secureScorePct','%')}${tcard('Active Incidents','activeIncidents','')}${tcard('Active Alerts','activeAlerts','')}${tcard('MFA Registration','mfaPercent','%')}</div>`;
      } else {
        trendBody=`<div class="empty">Collecting trend data — shown after 2+ collections (auto-collect / Collect now).</div>`;
      }

      const ai=D._aiOverview;
      let aiHtml='';
      if(ai && ai.available){
        const aiTxt = (LANG==='ko' ? (ai.textKo || ai.text) : (ai.textEn || ai.text)) || '';
        const aiOld = LANG==='ko' && !ai.textKo
          ? `<div class="muted sm" style="margin:0 0 6px">${esc(t('This summary predates the bilingual output — showing the English one. The next collection will produce Korean.'))}</div>`
          : '';
        aiHtml=`<div class="panel ai"><div class="panel-h"><span>${esc(t('🤖 AI Security Summary'))}</span>
          <span class="sub">${esc(ai.model||'')} · ${fmt(ai.generatedAt)}</span></div>
          <div class="panel-b">${aiOld}<div class="ai-text">${mdLite(aiTxt)}</div></div></div>`;
      } else if(ai && ai.reason){
        aiHtml=panel('🤖 AI Security Summary','', `<div class="muted" style="font-size:13px">${esc(t(ai.reason))}</div>`);
      }

      const hh = sourceHealth(D);
      const downHtml = hh.down.length
        ? `<div class="notice" style="margin-bottom:14px">⚠ <b>${hh.down.length} of ${hh.total} data source(s) did not collect.</b>
             Anything those sources would have flagged is <b>missing from this page, not resolved</b> —
             a collection failure looks identical to a fixed problem.
             <div style="margin-top:8px">${hh.down.map(d=>
               `<div style="margin:3px 0"><b>${esc(t(d.label))}</b> <span class="muted sm">— ${esc(t(d.reason))}</span></div>`
             ).join('')}</div></div>`
        : '';

      return downHtml + aiHtml +
        `<div class="kpis">${k}</div>` +
        panel('Priority Action Items', 'Auto-derived from dashboard data · by severity', actBody) +
        panel('Trends', tf('{0} collection points', hist.length), trendBody);
    }

    function tabRoles(D){
      let html='';
      const adm=D.adminAccounts;
      if(adm?.available){
        const who=m=>{
          const nm=esc(m.name||m.upn||'?');
          const bits=[];
          if(m.kind==='servicePrincipal') bits.push(`<span class="badge b-high" title="Service principal - an app credential, not a person">app</span>`);
          if(m.kind==='group') bits.push(`<span class="badge b-med" title="Role assigned to a GROUP - membership changes silently change who is admin">group</span>`);
          if(m.enabled===false) bits.push(`<span class="badge b-med" title="Account is disabled but still holds the role">disabled</span>`);
          if(m.scoped) bits.push(`<span class="badge b-info" title="Scoped to part of the directory, not tenant-wide">scoped</span>`);
          return `<span class="trunc">${nm}</span> ${bits.join(' ')}`;
        };
        const memberList=r=>r.members.map(m=>who(m)).join('<br>');
        const ga = table(['Account','Type'], (adm.globalAdmins||[]).map(m=>[esc(m.name||''),`<span class="mono sm muted">${esc(m.upn||'(service principal)')}</span>`]));
        const top = table(['Account','Roles held'], (adm.topAccounts||[]).map(a=>{
          const cls=a.count>=8?'b-high':a.count>=4?'b-med':'b-ok';
          return [`<span class="trunc">${esc(a.name||a.upn)}</span>`, `<span class="badge ${cls}">${a.count}</span>`];
        }));
        const roleLink = ext(PORTAL.entraRoles, 'Entra Roles');
        html += `<div class="grid2">${panel('Global Admins', `${adm.globalAdminCount}`, ga, roleLink)}
                 ${panel('Top Role Holders', 'Over-privilege check · PIM candidates', help('Accounts holding many admin roles are a single point of compromise. <b>PIM</b> (Entra ID P2) can grant these roles just-in-time instead of permanently.') + top, roleLink)}</div>`;

        const sps=adm.servicePrincipalRoles||[];
        if(sps.length){
          const ga_sp=sps.filter(s=>s.role==='Global Administrator');
          html += panel('Service Principals with Directory Roles',
            ga_sp.length ? tf('{0} assignment(s) · {1} GLOBAL ADMIN', sps.length, ga_sp.length)
                         : tf('{0} assignment(s)', sps.length),
            help('These are <b>app credentials</b>, not people, and they are not covered by MFA or Conditional Access user policies. Partner/CSP delegated-admin apps (e.g. <i>Support</i>, <i>Partner Center Web App</i>) appear here — if the partner relationship is no longer needed, remove it: it is a standing tenant-wide admin path. Review under Settings › Partner relationships.')
            + table(['Service principal','Role'], sps.map(s=>[
                `<span class="trunc">${esc(s.name||'?')}</span>`,
                s.role==='Global Administrator'?`<span class="badge b-high">${esc(s.role)}</span>`:`<span class="badge b-med">${esc(s.role)}</span>`])),
            roleLink);
        }

        if((adm.privileged||[]).length){
          html += panel('Control Roles', tf('{0} role(s) with members', adm.highRiskRoleCount),
            help('Roles that can <b>change</b> the tenant. Compromise here means loss of control.')
            + table(['Role','Members'], adm.privileged.map(r=>[esc(r.role), memberList(r)])), roleLink);
        }
        if((adm.readPrivileged||[]).length){
          html += panel('Read-All Roles', tf('{0} role(s) with members', adm.readPrivilegedCount),
            help('Roles such as <b>Global Reader</b> cannot change anything but can read <b>everything</b> — all configuration, directory data, sign-in logs, Defender and Exchange settings. Compromise here is a complete reconnaissance win, so treat these as privileged and keep them to who genuinely needs them.')
            + table(['Role','Members'], adm.readPrivileged.map(r=>[esc(r.role), memberList(r)])), roleLink);
        }
        if((adm.otherRoles||[]).length){
          html += panel('Other Assigned Roles', tf('{0} role(s)', adm.otherRoleCount),
            help('Every remaining directory role that has a member. Shown for completeness — the previous version of this card only queried a fixed list of roles and so missed assignments entirely.')
            + table(['Role','Members'], adm.otherRoles.map(r=>[esc(r.role), memberList(r)])), roleLink);
        }
        if((adm.disabledWithRoles||[]).length){
          html += panel('Disabled Accounts Still Holding Roles', `${adm.disabledWithRoles.length}`,
            `<div class="notice">⚠ A disabled account keeps its role assignments. If the account is ever re-enabled the privileges come back with it — remove the role, not just the sign-in.</div>`
            + table(['Account','Role'], adm.disabledWithRoles.map(d=>[
                `<span class="trunc">${esc(d.name||d.upn||'?')}</span>`, `<span class="badge b-med">${esc(d.role)}</span>`])),
            roleLink);
        }
      } else if(adm){ html += panel('Admin Role Accounts','',notice(adm)); }
      return html;
    }

    function tabMfa(D){
      let html='';
      const mfa=D.mfaStatus;
      if(mfa?.available){
        const body = `<div class="score-row" style="margin-bottom:12px"><div class="kpi-val">${mfa.percent}<small>%</small></div>
          <div class="bar"><span style="width:${mfa.percent}%"></span></div>
          <span class="muted">${mfa.mfaRegistered} / ${mfa.total} registered</span></div>` +
          table(['Users without MFA'], mfa.notRegistered.map(u=>[`<span class="mono sm trunc">${esc(u)}</span>`]),{scroll:300});
        html += panel('MFA Registration', mfa.percent>=90?'Good':'Needs improvement', help('Accounts without MFA are the easiest to compromise. Aim for 90%+ registration; the list below shows who still needs it.') + body,
          ext(PORTAL.entraMfaReg, 'Entra · Registration details'));
      } else if(mfa){ html += panel('MFA Registration','',notice(mfa)); }
      return html;
    }

    function caPolicyPanel(D){
      let html='';
      const ea=D.entraAccess;
      if(ea?.available){
        const sd=ea.securityDefaults;
        let k = kpi(sd?'ON':'OFF','Security Defaults', sd?'baseline MFA enforced':'not enforced', sd?'ok':(ea.caPolicyCount?'info':'bad'), PORTAL.entraProps);
        k += kpi(ea.caPolicyCount,'Conditional Access',
        ea.caReportOnlyCount ? tf('{0} on · {1} report-only', ea.caEnabledCount||0, ea.caReportOnlyCount)
                             : tf('{0} on', ea.caEnabledCount||0), ea.caPolicyCount?'':'info', PORTAL.entraCA);
        k += kpi(ea.namedLocationCount,'Named Locations', null, '', PORTAL.entraNamedLoc);
        if(ea.exclusionTotal!=null){
          k += kpi(ea.exclusionTotal,'Policy Exclusions',
                   (ea.exclusionUnacknowledged!=null && ea.exclusionAckConfigured
                      ? `${ea.exclusionUnacknowledged} unacknowledged · ${ea.exclusionDistinct} principal(s)`
                      : tf('{0} distinct principal(s)', ea.exclusionDistinct)),
                   ea.exclusionTotal?'warn':'ok', PORTAL.entraCA);
          if(ea.exclusionUnresolvable) k += kpi(ea.exclusionUnresolvable,'Ghost Exclusions','GUID resolves to nothing','bad',PORTAL.entraCA);
        }
        let body = `<div class="kpis" style="margin:0">${k}</div>`;
        if(ea.caPolicies?.length){
          const exCell=p=>{
            if(!p.excluded) return '<span class="badge b-zero">—</span>';
            if(!p.excluded.length) return '<span class="badge b-ok">none</span>';
            const names=p.excluded.map(e=>e.name||('(unresolvable '+String(e.id).slice(0,8)+')')).join(', ');
            const cls=p.excludedUnresolvable?'b-high':p.excludedUnacknowledged?'b-med':'b-ok';
            return `<span class="badge ${cls}" title="${esc(names)}">${p.excluded.length}</span>`
              + ` <span class="muted sm trunc" style="white-space:normal">${esc(names)}</span>`;
          };
          const rows=ea.caPolicies.map(p=>[
            `<span class="trunc">${esc(p.name)}</span>`,
            p.state==='enabled'?`<span class="badge b-ok">On</span>`:p.state==='disabled'?`<span class="badge b-info">Off</span>`:`<span class="badge b-med">Report-only</span>`,
            `<span class="muted nw">${esc(p.users)} · ${esc(p.apps)}</span>`,
            [...(p.controls||[]).map(c=>`<span class="badge ${c==='block'?'b-high':'b-low'}">${esc(c)}</span>`),
             ...(p.sessionControls||[]).map(c=>`<span class="badge b-info" title="Session control">${esc(c)}</span>`)].join(' ')||'—',
            exCell(p),
            `<span class="acts">${p.id?rowLink(deepLink.caPolicy(p.id),'↗','Open this CA policy in the Entra portal'):''}</span>`]);
          body += table(['Policy','State','Scope','Controls','Excluded',''],rows);
          if(ea.exclusionTotal && !ea.exclusionAckConfigured){
            body += `<div class="muted" style="font-size:12px;margin-top:6px">${t('<b>Excluded</b> lists who each policy does <i>not</i> apply to — an exclusion silently survives every later hardening. Set <code>CA_ACKNOWLEDGED_EXCLUSIONS</code> (semicolon-separated UPNs) to mark the intended ones (break-glass, room accounts) so anything unexpected stands out instead of every row looking the same.')}</div>`;
          }
        } else if(sd){
          body += `<div class="muted" style="font-size:12px;margin-top:8px">${esc(t('Security Defaults is ON, so no custom Conditional Access policies are in use (the two are mutually exclusive). Moving to tailored CA policies gives finer control — per-app MFA, block legacy auth, location/device rules.'))}</div>`;
        } else {
          body += `<div class="notice" style="margin-top:8px">⚠ ${esc(t('Security Defaults is OFF and no Conditional Access policies exist — there is no baseline MFA enforcement.'))}</div>`;
        }
        html += panel('Entra ID Access Policies', 'Security Defaults · Conditional Access (P1)', help('<b>Security Defaults</b> = free baseline (MFA for everyone, block legacy auth). <b>Conditional Access</b> (Entra ID P1) replaces it with granular rules. Exactly one is active at a time.') + body,
          ext(PORTAL.entraCA, 'Entra · Conditional Access'));
      } else if(ea){ html += panel('Entra ID Access Policies','',notice(ea)); }
      return html;
    }

        let kk=kpi(acc.total,'Total Accounts',null,'',PORTAL.entraUsers)+kpi(acc.enabled,'Enabled','enabled','ok',PORTAL.entraUsers)+
               kpi(acc.disabled,'Disabled','disabled',acc.disabled>0?'warn':'ok',PORTAL.entraUsers)+

               kpi(acc.guests,'External Guests',gsub,acc.guestsPending>0?'warn':'ok',PORTAL.entraGuests);

          ext(PORTAL.entraUsers, 'Entra · Users'));

    function guestPanel(acc){
      const list = acc.guestList || [];
      if(!list.length && !acc.guests) return '';
      const link = ext(PORTAL.entraGuests, 'Entra · Guests');
      if(!list.length){
        return panel('Guest Accounts', `${acc.guests} guest(s)`,
          `<div class="empty">Guest detail not collected.</div>`, link);
      }
      let k = kpi(acc.guestsActive||0,'Active',tf('signed in within {0}d', acc.dormantDays),'ok');
      k += kpi(acc.guestsDormant||0,'Dormant',tf('no sign-in in {0}d', acc.dormantDays), acc.guestsDormant?'warn':'ok');
      k += kpi(acc.guestsPending||0,'Never accepted','invitation still open', acc.guestsPending?'warn':'ok');
      k += kpi(acc.guestsNeverSignedIn||0,'Accepted, never used','accepted but zero sign-ins', acc.guestsNeverSignedIn?'warn':'ok');

      const who = g => g.mail || (g.upn||'').split('#EXT#')[0].replace(/_/g,'@');
      const rows = list.map(g=>[
        `<span class="trunc">${esc(g.name||'—')}</span>`,
        `<span class="mono sm trunc">${esc(who(g))}</span>`,
        g.pending?`<span class="badge b-med" title="Invitation sent but never accepted">Never accepted</span>`
          :g.enabled?`<span class="badge b-ok">Accepted</span>`
          :`<span class="badge b-info">Disabled</span>`,
        g.neverSignedIn?`<span class="badge b-med">never</span>`
          :`<span class="mono sm nw">${fmt(g.lastActivity)}</span>`,
        g.daysIdle==null?`<span class="badge b-zero">—</span>`
          :g.daysIdle>=acc.dormantDays?`<span class="badge b-high">${g.daysIdle}d</span>`
          :g.daysIdle>=30?`<span class="badge b-med">${g.daysIdle}d</span>`
          :`<span class="badge b-ok">${g.daysIdle}d</span>`,
        g.invited?`<span class="mono sm nw">${fmt(g.invited)}</span>`:'—']);

      const body = help('A guest is a standing external identity in your tenant. <b>Never accepted</b> = the '
        + 'invitation was never used; <b>Dormant</b> = accepted but idle, which is access nobody is watching. '
        + 'Idle time uses interactive <i>and</i> non-interactive sign-ins, so a guest who only opens shared '
        + 'files through a silently-refreshing client is not mistaken for dormant. Reporting latency is a few '
        + 'hours, so this measures months of idleness, not what happened in the last minute.')
        + `<div class="kpis" style="margin:0 0 10px">${k}</div>`
        + table(['Name','External address','State','Last activity','Idle','Invited'], rows, {scroll:400})
        + (acc.guestListTruncated ? `<div class="muted" style="font-size:12px;margin-top:6px">List capped for display; the counts above cover every guest.</div>` : '');
      return panel('Guest Accounts',
        tf('{0} guest(s) · {1} need review', acc.guests, (acc.guestsDormant||0)+(acc.guestsPending||0)),
        body, link);
    }
