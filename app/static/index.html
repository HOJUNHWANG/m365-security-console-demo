<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
  <title>MS365 SecOps Console</title>
  <style>
    :root {
      --bg:#0a0e16; --bg2:#0c1119; --panel:#10151f; --panel2:#151b27; --elev:#1a2230;
      --border:#273244; --border2:#354258; --text:#eef1f6; --muted:#9aa6ba;
      --accent:#3b9eff; --accent2:#6366f1;
      --ok:#22c55e; --warn:#f5a623; --bad:#ef4444; --info:#7c8ba0;
      --hover:rgba(255,255,255,.04); --scroll:#2b3647; --radius:12px;
      --shadow:0 1px 2px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.28);
      /* text/icon colour that sits ON an --accent fill (refresh button, gradients).
         White works on every dark-accent theme; the pale-accent themes flip it. */
      --on-accent:#ffffff;
    }
    /* Each block below overrides only what it changes — every other custom property
       falls through from :root, so severity colours stay semantic unless restated. */
    [data-theme="bw"]{
      --bg:#000000; --bg2:#060606; --panel:#0c0c0c; --panel2:#151515; --elev:#1e1e1e;
      --border:#292929; --border2:#3f3f3f; --text:#f5f5f5; --muted:#a3a3a3;
      --accent:#ffffff; --accent2:#c9c9c9; --on-accent:#000000;
      --info:#8f8f8f; --hover:rgba(255,255,255,.06); --scroll:#333333;
    }
    [data-theme="blackgold"]{
      --bg:#0a0908; --bg2:#0e0c0a; --panel:#13110d; --panel2:#1a1712; --elev:#221e17;
      --border:#332d21; --border2:#4a4230; --text:#f6f0e2; --muted:#b8a985;
      --accent:#d4af37; --accent2:#f2d675; --on-accent:#1a1408;
      --ok:#5cb87a; --warn:#fb923c; --bad:#ef5350; --info:#8c8067;
      --hover:rgba(212,175,55,.07); --scroll:#3b3425;
    }
    [data-theme="whitegold"]{
      --bg:#faf7ef; --bg2:#f3eee1; --panel:#ffffff; --panel2:#fbf8f0; --elev:#ffffff;
      --border:#e9e1cd; --border2:#d2c5a6; --text:#221e15; --muted:#6d6450;
      /* gold clears 4.5:1 on a white panel only once darkened this far; --accent2
         keeps the bright gold for gradient fills, where nothing is read on top */
      --accent:#8a6a12; --accent2:#c9a227; --on-accent:#ffffff;
      --ok:#15803d; --warn:#b45309; --bad:#dc2626; --info:#7a705a;
      --hover:rgba(34,30,21,.05); --scroll:#d9cfb5;
      --shadow:0 1px 2px rgba(60,50,20,.06), 0 6px 18px rgba(60,50,20,.07);
    }
    [data-theme="pastel-light"]{
      --bg:#f6f4fb; --bg2:#eeeaf7; --panel:#ffffff; --panel2:#f8f6fd; --elev:#ffffff;
      --border:#e7e1f2; --border2:#cec4e4; --text:#312d43; --muted:#6e6786;
      --accent:#6d5eb8; --accent2:#5fa8c4; --on-accent:#ffffff;
      --ok:#22754e; --warn:#97601c; --bad:#b53a48; --info:#7d7694;
      --hover:rgba(49,45,67,.045); --scroll:#d7cee9;
      --shadow:0 1px 2px rgba(60,50,90,.05), 0 6px 18px rgba(60,50,90,.07);
    }
    [data-theme="pastel-dark"]{
      --bg:#1b1926; --bg2:#1f1d2b; --panel:#252333; --panel2:#2c2a3c; --elev:#332f45;
      --border:#3a374f; --border2:#4b4665; --text:#eae7f3; --muted:#a8a2bf;
      --accent:#b3a4e6; --accent2:#9ad6c8; --on-accent:#1b1926;
      --ok:#8bd8ac; --warn:#e9c37f; --bad:#ee9aa1; --info:#8e88a7;
      --hover:rgba(255,255,255,.05); --scroll:#403c58;
    }
    * { box-sizing:border-box; }
    /* theme-matched scrollbars */
    * { scrollbar-width:thin; scrollbar-color:var(--scroll) transparent; }
    ::-webkit-scrollbar { width:10px; height:10px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:var(--scroll); border-radius:6px; border:2px solid var(--bg); }
    ::-webkit-scrollbar-thumb:hover { background:var(--border2); }
    ::-webkit-scrollbar-corner { background:transparent; }
    .nw { white-space:nowrap; }
    html,body { margin:0; height:100%; }
    body { font-family:"Segoe UI",system-ui,-apple-system,sans-serif; background:var(--bg);
           color:var(--text); font-size:14px; display:flex; flex-direction:column; height:100vh;
           -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; text-rendering:optimizeLegibility; }
    code, .mono { font-family:"Cascadia Code",Consolas,monospace; }

    /* ===== Header ===== */
    header { display:flex; align-items:center; justify-content:space-between; gap:16px;
             height:56px; padding:0 20px; background:var(--panel); border-bottom:1px solid var(--border);
             flex-shrink:0; }
    .brand { display:flex; align-items:center; gap:10px; font-weight:600; font-size:15px; letter-spacing:.2px; }
    .brand .dot { width:9px; height:9px; border-radius:50%; background:var(--ok); box-shadow:0 0 8px var(--ok); }
    .hdr-right { display:flex; align-items:center; gap:14px; }
    .hdr-meta { color:var(--muted); font-size:12px; }
    /* Stale data must look different from fresh data. Before, an hours-old snapshot was rendered
       exactly like a current one, so a stopped collector was indistinguishable from a healthy one. */
    .hdr-meta.stale { color:var(--bad); font-weight:600; }
    .hdr-meta.stale::before { content:'⚠ '; }
    .chip { font-size:12px; padding:4px 10px; border-radius:6px; border:1px solid var(--border);
            background:var(--panel2); }
    .chip.alert { color:var(--warn); border-color:rgba(245,166,35,.4); }
    /* Collection health. A source that fails to collect reports available:false, and every action-item
       check is guarded on it - so a dead source makes its warnings VANISH rather than turn red, and a
       collection failure looks exactly like a fixed problem. This chip is the only thing that tells
       them apart, so it is in the header where it shows on every tab, not buried in one panel. */
    .chip.src-ok   { color:var(--muted); }
    .chip.src-down { color:var(--bad); border-color:rgba(224,72,72,.45); font-weight:600; cursor:help; }
    .chip.src-down::before { content:'⚠ '; }
    button.refresh { background:transparent; color:var(--accent); border:1px solid rgba(59,158,255,.4);
                     border-radius:6px; padding:6px 14px; font-weight:600; cursor:pointer; font-size:13px; }
    button.refresh:hover { background:rgba(59,158,255,.1); }
    button.refresh:disabled { opacity:.5; cursor:default; }

    /* ===== Layout ===== */
    .shell { display:flex; flex:1; min-height:0; }
    nav.side { width:236px; background:var(--panel); border-right:1px solid var(--border);
               padding:12px 0; flex-shrink:0; overflow-y:auto; }
    nav.side .nav-item { display:flex; align-items:center; gap:10px; padding:8px 14px 8px 18px; cursor:pointer;
               color:var(--muted); font-size:13.5px; border-left:3px solid transparent; }
    nav.side .nav-item:hover { background:var(--panel2); color:var(--text); }
    nav.side .nav-item.active { color:var(--text); background:var(--panel2); border-left-color:var(--accent); font-weight:600; }
    nav.side .nav-item .ic { width:18px; text-align:center; flex-shrink:0; }
    /* Two lines per item: the name, and a 1-2 word hint of what the tab actually shows. With 14
       tabs the name alone ("Posture", "Identity") no longer says which one holds what. */
    nav.side .nav-item .nav-txt { display:flex; flex-direction:column; gap:1px; min-width:0; flex:1; }
    nav.side .nav-item .nav-hint { font-size:9.5px; letter-spacing:.06em; text-transform:uppercase;
               font-weight:600; color:var(--muted); opacity:.62; white-space:nowrap;
               overflow:hidden; text-overflow:ellipsis; }
    nav.side .nav-item.active .nav-hint { opacity:.85; color:var(--accent); }
    nav.side .nav-item:hover .nav-hint { opacity:.8; }
    /* Attention counter per tab, so a problem is visible without opening every tab. */
    nav.side .nav-badge { flex-shrink:0; min-width:18px; height:18px; padding:0 5px; border-radius:9px;
               font-size:10px; font-weight:700; display:inline-flex; align-items:center;
               justify-content:center; line-height:1; }
    nav.side .nav-badge.nb-high { background:var(--bad); color:#fff; }
    nav.side .nav-badge.nb-med  { background:rgba(245,166,35,.22); color:var(--warn);
               box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--warn) 45%, transparent); }
    /* Two-level nav. Hovering a parent drops its children in below it; the group also stays open
       while one of its children is active, so you can see where you are. In-flow expansion rather
       than a floating popover - a floating menu over a 236px rail is fiddly to hit. */
    /* max-height rather than display:none so open/close is animatable. 260px covers the largest
       group (4 children) with room to spare, and overflow keeps it clipped while collapsing. */
    nav.side .nav-sub { max-height:0; overflow:hidden; opacity:0; position:relative;
      transition:max-height .22s cubic-bezier(.4,0,.2,1), opacity .16s ease; }
    nav.side .nav-group:hover .nav-sub, nav.side .nav-group.open .nav-sub { max-height:260px; opacity:1; }
    /* A guide rail under the parent's icon ties the children to their parent - indentation alone
       reads as an unrelated list. */
    nav.side .nav-sub::before { content:''; position:absolute; left:27px; top:1px; bottom:5px;
      width:1px; background:var(--border); }
    nav.side .nav-sub .nav-item { padding:6px 14px 6px 40px; font-size:12.5px; position:relative; }
    nav.side .nav-sub .nav-item::before { content:''; position:absolute; left:26px; top:50%;
      width:8px; height:1px; background:var(--border); }
    nav.side .nav-sub .nav-item .nav-hint { font-size:9px; }
    /* The CHILD selection gets the strong treatment; the parent only gets a quiet cue, so picking
       the first child no longer looks like two separate things are selected. */
    nav.side .nav-sub .nav-item.active { background:color-mix(in srgb,var(--accent) 16%, transparent);
      color:var(--text); font-weight:600; border-radius:0 8px 8px 0; }
    nav.side .nav-sub .nav-item.active::before { background:var(--accent); width:10px; left:25px; }
    nav.side .nav-item.parent-open { color:var(--text); }
    nav.side .nav-item.parent-open .ic { color:var(--accent); }
    nav.side .nav-item .caret { margin-left:auto; font-size:9px; opacity:.4;
      transition:transform .22s cubic-bezier(.4,0,.2,1), opacity .16s ease; }
    nav.side .nav-group:hover .nav-item .caret, nav.side .nav-group.open .nav-item .caret {
      opacity:.9; transform:rotate(180deg); }
    nav.side .nav-sec { padding:14px 18px 6px; font-size:10.5px; letter-spacing:.08em; color:var(--muted);
               opacity:.7; text-transform:uppercase; }

    main { flex:1; overflow-y:auto; padding:22px 26px; min-width:0; }
    .tab-head { margin:0 0 4px; font-size:19px; font-weight:600; }
    .tab-sub { color:var(--muted); font-size:13px; margin-bottom:18px; }

    /* ===== Panels ===== */
    .panel { background:var(--panel); border:1px solid var(--border); border-radius:10px;
             margin-bottom:18px; overflow:hidden; }
    .panel-h { display:flex; align-items:center; justify-content:space-between; gap:8px;
               padding:13px 16px; border-bottom:1px solid var(--border); font-weight:600; font-size:14px; }
    .panel-h .sub { color:var(--muted); font-size:12px; font-weight:400; }
    .panel-b { padding:14px 16px; }
    .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
    /* A grid2 whose sibling was filtered out must not leave the survivor in a half-width column.
       panel() returns '' when the current sub-tab does not own it, so nine `<div class="grid2">` call
       sites can each end up with one child - Recent Failed Sign-ins rendered at half width with its
       Error column hidden behind a horizontal scrollbar. Fixed here rather than at nine call sites:
       rewriting those means editing nested template literals, which is where a typo hides. */
    .grid2 > :only-child { grid-column: 1 / -1; }
    @media (max-width:980px){ .grid2 { grid-template-columns:1fr; } }

    /* ===== KPI ===== */
    .kpis { display:grid; grid-template-columns:repeat(auto-fill,minmax(172px,1fr)); gap:14px; margin-bottom:18px; }
    .kpi { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:15px 16px 14px 19px; position:relative; overflow:hidden; }
    .kpi::before { content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--info); }
    .kpi.ok::before{background:var(--ok);} .kpi.warn::before{background:var(--warn);} .kpi.bad::before{background:var(--bad);}
    .kpi-val { font-size:27px; font-weight:700; line-height:1.05; }
    .kpi-val small { font-size:14px; color:var(--muted); font-weight:600; }
    .kpi-label { color:var(--muted); font-size:12px; margin-top:6px; font-weight:500; }
    .kpi-sub { font-size:11px; margin-top:3px; color:var(--info); }

    /* ===== Tables ===== */
    .tbl-wrap { overflow-x:auto; }
    /* Vertically scrollable table with a pinned header. Used for log-shaped tables that can run to
       dozens of rows; without it a single panel pushes every panel below it off the screen. */
    .tbl-scroll { overflow-y:auto; overscroll-behavior:contain;
                  border:1px solid var(--border); border-radius:8px; }
    .tbl-scroll table.tbl th { position:sticky; top:0; z-index:2; background:var(--panel);
                  /* sticky cells drop their own border when scrolled, so draw it as a shadow */
                  box-shadow:inset 0 -1px 0 var(--border2); }
    .tbl-scroll table.tbl tr:last-child td { border-bottom:0; }
    .tbl-note { color:var(--muted); font-size:11.5px; margin-top:6px; text-align:right; }
    table.tbl { width:100%; border-collapse:collapse; font-size:13px; }
    table.tbl th { text-align:left; color:var(--muted); font-weight:600; font-size:11px; text-transform:uppercase;
                   letter-spacing:.05em; padding:9px 12px; border-bottom:1px solid var(--border2); white-space:nowrap; }
    /* baseline, not top: a cell holding a .badge (11px inside an inline-block with padding) builds a
       taller line box than a cell of plain 13px text or 12px .mono.sm. Aligning the BOXES to the top
       therefore leaves the GLYPHS on three different heights across one row. Aligning baselines puts
       the text itself on one line regardless of font size or whether it is wrapped in a pill.
       line-height is pinned so every cell's first line box is built from the same strut. */
    table.tbl td { padding:9px 12px; border-bottom:1px solid var(--border);
                   vertical-align:baseline; line-height:1.5; }
    table.tbl tbody tr:nth-child(even) td { background:color-mix(in srgb, var(--text) 3%, transparent); }
    table.tbl tr:last-child td { border-bottom:0; }
    table.tbl tbody tr:hover td { background:var(--hover); }
    /* ===== Mailbox Delegation — by-mailbox / by-delegate dropdown (accordion) ===== */
    .del-controls { display:flex; align-items:center; gap:14px; margin-bottom:11px; flex-wrap:wrap; }
    .del-search { flex:1; min-width:190px; color:var(--text); border:1px solid var(--border); border-radius:8px;
                  padding:7px 11px; font-size:12.5px; outline:none; background:color-mix(in srgb, var(--text) 4%, transparent); }
    .del-search:focus { border-color:color-mix(in srgb,var(--accent) 45%, transparent); }
    .del-search::placeholder { color:var(--muted); }
    .del-lnk { cursor:pointer; color:var(--muted); font-size:12px; user-select:none; white-space:nowrap; }
    .del-lnk:hover { color:var(--accent); }
    .del-acc { border:1px solid var(--border); border-radius:9px; margin-bottom:7px; overflow:hidden;
               background:color-mix(in srgb, var(--text) 2%, transparent); }
    .del-acc[open] { border-color:var(--border2); }
    .del-acc > summary { list-style:none; cursor:pointer; display:flex; align-items:center; gap:10px; padding:9px 12px; user-select:none; }
    .del-acc > summary::-webkit-details-marker { display:none; }
    .del-acc > summary:hover { background:var(--hover); }
    .del-caret { color:var(--muted); font-size:10px; transition:transform .15s ease; flex-shrink:0; }
    .del-acc[open] > summary .del-caret { transform:rotate(90deg); }
    .del-name { font-weight:600; font-size:13px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .del-count { display:inline-block; flex-shrink:0; padding:1px 8px; border-radius:999px; font-size:11px; font-weight:600;
                 color:var(--muted); background:color-mix(in srgb, var(--text) 8%, transparent); }
    .del-inner { padding:0 12px 8px 34px; }
    .del-inner table { width:100%; border-collapse:collapse; font-size:12.5px; }
    .del-inner td { padding:6px 8px; border-top:1px solid var(--border); vertical-align:top; }
    .del-inner tr:first-child td { border-top:0; }
    .del-inner td.di-perms { text-align:right; white-space:nowrap; width:1%; }
    .del-empty { color:var(--muted); font-size:12.5px; padding:10px 2px; }
    .trunc { max-width:340px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .muted { color:var(--muted); } .mono.sm { font-size:12px; }

    /* ===== Badges / dots ===== */
    /* line-height/vertical-align pinned so the pill's text sits on the same baseline as the plain
       text beside it - with the default (normal / baseline-of-last-line) the padding shifts the pill
       relative to unwrapped text and the two drift apart. */
    .badge { font-size:11px; padding:2px 9px; border-radius:999px; font-weight:600; white-space:nowrap;
             display:inline-block; line-height:1.5; vertical-align:baseline; }
    .b-high{ background:rgba(239,68,68,.16); color:#fca5a5; }
    .b-med { background:rgba(245,166,35,.16); color:#fcd34d; }
    .b-low { background:rgba(59,158,255,.16); color:#93c5fd; }
    .b-ok  { background:rgba(34,197,94,.16); color:#86efac; }
    .b-info{ background:rgba(148,163,184,.16); color:#cbd5e1; }
    /* A zero in a column whose non-zero values are pills. Same box metrics as a badge so the column
       reads as one column instead of alternating 13px plain text with an 11px pill. */
    .b-zero{ background:transparent; color:var(--muted); font-weight:500; }

    /* ===== Action items ===== */
    .action { display:flex; align-items:baseline; gap:11px; padding:11px 0; border-bottom:1px solid var(--border); }
    .action:last-child { border-bottom:0; }
    .action .txt { flex:1; font-size:13.5px; }
    .action .act-go { flex-shrink:0; font-size:11.5px; font-weight:600; color:var(--accent);
               text-decoration:none; white-space:nowrap; opacity:.8; }
    .action .act-go:hover { opacity:1; text-decoration:underline; }
    .empty { color:var(--muted); font-size:13px; padding:6px 0; }

    /* ===== Sparkline ===== */
    .spark { width:200px; height:40px; }
    .spark polyline { fill:none; stroke:var(--accent); stroke-width:1.6; }
    .kpi .spark { width:100%; height:32px; margin-top:8px; }
    .score-row { display:flex; align-items:center; gap:22px; flex-wrap:wrap; }
    .bar { height:8px; border-radius:6px; background:var(--panel2); overflow:hidden; flex:1; min-width:160px; }
    .bar > span { display:block; height:100%; background:linear-gradient(90deg,var(--accent),#22c55e); }

    .notice { color:var(--warn); font-size:13px; padding:8px 0; }
    /* Tab-level banner. `.notice` alone is an unadorned line of text, which is fine inside a panel
       but too easy to skim past at the top of a tab - and the one thing this must not do is go
       unread, because it is the difference between a current number and a stale one. */
    .stale-banner { color:var(--warn); font-size:13px; line-height:1.5; margin:0 0 14px;
      padding:10px 13px; border:1px solid var(--warn); border-left-width:3px; border-radius:8px;
      background:color-mix(in srgb, var(--warn) 10%, transparent); }
    /* Panel-level verdict line. A table of numbers does not answer "is anything wrong?" until you
       have read it; this says so first, in the colour of the answer, and the table below is then
       the evidence rather than the question. Built on the same tokens as .stale-banner so it
       inherits every theme. */
    .verdict { font-size:13px; line-height:1.5; margin:0 0 12px; padding:9px 12px;
      border:1px solid var(--info); border-left-width:3px; border-radius:8px;
      background:color-mix(in srgb, var(--info) 9%, transparent); color:var(--info); }
    .verdict.bad  { border-color:var(--bad);  color:var(--bad);
      background:color-mix(in srgb, var(--bad) 10%, transparent); }
    .verdict.warn { border-color:var(--warn); color:var(--warn);
      background:color-mix(in srgb, var(--warn) 10%, transparent); }
    .verdict.ok   { border-color:var(--ok);   color:var(--ok);
      background:color-mix(in srgb, var(--ok) 9%, transparent); }
    .verdict b { color:inherit; }
    .ai-text { font-size:13.5px; line-height:1.7; }
    .ai-text p { margin:6px 0; }
    .ai-h { font-weight:700; color:var(--accent); margin:13px 0 4px; font-size:13px; letter-spacing:.2px; }
    .ai-h:first-child { margin-top:0; }
    .ai-list { margin:4px 0; padding-left:18px; }
    .ai-list li { margin:3px 0; }
    .panel.ai { border-left:3px solid var(--accent); }
    /* help / guidance callout */
    .help { display:flex; gap:8px; align-items:baseline; font-size:12.5px; color:var(--muted);
      background:color-mix(in srgb,var(--accent) 7%, transparent);
      border:1px solid color-mix(in srgb,var(--accent) 18%, transparent);
      border-radius:8px; padding:9px 12px; margin-bottom:13px; line-height:1.55; }
    .help-ic { color:var(--accent); font-weight:700; flex-shrink:0; }
    .help b { color:var(--text); }
    /* category filter pills */
    .fpill { display:inline-block; cursor:pointer; padding:4px 11px; border-radius:999px; border:1px solid var(--border);
      font-size:12px; margin:0 6px 6px 0; color:var(--muted); user-select:none; }
    .fpill:hover { border-color:var(--border2); color:var(--text); }
    .fpill.active { background:color-mix(in srgb,var(--accent) 16%, transparent);
      border-color:color-mix(in srgb,var(--accent) 40%, transparent); color:var(--text); font-weight:600; }
    .dscroll { max-height:440px; overflow:auto; }

    /* ===== Portal deep links (pivot out to Defender / Entra / Intune / EAC) ===== */
    .ph-right { display:flex; align-items:center; gap:10px; min-width:0; }
    .ph-right .sub { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

<body>
  <script>
    /* Applied before first paint so the page never flashes the default theme.
       THEMES must stay in sync with the <select> below; RETIRED maps the themes
       that used to exist onto their nearest survivor, so a returning browser with
       "ocean" in localStorage lands somewhere sensible instead of on a blank picker. */
    var THEMES = ['midnight','bw','blackgold','whitegold','pastel-light','pastel-dark'];
    var RETIRED = { carbon:'bw', ocean:'midnight', violet:'pastel-dark', light:'pastel-light' };
    (function(){
      function norm(t){ if(!t) return null; if(THEMES.indexOf(t)>=0) return t; return RETIRED[t] || null; }
      function pick(){
        try{
          var q = norm(new URLSearchParams(location.search).get('theme'));
          if(q){ localStorage.setItem('theme',q); return q; }
          var s = norm(localStorage.getItem('theme'));
          if(s){ localStorage.setItem('theme',s); return s; }   /* rewrite retired names */
        }catch(e){}
        try{ if(window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) return 'pastel-light'; }catch(e){}
        return 'midnight';
      }
      document.documentElement.setAttribute('data-theme',pick());
    })();
  </script>

  <script>

    const day = (s) => s ? new Date(s).toLocaleDateString('en-US') : '—';

    function setTheme(t){ document.documentElement.setAttribute('data-theme',t); try{localStorage.setItem('theme',t);}catch(e){} }

    /* ================= Microsoft portal deep links =================
       Every portal URL lives here in one place — if a portal route changes, fix it here only.
       [doc]  URL appears verbatim in Microsoft Learn docs (high confidence).
       [spa]  Undocumented portal SPA route — verify by clicking. A wrong one just lands on that
              portal's home page; it never breaks the link.

      submissions:  `${P.defender}/reportsubmission`,                // [doc]
      actionCenter: `${P.defender}/action-center`,                   // [doc]
      antispam:     `${P.defender}/antispam`,                        // [doc]
      tpsReport:    `${P.defender}/reports/TPSEmailPhishReportATP`,  // [doc]
      antiphish:    `${P.defender}/antiphishing`,                    // [spa]
      tabl:         `${P.defender}/tenantAllowBlockList`,            // [spa] tenant allow/block list
      safeLinks:    `${P.defender}/safelinksv2`,                     // [spa]
      safeAttach:   `${P.defender}/safeattachmentv2`,                // [spa]
      attackSim:    `${P.defender}/attacksimulator`,                 // [spa]
      secureScore:  `${P.defender}/securescore`,                     // [spa]

      entraUsers:   `${P.entra}/#view/Microsoft_AAD_UsersAndTenants/UserManagementMenuBlade/~/AllUsers`,

      entraAudit:   `${P.entra}/#view/Microsoft_AAD_IAM/AuditLogsMenuBlade/~/Audit`,

      spoSharing:   'https://admin.microsoft.com/#/featureexplorer/sharepoint',            // [spa]

      intuneDevices:    `${P.intune}/#view/Microsoft_Intune_DeviceSettings/DevicesMenu/~/mDMDevices`,

    // Entity-level deep links ([spa] — a wrong route just lands on the portal home)

      return `<a class="xlink" href="${esc(href)}" target="_blank" rel="noopener noreferrer"

    }

    /* ---------- toast ---------- */
    let _toastT=null;
    function toast(msg, ms){
      const el=document.getElementById('toast'); if(!el) return;
      el.textContent=msg; el.classList.add('show');
      clearTimeout(_toastT); _toastT=setTimeout(()=>el.classList.remove('show'), ms||4200);
    }
    function copyText(t){
      if(navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(t);
      return new Promise((res,rej)=>{                       // fallback for non-secure contexts (plain http://)
        const ta=document.createElement('textarea');
        ta.value=t; ta.style.position='fixed'; ta.style.opacity='0';
        document.body.appendChild(ta); ta.select();
        try{ document.execCommand('copy'); res(); }catch(e){ rej(e); }
        finally{ document.body.removeChild(ta); }
      });
    }

    /* ---------- Advanced Hunting pivot ----------
       The Defender portal has no published way to prefill KQL from a URL parameter. So we put the
       query on the clipboard and open Advanced Hunting in a new tab — paste (Ctrl+V), then Run.
       Clicking NetworkMessageId in the results opens the Email entity page (documented route). */
    const AH = {
      msg: id => `EmailEvents\n| where Timestamp > ago(30d)\n| where NetworkMessageId == "${id}"\n| project Timestamp, NetworkMessageId, SenderFromAddress, RecipientEmailAddress, Subject, ThreatTypes, DeliveryAction, DeliveryLocation, DetectionMethods`,
      sender: addr => `EmailEvents\n| where Timestamp > ago(30d)\n| where SenderFromAddress =~ "${addr}"\n| project Timestamp, NetworkMessageId, SenderFromAddress, RecipientEmailAddress, Subject, ThreatTypes, DeliveryAction, DeliveryLocation\n| order by Timestamp desc`,
      recipient: addr => `EmailEvents\n| where Timestamp > ago(30d)\n| where RecipientEmailAddress =~ "${addr}"\n| where ThreatTypes != ""\n| project Timestamp, NetworkMessageId, SenderFromAddress, Subject, ThreatTypes, DeliveryAction, DeliveryLocation\n| order by Timestamp desc`,
      senderDomain: dom => `EmailEvents\n| where Timestamp > ago(30d)\n| where SenderFromDomain =~ "${dom}"\n| project Timestamp, NetworkMessageId, SenderFromAddress, RecipientEmailAddress, Subject, ThreatTypes, DeliveryAction\n| order by Timestamp desc`,
      click: (id,url) => id
        ? `UrlClickEvents\n| where Timestamp > ago(30d)\n| where NetworkMessageId == "${id}"\n| project Timestamp, AccountUpn, Url, ActionType, IsClickedThrough, NetworkMessageId`
        : `UrlClickEvents\n| where Timestamp > ago(30d)\n| where Url =~ "${url}"\n| project Timestamp, AccountUpn, Url, ActionType, IsClickedThrough, NetworkMessageId`,
    };
    function hunt(kind, a, b){
      const q = AH[kind](a, b);
      copyText(q)
        .then(()=>toast('KQL query copied to your clipboard — paste it into Advanced Hunting (Ctrl+V) and press Run. Click NetworkMessageId in the results to open the Email entity page.', 6000))

      .replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/[\r\n]/g,' ')
      .replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}'`;

      return `<span class="rowlink" role="button" tabindex="0" title="${esc(title||'Investigate in Advanced Hunting')}"

      {id:'health',    ic:'⚕', label:'Data Health',        hint:'Collection · Graph'},
    ];
    /* Which panels the sub-tab currently being rendered owns. Set by renderMain, read by panel().
       null = no filtering (a tab without children, or anything rendering outside renderMain). */
    let _sub = null;
    function wantPanel(title){
      if(!_sub) return true;
      if(_sub.mine.has(title)) return true;
      // Unclaimed panels belong to the first child, so a panel added to a tab function later shows
      // up on its own instead of silently disappearing.
      return _sub.isFirst && !_sub.claimed.has(title);
    }
    const PARENTS   = TABS.filter(t => t.id);
    const parentOf  = id => String(id || '').split('.')[0];
    const childrenOf = id => (PARENTS.find(t => t.id === parentOf(id)) || {}).children || [];
    const childOf   = id => childrenOf(id).find(c => c.id === id) || null;
    let active = 'overview';

    /* ---------- shared render helpers ---------- */
    // Pass href to turn the whole tile into a link to that portal page.
    function kpi(val, label, sub, cls, href){
      const inner = `<div class="kpi-val">${val}</div>
              <div class="kpi-label">${esc(label)}</div>${sub?`<div class="kpi-sub">${esc(sub)}</div>`:''}`;
      if(!href) return `<div class="kpi ${cls||''}">${inner}</div>`;
      return `<a class="kpi kpi-link ${cls||''}" href="${esc(href)}" target="_blank" rel="noopener noreferrer"
               title="Open in portal ↗ ${esc(href)}">${inner}<span class="kpi-arr">↗</span></a>`;
    }
    // link = optional portal-link HTML from ext(...) — pinned to the right edge of the header.
    function panel(title, sub, body, link){
      const right = (sub || link)
        ? `<span class="ph-right">${sub?`<span class="sub">${esc(sub)}</span>`:''}${link||''}</span>` : '';
      // Sub-tab routing happens HERE rather than by hiding afterwards: hunting renders 419 KB of
      // markup across 8 panels, and hiding six of them still puts all 419 KB in the DOM. Returning
      // '' keeps the DOM to what is on screen. The body has already been computed by the caller
      // (arguments evaluate first), so this saves DOM weight, not CPU - which is the part that made
      // the page feel heavy. data-pt is still emitted as a safety net for applySubFilter.
      if(!wantPanel(title)) return '';
      return `<div class="panel" data-pt="${esc(title)}"><div class="panel-h"><span>${esc(title)}</span>${right}</div>
              <div class="panel-b">${body}</div></div>`;
    }
    // opts.scroll = pixel height at which the table starts scrolling INSIDE the panel, with the
    // header pinned. Long log tables (report-only impact, non-interactive blocks) otherwise push
    // everything below them off the page and the panel stops being skimmable.
    function table(cols, rows, opts){
      if(!rows.length) return `<div class="empty">No data to display.</div>`;
      const o = opts || {};
      const cls = 'tbl-wrap' + (o.scroll ? ' tbl-scroll' : '');
      const style = o.scroll ? ` style="max-height:${o.scroll}px"` : '';
      const note = o.scroll && rows.length > 8
        ? `<div class="tbl-note">${rows.length} rows — scroll inside the table</div>` : '';
      return `<div class="${cls}"${style}><table class="tbl"><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead>
              <tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>${note}`;
    }
    function sev(s){
      const x=(s||'').toLowerCase();
      const cls = x==='high'?'b-high':x==='medium'?'b-med':x==='low'?'b-low':'b-info';
      return `<span class="badge ${cls}">${esc(s||'—')}</span>`;
    }
    function notice(d){ return `<div class="notice">⚠ ${esc(d.reason||'No data')}</div>`; }
    function help(txt){ return `<div class="help"><span class="help-ic">ⓘ</span><span>${txt}</span></div>`; }


    /* Data on this tab may not be from the latest collection. Two mechanisms produce that, and both
       exist because the alternative was a blank tab:
         - `carried`: the source failed this cycle, so pipeline kept its last good value (any source)
         - `signinData.stale`: the shared 7-day sign-in pull failed and fell back to an earlier one
           (Risky Sign-ins, Device Identity and Browser Claims all read that one pull, so a single
           throttle used to empty all three at once - it did, all of 2026-08-05 morning)
       Either way the numbers are real but not current, which is its own hazard, so the age is stated
       on the page rather than tucked into a tooltip. */
    /* Ages are formatted by the existing fmtAge() defined further down - it already returns
       "just now" / "12 min ago" / "3h 20m ago" / "2d ago". Defining a second fmtAge here (which I did
       first) does not shadow it, it is SHADOWED BY it: both are function declarations in one script,
       so the later one wins and the banner rendered "3h 20m ago ago". Wording below therefore assumes
       the string already ends in "ago". */
    function staleNote(src){
      const c = src?.carried, s = src?.signinData;
      if(c) return `<div class="stale-banner">⚠ Showing data collected <b>${fmtAge(c.ageMin)}</b> —
        the latest collection could not refresh this section${c.reason?` (<span class="mono">${esc(c.reason)}</span>)`:''}.
        The figures below were real at that time; re-check before acting on them.</div>`;
      if(s?.stale) return `<div class="stale-banner">⚠ Sign-in data was last refreshed
        <b>${fmtAge(s.ageMin)}</b> — the latest pull from Graph failed (usually throttling) so the
        previous one is shown. Counts below are real but not current; re-check before acting.</div>`;
      return '';
    }
    function mdLite(t){
      const lines=esc(t).split(/\r?\n/);
      let out='', inList=false;
      const close=()=>{ if(inList){ out+='</ul>'; inList=false; } };
      for(const raw of lines){
        let l=raw.trim();
        if(!l){ close(); continue; }
        l=l.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/^#+\s*/,'');
        const b=l.match(/^[-*•]\s+(.*)/);
        if(b){ if(!inList){ out+='<ul class="ai-list">'; inList=true; } out+=`<li>${b[1]}</li>`; continue; }
        close();
        const plain=l.replace(/<[^>]+>/g,'');
        if(/:$/.test(plain) && plain.length<=42){ out+=`<div class="ai-h">${l.replace(/:\s*$/,'')}</div>`; }
        else { out+=`<p>${l}</p>`; }
      }
      close();
      return out;
    }
    function sparkline(vals){
      if(!vals || vals.length<2) return '';
      const w=200,h=40,p=3, mn=Math.min(...vals), mx=Math.max(...vals), rg=(mx-mn)||1, st=(w-p*2)/(vals.length-1);
      const pts=vals.map((v,i)=>`${(p+i*st).toFixed(1)},${(h-p-((v-mn)/rg)*(h-p*2)).toFixed(1)}`).join(' ');
      return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline points="${pts}"/></svg>`;
    }

    /* ---------- action items (overview) ---------- */
    /* Each action is [severity, text, tabId]. The tab id serves two purposes: the Overview action
       item becomes a link straight to the tab that can act on it, and the nav shows a per-tab
       attention count - so a problem is visible without opening all 14 tabs looking for it. */
    function buildActions(D){
      const a=[];
      const {securityAlerts:al, appCredentials:ac, adminAccounts:adm, mfaStatus:mfa,
             riskySignins:rs, accountSummary:acc, securityIncidents:inc, threatHunting:th,
             intuneDevices:dv, entraAccess:ea} = D;
      if(inc?.available && inc.activeCount>0) a.push(['high', `${inc.activeCount} active security incident(s) — investigate in Defender`,'threats']);
      if(al?.available && al.count>0) a.push(['high', `${al.count} active security alert(s) — needs review`,'threats']);
      if(th?.available && th.urlClicks>0) a.push(['high', `${th.urlClicks} malicious-URL click(s) — check exposed users`,'hunting']);
      if(ac?.available){
        const exp=ac.expiring.filter(x=>x.daysLeft<0).length;
        const soon=ac.expiring.filter(x=>x.daysLeft>=0&&x.daysLeft<=30).length;
        if(exp) a.push(['high', `${exp} expired app credential(s)`,'appcreds']);
        if(soon) a.push(['med', `${soon} app credential(s) expiring within 30 days`,'appcreds']);
      }
      if(adm?.available){
        if(adm.globalAdminCount>4) a.push(['med', `${adm.globalAdminCount} Global Admins — exceeds recommended (2-4)`,'roles']);
        const o=adm.topAccounts?.[0];
        if(o && o.count>=8) a.push(['med', `${o.name||o.upn} holds ${o.count} high-risk roles — consider PIM`,'roles']);
      }
      if(mfa?.available && mfa.percent<90){
        const miss=mfa.total-mfa.mfaRegistered;
        a.push([mfa.percent<60?'high':'med', `${miss} users without MFA (${mfa.percent}% registered)`,'mfa']);
      }
      if(acc?.available && acc.guestsPending>0) a.push(['med', `${acc.guestsPending} pending guest invite(s) — review/clean up`,'accounts']);
      if(rs?.available && rs.failed>0) a.push([rs.failRate>=20?'med':'low', `${rs.failed} failed sign-in(s) in last ${rs.windowDays||7}d${rs.failRate!=null?` (${rs.failRate}% fail rate)`:''}`,'signins']);
      if(rs?.available && (rs.sprayIps||[]).length) a.push(['high', `Password-spray pattern: ${rs.sprayIps.length} source IP(s) failing against multiple accounts`,'signins']);
      if(rs?.available && rs.caFailedCount>0) a.push(['med', `${rs.caFailedCount} Conditional Access failure(s) in ${rs.windowDays||7}d — see CA diagnostics`,'ca']);
      if(rs?.available && rs.caReportOnlyBlockCount>0) a.push(['high', `Report-only CA pilot would BLOCK ${rs.caReportOnlyBlockCount} sign-in(s) / ${rs.caReportOnlyUsers} user(s) — fix before enforcing`,'ca']);
      else if(rs?.available && rs.caReportOnlyInterruptCount>0) a.push(['low', `Report-only CA pilot would interrupt ${rs.caReportOnlyInterruptCount} sign-in(s) — expected rollout cost, review`,'ca']);
      else if(rs?.available && rs.caReportOnlyPolicyCount>0) a.push(['info', `CA pilot running in report-only on ${rs.caReportOnlyPolicyCount} policy(ies) — no impact in ${rs.windowDays||7}d so far`,'ca']);
      if(rs?.available && rs.legacyAuthCount>0) a.push(['med', `Legacy auth in use: ${rs.legacyAuthCount} sign-in(s), ${rs.legacyUsers} user(s) — bypasses MFA, block via CA`,'ca']);
      if(dv?.available && dv.noncompliant>0) a.push([dv.noncompliant>=dv.total?'high':'med', `${dv.noncompliant} non-compliant device(s) of ${dv.total} enrolled`,'devices']);
      // Device identity mismatch: device-based CA silently fails on these, and no portal shows it
      const di=D.deviceIdentity;
      if(di?.available && di.phantomLinkCount>0) a.push([di.phantomLinkCount>=di.enrolled/2?'high':'med',
        `${di.phantomLinkCount} device(s) have Intune bound to a phantom stub — device-based CA cannot be enforced for them until they re-register`,'devid']);
      else if(di?.available && di.problem>0) a.push(['med',
        `${di.problem} of ${di.enrolled} device(s) have an incoherent identity — device-based CA cannot be enforced for them`,'devid']);
      if(di?.available && di.untaggedSignInCount>0) a.push(['high',
        `${di.untaggedSignInCount} device(s) sign in with an UNTAGGED object — device-filter policies will block them`,'devid']);
      // Service principals with directory roles are unattended credentials, exempt from user CA/MFA
      const spGA=(adm?.servicePrincipalRoles||[]).filter(s=>s.role==='Global Administrator');
      if(adm?.available && spGA.length) a.push(['high',
        `${spGA.length} service principal(s) hold Global Administrator (${spGA.map(s=>s.name).join(', ')}) — not covered by MFA or CA; review partner relationships`,'roles']);
      if(adm?.available && (adm.disabledWithRoles||[]).length) a.push(['med',
        `${adm.disabledWithRoles.length} disabled account(s) still hold directory roles — remove the role, not just the sign-in`,'roles']);
      // Non-interactive CA blocks with no subsequent success. An account that cannot complete a
      // prompt has nobody to answer it - this is the signal that was structurally invisible before.
      const ni = rs?.nonInteractive;
      if(ni?.available && ni.stuckCount>0) a.push(['high',
        `${ni.stuckCount} account(s) blocked by Conditional Access with NO successful sign-in afterwards `
        + `(${ni.windowHours}h, non-interactive logs) — unattended identities cannot answer an MFA prompt`,'ca']);
      if(ni?.available && ni.flappingCount>0) a.push(['med',
        `${ni.flappingCount} account(s) still being blocked in the last ${ni.recentMinutes} minutes despite `
        + `succeeding elsewhere — usually one client stuck in a retry loop`,'ca']);
      // Guest hygiene: standing external access nobody is watching
      if(acc?.available && acc.guestsDormant>0) a.push(['med',
        `${acc.guestsDormant} guest account(s) with no sign-in in ${acc.dormantDays} days — standing external access`,'accounts']);
      if(acc?.available && acc.guestsNeverSignedIn>0) a.push(['low',
        `${acc.guestsNeverSignedIn} guest(s) accepted an invitation but have never signed in`,'accounts']);
      // Unattended identities (Teams Rooms, shared-device, virtual-user accounts) cannot answer an
      // MFA prompt. A tenant-wide "require MFA" policy does not prompt them - it locks them out.
      // This is not hypothetical: the 2026-07-30 cutover blocked both conference rooms for 2 hours.
      const un=D.unattendedAccounts;
      if(un?.available && un.exposedCount>0) a.push(['high',
        `${un.exposedCount} unattended account(s) (Teams Rooms / shared device) are in scope of an MFA policy — they cannot answer a prompt, so they will be locked out`,'ca']);
      // Anonymous sharing is the one setting that puts access entirely outside CA's reach.
      // NOTE (2026-08-03): the actual anonymous links are now enumerated by the sharingLinks source
      // and shown in its own panel on the External Sharing tab. Wiring those counts into the action
      // list / nav badges was deliberately left out for now - left as a design note.
      const sp=D.sharepointSharing;
      if(sp?.available && sp.anonymousLinksEnabled) a.push(['high',
        'SharePoint anonymous "Anyone with the link" sharing is ON — that access has no identity, so no Conditional Access or MFA policy applies to it','sharing']);
      if(sp?.available && sp.legacyAuthEnabled) a.push(['med',
        'Legacy authentication protocols are enabled for SharePoint — an MFA bypass path','sharing']);
      if(sp?.available && sp.externalResharingEnabled) a.push(['med',
        'External users can re-share SharePoint content — access spreads beyond who you invited','sharing']);
      if(adm?.available && (adm.readPrivileged||[]).length) {
        const n=adm.readPrivileged.reduce((s,r)=>s+r.members.length,0);
        a.push(['low', `${n} read-all role holder(s) (e.g. Global Reader) — can read all config and logs; confirm each is needed`,'roles']);
      }
      if(ea?.available && !ea.securityDefaults && ea.caPolicyCount===0) a.push(['high', 'No baseline access policy — Security Defaults off and no Conditional Access policies','ca']);
      else if(ea?.available && !ea.securityDefaults && !ea.mfaEnforcedByCa) a.push(['high', 'No MFA-enforcing Conditional Access policy while Security Defaults is off','ca']);
      if(acc?.available && acc.disabled>0) a.push(['low', `${acc.disabled} disabled account(s) — periodic cleanup`,'accounts']);
      const rank={high:0,med:1,low:2,info:3};
      return a.sort((x,y)=>rank[x[0]]-rank[y[0]]);
    }

    /* Per-tab attention counts for the nav badges. Only high/med count - low/info would make
       every tab look alarming and the badge would stop meaning anything. */
    function tabAlerts(D){
      const out={};
      for(const [s,,tab] of buildActions(D)){
        if(!tab || (s!=='high' && s!=='med')) continue;
        // Roll the count up to the PARENT nav item, and resolve moved ids first. Without this an
        // action pointing at a child (or at a renamed id like 'appcreds') keyed a badge onto an id
        // that no longer appears in the nav, so the badge silently vanished.
        const key = parentOf(resolveTab(tab));
        const e = out[key] || (out[key]={high:0, med:0});
        e[s]++;
      }
      return out;
    }

    /* ---------- tab renderers ---------- */
    function tabOverview(D){
      const ss=D.secureScore, mfa=D.mfaStatus, adm=D.adminAccounts, al=D.securityAlerts,
            acc=D.accountSummary, rs=D.riskySignins, dv=D.intuneDevices;
      const sPct = (ss?.available && ss.max) ? Math.round(ss.current/ss.max*100) : null;
      let k='';
      k+=kpi(sPct!=null?`${sPct}<small>%</small>`:'—', 'Secure Score', ss?.available?`${ss.current}/${ss.max}`:'', sPct==null?'':sPct>=80?'ok':sPct>=50?'warn':'bad', PORTAL.secureScore);
      k+=kpi(mfa?.available?`${mfa.percent}<small>%</small>`:'—', 'MFA Registration', mfa?.available?`${mfa.mfaRegistered}/${mfa.total}`:'', mfa?.available?(mfa.percent>=90?'ok':mfa.percent>=60?'warn':'bad'):'', PORTAL.entraMfaReg);
      k+=kpi(adm?.available?adm.globalAdminCount:'—', 'Global Admins', 'Recommended 2-4', adm?.available?(adm.globalAdminCount<=4?'ok':'warn'):'', PORTAL.entraRoles);
      k+=kpi(al?.available?al.count:'N/A', 'Active Alerts', al?.available?'':'Permission needed', al?.available?(al.count>0?'bad':'ok'):'info', PORTAL.alerts);
      k+=kpi(acc?.available?acc.guests:'—', 'External Guests', acc?.available?`${acc.guestsPending} pending`:'', acc?.available?(acc.guestsPending>0?'warn':'ok'):'', PORTAL.entraGuests);
      k+=kpi(acc?.available?acc.total:'—', 'Total Accounts', acc?.available?`${acc.disabled} disabled`:'', 'info', PORTAL.entraUsers);
      k+=kpi(rs?.available?rs.failed:'—', 'Failed Sign-ins', rs?.available?`last ${rs.windowDays||7}d`:'', rs?.available?(rs.failRate>=20?'bad':rs.failed>0?'warn':'ok'):'', PORTAL.entraSignIns);
      k+=kpi(dv?.available?dv.noncompliant:'—', 'Non-compliant Devices', dv?.available?`of ${dv.total} enrolled`:'', dv?.available?(dv.noncompliant>0?'bad':'ok'):'', PORTAL.intuneDevices);

      const acts=buildActions(D);
      // Each row links to the tab that can act on it - reading the item and finding the detail
      // used to be two separate hunts.
      // Handles child ids and moved ids, so the link text never comes out blank.
      const tabLabel=id=>{ id=resolveTab(id);
        const p=(PARENTS.find(t=>t.id===parentOf(id))||{}).label||'';
        const c=childOf(id);
        return c && c.id!==parentOf(id) ? `${p} › ${c.label}` : p; };
      const actBody = acts.length ? acts.map(([s,t,tab])=>{
        const dest = tab ? resolveTab(tab) : '';
        const go = tab ? `<a class="act-go" href="#${dest}" title="Go to ${esc(tabLabel(tab))}">${esc(tabLabel(tab))} →</a>` : '';
        return `<div class="action">${sev(s==='high'?'High':s==='med'?'Medium':s==='low'?'Low':'Info')}<span class="txt">${esc(t)}</span>${go}</div>`;
      }).join('')
        : `<div class="empty">✅ No priority action items.</div>`;

      const hist=D._history||[];
      let trendBody;
      if(hist.length>=2){
        const tcard=(label,key,suffix)=>{
          const vals=hist.map(h=>h[key]).filter(v=>v!=null);
          if(vals.length<2) return '';
          const last=vals[vals.length-1];
          return `<div class="kpi"><div class="kpi-val" style="font-size:19px">${last}${suffix||''}</div>
                  <div class="kpi-label">${label}</div>${sparkline(vals)}</div>`;
        };
        trendBody=`<div class="kpis" style="margin:0">${tcard('Secure Score','secureScorePct','%')}${tcard('Active Incidents','activeIncidents','')}${tcard('Active Alerts','activeAlerts','')}${tcard('MFA Registration','mfaPercent','%')}</div>`;
      } else {
        trendBody=`<div class="empty">Collecting trend data — shown after 2+ collections (auto-collect / Collect now).</div>`;
      }

      const ai=D._aiOverview;
      let aiHtml='';
      if(ai && ai.available){
        aiHtml=`<div class="panel ai"><div class="panel-h"><span>🤖 AI Security Summary</span>
          <span class="sub">${esc(ai.model||'')} · ${fmt(ai.generatedAt)}</span></div>
          <div class="panel-b"><div class="ai-text">${mdLite(ai.text)}</div></div></div>`;
      } else if(ai && ai.reason){
        aiHtml=panel('🤖 AI Security Summary','', `<div class="muted" style="font-size:13px">${esc(ai.reason)}</div>`);
      }

      /* Sources that failed to collect, stated plainly. The header chip carries this too, but a
         tooltip is easy to miss and the consequence is easy to misread: the warnings those sources
         would have raised are simply ABSENT below, not resolved. Rendered only when something is
         down, so a healthy tenant sees nothing. */
      const hh = sourceHealth(D);
      const downHtml = hh.down.length
        ? `<div class="notice" style="margin-bottom:14px">⚠ <b>${hh.down.length} of ${hh.total} data source(s) did not collect.</b>
             Anything those sources would have flagged is <b>missing from this page, not resolved</b> —
             a collection failure looks identical to a fixed problem.
             <div style="margin-top:8px">${hh.down.map(d=>
               `<div style="margin:3px 0"><b>${esc(d.label)}</b> <span class="muted sm">— ${esc(d.reason)}</span></div>`
             ).join('')}</div></div>`
        : '';

      return downHtml + aiHtml +
        `<div class="kpis">${k}</div>` +
        panel('Priority Action Items', 'Auto-derived from dashboard data · by severity', actBody) +
        panel('Trends', `${hist.length} collection points`, trendBody);
    }

    /* ---- Identity, split into four tabs -------------------------------------------------
       These were one "Identity & Access" tab with seven panels. Role exposure, MFA coverage,
       account inventory and app-secret expiry are answered at different times by different
       questions, so they are now separate destinations. ------------------------------------ */
    function tabRoles(D){
      let html='';
      const adm=D.adminAccounts;
      if(adm?.available){
        // A role holder can be a user, a service principal or a group - the kind matters:
        // a service principal with Global Administrator is an unattended credential, not a person.
        const who=m=>{
          const nm=esc(m.name||m.upn||'?');
          const bits=[];
          if(m.kind==='servicePrincipal') bits.push(`<span class="badge b-high" title="Service principal - an app credential, not a person">app</span>`);
          if(m.kind==='group') bits.push(`<span class="badge b-med" title="Role assigned to a GROUP - membership changes silently change who is admin">group</span>`);
          if(m.enabled===false) bits.push(`<span class="badge b-med" title="Account is disabled but still holds the role">disabled</span>`);
          if(m.scoped) bits.push(`<span class="badge b-info" title="Scoped to part of the directory, not tenant-wide">scoped</span>`);
          return `<span class="trunc">${nm}</span> ${bits.join(' ')}`;
        };
        const memberList=r=>r.members.map(m=>who(m)).join('<br>');
        const ga = table(['Account','Type'], (adm.globalAdmins||[]).map(m=>[esc(m.name||''),`<span class="mono sm muted">${esc(m.upn||'(service principal)')}</span>`]));
        const top = table(['Account','Roles held'], (adm.topAccounts||[]).map(a=>{
          const cls=a.count>=8?'b-high':a.count>=4?'b-med':'b-ok';
          return [`<span class="trunc">${esc(a.name||a.upn)}</span>`, `<span class="badge ${cls}">${a.count}</span>`];
        }));
        const roleLink = ext(PORTAL.entraRoles, 'Entra Roles');
        html += `<div class="grid2">${panel('Global Admins', `${adm.globalAdminCount}`, ga, roleLink)}
                 ${panel('Top Role Holders', 'Over-privilege check · PIM candidates', help('Accounts holding many admin roles are a single point of compromise. <b>PIM</b> (Entra ID P2) can grant these roles just-in-time instead of permanently.') + top, roleLink)}</div>`;

        // Service principals holding directory roles - unattended credentials with admin rights.
        // Partner/CSP delegated-admin apps show up here, and a stale partner relationship is a
        // tenant-wide admin path that no user list would ever reveal.
        const sps=adm.servicePrincipalRoles||[];
        if(sps.length){
          const ga_sp=sps.filter(s=>s.role==='Global Administrator');
          html += panel('Service Principals with Directory Roles', `${sps.length} assignment(s)${ga_sp.length?` · ${ga_sp.length} GLOBAL ADMIN`:''}`,
            help('These are <b>app credentials</b>, not people, and they are not covered by MFA or Conditional Access user policies. Partner/CSP delegated-admin apps (e.g. <i>Support</i>, <i>Partner Center Web App</i>) appear here — if the partner relationship is no longer needed, remove it: it is a standing tenant-wide admin path. Review under Settings › Partner relationships.')
            + table(['Service principal','Role'], sps.map(s=>[
                `<span class="trunc">${esc(s.name||'?')}</span>`,
                s.role==='Global Administrator'?`<span class="badge b-high">${esc(s.role)}</span>`:`<span class="badge b-med">${esc(s.role)}</span>`])),
            roleLink);
        }

        if((adm.privileged||[]).length){
          html += panel('Control Roles', `${adm.highRiskRoleCount} role(s) with members`,
            help('Roles that can <b>change</b> the tenant. Compromise here means loss of control.')
            + table(['Role','Members'], adm.privileged.map(r=>[esc(r.role), memberList(r)])), roleLink);
        }
        // Read-everything roles: no write access, but full reconnaissance value if compromised.
        if((adm.readPrivileged||[]).length){
          html += panel('Read-All Roles', `${adm.readPrivilegedCount} role(s) with members`,
            help('Roles such as <b>Global Reader</b> cannot change anything but can read <b>everything</b> — all configuration, directory data, sign-in logs, Defender and Exchange settings. Compromise here is a complete reconnaissance win, so treat these as privileged and keep them to who genuinely needs them.')
            + table(['Role','Members'], adm.readPrivileged.map(r=>[esc(r.role), memberList(r)])), roleLink);
        }
        if((adm.otherRoles||[]).length){
          html += panel('Other Assigned Roles', `${adm.otherRoleCount} role(s)`,
            help('Every remaining directory role that has a member. Shown for completeness — the previous version of this card only queried a fixed list of roles and so missed assignments entirely.')
            + table(['Role','Members'], adm.otherRoles.map(r=>[esc(r.role), memberList(r)])), roleLink);
        }
        if((adm.disabledWithRoles||[]).length){
          html += panel('Disabled Accounts Still Holding Roles', `${adm.disabledWithRoles.length}`,
            `<div class="notice">⚠ A disabled account keeps its role assignments. If the account is ever re-enabled the privileges come back with it — remove the role, not just the sign-in.</div>`
            + table(['Account','Role'], adm.disabledWithRoles.map(d=>[
                `<span class="trunc">${esc(d.name||d.upn||'?')}</span>`, `<span class="badge b-med">${esc(d.role)}</span>`])),
            roleLink);
        }
      } else if(adm){ html += panel('Admin Role Accounts','',notice(adm)); }
      return html;
    }

    function tabMfa(D){
      let html='';
      const mfa=D.mfaStatus;
      if(mfa?.available){
        const body = `<div class="score-row" style="margin-bottom:12px"><div class="kpi-val">${mfa.percent}<small>%</small></div>
          <div class="bar"><span style="width:${mfa.percent}%"></span></div>
          <span class="muted">${mfa.mfaRegistered} / ${mfa.total} registered</span></div>` +
          table(['Users without MFA'], mfa.notRegistered.map(u=>[`<span class="mono sm trunc">${esc(u)}</span>`]),{scroll:300});
        html += panel('MFA Registration', mfa.percent>=90?'Good':'Needs improvement', help('Accounts without MFA are the easiest to compromise. Aim for 90%+ registration; the list below shows who still needs it.') + body,
          ext(PORTAL.entraMfaReg, 'Entra · Registration details'));
      } else if(mfa){ html += panel('MFA Registration','',notice(mfa)); }
      return html;
    }

    /* Entra access policies. Moved out of Identity and into its own Access Control tab together
       with the CA evaluation evidence, so policy configuration and policy outcome sit side by
       side - which is what you need when deciding whether a policy is safe to enforce. */
    function caPolicyPanel(D){
      let html='';
      const ea=D.entraAccess;
      if(ea?.available){
        const sd=ea.securityDefaults;
        let k = kpi(sd?'ON':'OFF','Security Defaults', sd?'baseline MFA enforced':'not enforced', sd?'ok':(ea.caPolicyCount?'info':'bad'), PORTAL.entraProps);
        k += kpi(ea.caPolicyCount,'Conditional Access', `${ea.caEnabledCount||0} on${ea.caReportOnlyCount?` · ${ea.caReportOnlyCount} report-only`:''}`, ea.caPolicyCount?'':'info', PORTAL.entraCA);
        k += kpi(ea.namedLocationCount,'Named Locations', null, '', PORTAL.entraNamedLoc);
        // Exclusions are the standing hole in every policy and the easiest thing to forget - this
        // tenant has already had a ghost-exclusion cleanup, and four users are currently excluded
        // from the device pilots as a "temporary" measure while a re-registration is on hold.
        if(ea.exclusionTotal!=null){
          k += kpi(ea.exclusionTotal,'Policy Exclusions',
                   (ea.exclusionUnacknowledged!=null && ea.exclusionAckConfigured
                      ? `${ea.exclusionUnacknowledged} unacknowledged · ${ea.exclusionDistinct} principal(s)`
                      : `${ea.exclusionDistinct} distinct principal(s)`),
                   ea.exclusionTotal?'warn':'ok', PORTAL.entraCA);
          if(ea.exclusionUnresolvable) k += kpi(ea.exclusionUnresolvable,'Ghost Exclusions','GUID resolves to nothing','bad',PORTAL.entraCA);
        }
        let body = `<div class="kpis" style="margin:0">${k}</div>`;
        if(ea.caPolicies?.length){
          const exCell=p=>{
            if(!p.excluded) return '<span class="badge b-zero">—</span>';
            if(!p.excluded.length) return '<span class="badge b-ok">none</span>';
            const names=p.excluded.map(e=>e.name||('(unresolvable '+String(e.id).slice(0,8)+')')).join(', ');
            const cls=p.excludedUnresolvable?'b-high':p.excludedUnacknowledged?'b-med':'b-ok';
            return `<span class="badge ${cls}" title="${esc(names)}">${p.excluded.length}</span>`
              + ` <span class="muted sm trunc" style="white-space:normal">${esc(names)}</span>`;
          };
          const rows=ea.caPolicies.map(p=>[
            `<span class="trunc">${esc(p.name)}</span>`,
            p.state==='enabled'?`<span class="badge b-ok">On</span>`:p.state==='disabled'?`<span class="badge b-info">Off</span>`:`<span class="badge b-med">Report-only</span>`,
            `<span class="muted nw">${esc(p.users)} · ${esc(p.apps)}</span>`,
            [...(p.controls||[]).map(c=>`<span class="badge ${c==='block'?'b-high':'b-low'}">${esc(c)}</span>`),
             ...(p.sessionControls||[]).map(c=>`<span class="badge b-info" title="Session control">${esc(c)}</span>`)].join(' ')||'—',
            exCell(p),
            `<span class="acts">${p.id?rowLink(deepLink.caPolicy(p.id),'↗','Open this CA policy in the Entra portal'):''}</span>`]);
          body += table(['Policy','State','Scope','Controls','Excluded',''],rows);
          if(ea.exclusionTotal && !ea.exclusionAckConfigured){
            body += `<div class="muted" style="font-size:12px;margin-top:6px"><b>Excluded</b> lists who each policy does <i>not</i> apply to — an exclusion silently survives every later hardening. Set <code>CA_ACKNOWLEDGED_EXCLUSIONS</code> (semicolon-separated UPNs) to mark the intended ones (break-glass, room accounts) so anything unexpected stands out instead of every row looking the same.</div>`;
          }
        } else if(sd){
          body += `<div class="muted" style="font-size:12px;margin-top:8px">Security Defaults is ON, so no custom Conditional Access policies are in use (the two are mutually exclusive). Moving to tailored CA policies gives finer control — per-app MFA, block legacy auth, location/device rules.</div>`;
        } else {
          body += `<div class="notice" style="margin-top:8px">⚠ Security Defaults is OFF and no Conditional Access policies exist — there is no baseline MFA enforcement.</div>`;
        }
        html += panel('Entra ID Access Policies', 'Security Defaults · Conditional Access (P1)', help('<b>Security Defaults</b> = free baseline (MFA for everyone, block legacy auth). <b>Conditional Access</b> (Entra ID P1) replaces it with granular rules. Exactly one is active at a time.') + body,
          ext(PORTAL.entraCA, 'Entra · Conditional Access'));
      } else if(ea){ html += panel('Entra ID Access Policies','',notice(ea)); }
      return html;
    }

    function tabAccounts(D){
      let html='';
      const acc=D.accountSummary;
      if(acc?.available){
        const gsub = acc.guestsPending>0 ? `${acc.guestsPending} pending` : null;
        let kk=kpi(acc.total,'Total Accounts',null,'',PORTAL.entraUsers)+kpi(acc.enabled,'Enabled','enabled','ok',PORTAL.entraUsers)+
               kpi(acc.disabled,'Disabled','disabled',acc.disabled>0?'warn':'ok',PORTAL.entraUsers)+
               kpi(acc.members,'Members',null,'',PORTAL.entraUsers)+
               kpi(acc.guests,'External Guests',gsub,acc.guestsPending>0?'warn':'ok',PORTAL.entraGuests);
        html += panel('Account Summary','Members / guests / enabled — pending guest invites flagged', `<div class="kpis" style="margin:0">${kk}</div>`,
          ext(PORTAL.entraUsers, 'Entra · Users'));
        html += guestPanel(acc);
      }
      return html;
    }

    /* Guest detail. The counts alone cannot answer the only question that matters about a guest -
       is anyone actually using it. A never-accepted invitation and an account idle for months are
       both standing external access that nobody is watching, and they need different remedies:
       chase the invite, or remove the access. */
    function guestPanel(acc){
      const list = acc.guestList || [];
      if(!list.length && !acc.guests) return '';
      const link = ext(PORTAL.entraGuests, 'Entra · Guests');
      if(!list.length){
        return panel('Guest Accounts', `${acc.guests} guest(s)`,
          `<div class="empty">Guest detail not collected.</div>`, link);
      }
      let k = kpi(acc.guestsActive||0,'Active',`signed in within ${acc.dormantDays}d`,'ok');
      k += kpi(acc.guestsDormant||0,'Dormant',`no sign-in in ${acc.dormantDays}d`, acc.guestsDormant?'warn':'ok');
      k += kpi(acc.guestsPending||0,'Never accepted','invitation still open', acc.guestsPending?'warn':'ok');
      k += kpi(acc.guestsNeverSignedIn||0,'Accepted, never used','accepted but zero sign-ins', acc.guestsNeverSignedIn?'warn':'ok');

      // The B2B UPN is the mangled "address#EXT#@tenant.onmicrosoft.com" form; the mail attribute
      // holds the real address, so prefer it and only fall back to un-mangling the UPN.
      const who = g => g.mail || (g.upn||'').split('#EXT#')[0].replace(/_/g,'@');
      const rows = list.map(g=>[
        `<span class="trunc">${esc(g.name||'—')}</span>`,
        `<span class="mono sm trunc">${esc(who(g))}</span>`,
        g.pending?`<span class="badge b-med" title="Invitation sent but never accepted">Never accepted</span>`
          :g.enabled?`<span class="badge b-ok">Accepted</span>`
          :`<span class="badge b-info">Disabled</span>`,
        g.neverSignedIn?`<span class="badge b-med">never</span>`
          :`<span class="mono sm nw">${fmt(g.lastActivity)}</span>`,
        g.daysIdle==null?`<span class="badge b-zero">—</span>`
          :g.daysIdle>=acc.dormantDays?`<span class="badge b-high">${g.daysIdle}d</span>`
          :g.daysIdle>=30?`<span class="badge b-med">${g.daysIdle}d</span>`
          :`<span class="badge b-ok">${g.daysIdle}d</span>`,
        g.invited?`<span class="mono sm nw">${fmt(g.invited)}</span>`:'—']);

      const body = help('A guest is a standing external identity in your tenant. <b>Never accepted</b> = the '
        + 'invitation was never used; <b>Dormant</b> = accepted but idle, which is access nobody is watching. '
        + 'Idle time uses interactive <i>and</i> non-interactive sign-ins, so a guest who only opens shared '
        + 'files through a silently-refreshing client is not mistaken for dormant. Reporting latency is a few '
        + 'hours, so this measures months of idleness, not what happened in the last minute.')
        + `<div class="kpis" style="margin:0 0 10px">${k}</div>`
        + table(['Name','External address','State','Last activity','Idle','Invited'], rows, {scroll:400})
        + (acc.guestListTruncated ? `<div class="muted" style="font-size:12px;margin-top:6px">List capped for display; the counts above cover every guest.</div>` : '');
      return panel('Guest Accounts',
        `${acc.guests} guest(s) · ${(acc.guestsDormant||0)+(acc.guestsPending||0)} need review`,
        body, link);
    }

    function tabAppCreds(D){
      let html='';
      const ac=D.appCredentials;
      if(ac?.available){
        const rows=ac.expiring.map(i=>{
          const cls=i.daysLeft<0?'b-high':i.daysLeft<=30?'b-med':'b-ok';
          const lab=i.daysLeft<0?'Expired':`${i.daysLeft} days left`;
          return [`<span class="trunc">${esc(i.app)}</span>`, i.type==='cert'?'Certificate':'Secret', esc(i.expires), `<span class="badge ${cls}">${lab}</span>`];
        });
        html += panel('App Credential Expiry', `${ac.totalCreds} total · ${ac.expiring.length} expiring/expired (60d)`,
          ac.expiring.length?table(['App','Type','Expires','Status'],rows):`<div class="empty">✅ No credentials expiring within 60 days.</div>`,
          ext(PORTAL.entraApps, 'Entra · App registrations'));
      } else if(ac){ html += panel('App Credential Expiry','',notice(ac)); }

      return html;
    }

    /* Device identity coherence. CA reads the Entra object the SIGN-IN presents; Intune tracks its
       own azureADDeviceId; the device-filter tag sits on whichever object an admin picked. When
       those disagree, a compliant + enrolled + "tagged" device is still blocked, and NEITHER the
       Intune nor the Entra portal shows the disagreement. Hence this card. */
    function deviceIdentityPanel(di){
      if(!di) return '';
      if(!di.available) return panel('Device Identity Coherence','',notice(di));
      const bad=(di.devices||[]).filter(d=>!d.ok);
      const warned=(di.devices||[]).filter(d=>d.ok&&(d.warnings||[]).length);
      let k = kpi(di.enrolled,'Enrolled','devices checked');
      k += kpi(di.healthy,'Coherent','sign-in = Intune = tag', di.healthy===di.enrolled?'ok':'');
      k += kpi(di.problem,'Mismatched','CA cannot see these correctly', di.problem?'bad':'ok');
      // A stale pointer left behind by a re-registration is cosmetic - counting it as a fault
      // made the card cry wolf on every healthy re-enrolment, so it is reported separately.
      k += kpi(di.staleIntunePointerCount||0,'Stale pointers','cosmetic, after a re-registration', (di.staleIntunePointerCount?'info':'ok'));
      k += kpi(di.phantomLinkCount||0,'Phantom links','Intune bound to a stub', di.phantomLinkCount?'bad':'ok');
      // 257 Entra objects against 12 enrolled is the unmanaged-fleet size in one number. It was
      // being collected and never shown.
      if(di.totalEntraObjects!=null) k += kpi(di.totalEntraObjects,'Entra Objects',
        `${di.enrolled} enrolled · ${di.totalEntraObjects-di.enrolled} not Intune-managed`,'info');
      // Tagged but not Intune-managed: looks approved in the portal, blocked in practice.
      if(di.tagInertCount!=null) k += kpi(di.tagInertCount,'Tag Inert','tagged but not Intune-managed', di.tagInertCount?'bad':'ok');
      let body = help('Conditional Access evaluates the Entra device object that the <b>sign-in</b> presents. Intune tracks a device by its own <code>azureADDeviceId</code>. A device-filter tag sits on whichever object was picked. This card checks all three agree:<br><b>sign-in deviceId == Intune azureADDeviceId == the tagged object</b><br>When they disagree, a device that is enrolled, compliant <i>and</i> tagged is still blocked by a device-based policy — and neither portal shows it. Tag in use: <code>'+esc(di.tag||'')+'</code>.')
        + `<div class="kpis" style="margin:0 0 8px">${k}</div>`;
      if(!bad.length){
        body += `<div class="empty">✅ Every enrolled device has one coherent identity — device-based Conditional Access can be trusted.</div>`;
      } else {
        // null is NOT "no". It means no claim-bearing sign-in in the window, so there is no object to
        // judge the tag against. Rendering that as a bare dash read as "this device is untagged" and
        // sent someone looking for a tagging problem that did not exist.
        // A verdict read off the Entra registration rather than a sign-in claim is still a verdict -
        // mark it "inferred" instead of throwing it away. dsregcmd on all five split devices
        // (2026-08-06) put WorkplaceDeviceId on exactly that object, never on the stub.
        const yn=(v,src)=>{
          const inf = src==='entraReal';
          const tip = inf?' title="No sign-in claim in this window, so this is read from the Entra object the device registers with - verified on 5/5 devices via dsregcmd WorkplaceDeviceId."':'';
          return v===true?`<span class="badge b-ok"${tip}>yes${inf?'*':''}</span>`
            :v===false?`<span class="badge b-high"${tip}>no${inf?'*':''}</span>`
            :'<span class="badge b-zero" title="Cannot be judged: no sign-in claim in this window and no non-stub Entra object to fall back on. This is NOT &quot;untagged&quot;.">can&#39;t tell</span>';
        };
        body += table(['Device','Compliance','Entra objects','Intune object','Sign-in object','Tagged?','Findings'],
          bad.map(d=>[
            `<span class="trunc">${esc(d.device||'?')}</span>`,
            d.complianceState==='compliant'?`<span class="badge b-ok">compliant</span>`:`<span class="badge b-med">${esc(d.complianceState||'?')}</span>`,
            d.entraObjectCount>1?`<span class="badge b-high" title="Duplicate objects for one physical device">${d.entraObjectCount}</span>`:`<span class="badge b-zero">${d.entraObjectCount}</span>`,
            `<span class="mono sm">${esc((d.intuneDeviceId||'—').slice(0,8))}</span> ${d.intuneObjectTrustType?`<span class="badge b-ok">${esc(d.intuneObjectTrustType)}</span>`:`<span class="badge b-high" title="No trustType - an MDM-only stub, carries no compliance state for CA">phantom</span>`}`,
            d.signInDeviceId?`<span class="mono sm">${esc(d.signInDeviceId.slice(0,8))}</span> ${d.signInExistsInEntra===false
                  // A re-registration necessarily leaves the OLD id in the sign-in window for the
                  // whole retention period, so "the claimed object is gone" is the EXPECTED reading
                  // of a device that has just been fixed. The backend already separates these -
                  // orphanSignInCount excludes them - but this badge did not, so a freshly enrolled
                  // healthy device rendered red "orphaned" and read as a fault. Same distinction,
                  // same words as the backend warning.
                  ?(d.reregistered?`<span class="badge b-med" title="Expected: the device re-registered onto a new object. Sign-in history keeps naming the old one for up to ${di.windowDays}d. The object it registers with now is Intune-managed.">stale claim</span>`
                                  :`<span class="badge b-high" title="The object this device signs in with no longer exists in Entra, and it has NOT re-registered onto a sound one.">orphaned</span>`)
                  :`<span class="badge b-info">${esc(d.signInTrustType||'—')}</span>`}`
              :d.presentedDeviceId?`<span class="mono sm">${esc(d.presentedDeviceId.slice(0,8))}</span> <span class="badge b-zero" title="No sign-in claim in ${di.windowDays}d - this is the Entra object the device registers with">registered*</span>`
              :`<span class="muted">no claim in ${di.windowDays}d</span>`,
            yn(d.presentedTagged, d.presentedSource),
            `<span class="muted" style="font-size:12px;white-space:normal">${d.problems.map(esc).join('<br>')}</span>`]));
        // Only offer the advice that applies. The untagged sentence used to print unconditionally, so
        // a table with no tagging problem still told the reader to go move a tag.
        const anyPhantom = bad.some(d=>d.intuneTargetState==='liveStub');
        const anyUntagged = bad.some(d=>d.presentedTagged===false);
        const anyUnknown = bad.some(d=>d.presentedTagged==null);
        const anyInferred = bad.some(d=>d.presentedSource==='entraReal');
        let fix = [];
        if(anyPhantom) fix.push('A <i>phantom</i> Intune link means Intune\'s <code>azureADDeviceId</code> points at an MDM-only stub (no <code>trustType</code>) instead of the real registration, so compliance is reported to an object Conditional Access never sees. Note Intune can <b>create</b> such a stub on its own to repair a dangling pointer — a new phantom does not mean the device changed.');
        if(anyUntagged) fix.push('An untagged sign-in object just needs the tag moved onto the object the device actually authenticates with (not the one Intune points at).');
        if(anyInferred) fix.push('An asterisk (<b>*</b>) means the verdict comes from the Entra object the device <i>registers</i> with rather than from a sign-in claim, because no claim landed in the window. On 2026-08-06 <code>dsregcmd</code> was collected for all five split devices and <code>WorkplaceDeviceId</code> matched that object 5/5 — never the stub. Before this fallback existed, such devices were dropped from the Tag Inert count entirely, so the one device that was both blocked <i>and</i> invisible in the log was the one missing from the number.');
        if(bad.some(d=>d.presentedTagged===true && !d.presentedSound)) fix.push('<b>Tag inert:</b> the object is tagged but <code>isManaged</code> is not <code>true</code>, and the device filter does <b>not</b> honour the tag on such an object — measured 2026-08-04, both such devices were failed by the policy 19 and 1 times despite an exact <code>Approved-Device</code> value. Tagging cannot fix it; the device must re-register (<i>Add a work or school account</i>) so Intune state attaches to the object it signs in with. Disconnect the existing work account first, then delete the stub, then re-add — deleting while the device is still attached makes Intune mint a new stub.');
        if(anyUnknown) fix.push('<b>can\'t tell</b> in the Tagged? column now means something stronger than before: no sign-in carried a device claim <i>and</i> there is no non-stub Entra object to read instead, so this device has no sound registration anywhere. It is not simply "unverified".');
        if(fix.length) body += `<div class="muted" style="font-size:12px;margin-top:8px"><b>How to read this:</b> ${fix.join(' ')}</div>`;
      }
      if(warned.length){
        body += `<div class="muted" style="font-size:12px;margin-top:10px"><b>Warnings — no action needed:</b></div>`
          + table(['Device','Intune points at','Sign-in object','Note'], warned.map(d=>[
              `<span class="trunc">${esc(d.device||'?')}</span>`,
              `<span class="mono sm">${esc((d.intuneDeviceId||'—').slice(0,8))}</span> <span class="badge b-info">${esc(d.intuneTargetState||'')}</span>`,
              d.signInDeviceId?`<span class="mono sm">${esc(d.signInDeviceId.slice(0,8))}</span> ${d.signInObjectSound?`<span class="badge b-ok">sound</span>`:''}`:'—',
              `<span class="muted" style="font-size:12px;white-space:normal">${(d.warnings||[]).map(esc).join('<br>')}</span>`]));
      }
      // Tag inventory. The tag is an admin grant by decision, and nothing in the tenant can write
      // extensionAttributes any more - so these numbers should only move when the admin moves them.
      if(di.taggedObjectCount!=null){
        const anomaly=(di.taggedNotEnrolled||[]).length;
        body += `<div class="muted sm" style="margin:10px 0 0"><b>Tag inventory</b> — ${di.taggedObjectCount} object(s) carry <code>${esc(di.tag||'')}</code>`
          + (di.taggedStubCount?` · ${di.taggedStubCount} of them are stubs (harmless: a stub is never the object CA reads)`:'')
          + (anomaly?` · <span class="badge b-high">${anomaly} tagged but NOT enrolled</span> ${esc(di.taggedNotEnrolled.join(', '))} — a tag applied outside the approval process`
                    :` · <span class="badge b-ok">no tag outside the enrolled set</span>`)
          + ((di.enrolledNotTagged||[]).length?` · ${di.enrolledNotTagged.length} enrolled device(s) not tagged: ${esc(di.enrolledNotTagged.join(', '))}`:'')
          + `</div>`;
      }
      // Rendered ONLY when something was seen. There is deliberately no "0 devices with a second
      // account" line: the tenant cannot establish that (the sign-in window is short, usersLoggedOn
      // counts Windows logons, and a work account added without "allow management" leaves no object
      // at all), so a zero would be a clean bill of health this data cannot issue.
      if((di.multiAccountDevices||[]).length){
        body += `<div class="muted sm" style="margin:8px 0 0"><span class="badge b-med">second account seen</span> `
          + di.multiAccountDevices.map(d=>`<b>${esc(d.device)}</b> ← ${esc((d.extra||[]).join(', '))}`).join(' · ')
          + ` — harmless while enrolled, but <b>re-enrolling one of these with both accounts present mints a stub</b>`
          + ` (proved on DEVICE-A: same procedure, 4h apart, second account the only difference).`
          + ` Disconnect the second account before any re-registration. Detection only —`
          + ` check the device's <i>Access work or school</i> screen, which is the only authoritative source.</div>`;
      }
      return panel('Device Identity Coherence', `${di.healthy}/${di.enrolled} coherent · last ${di.windowDays}d`, body,
        ext(PORTAL.intuneDevices, 'Intune · Devices'));
    }

    /* Browser SSO-extension rollout. There is no API that lists a browser's extensions - Graph
       cannot see them and Intune's detectedApps only covers MSI/Win32 installs - so presence is
       measured by its only observable effect: does the user's Chrome sign-in carry a device claim.
       The panel states that inference and its limit explicitly, because "missing" here means
       "not yet proven", which is a weaker claim than "not installed". */
    function browserClaimPanel(bc){
      if(!bc) return '';
