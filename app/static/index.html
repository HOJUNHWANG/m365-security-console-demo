      if(!bc.available) return panel('Browser Device Claims','',notice(bc));
      const STORE='https://chromewebstore.google.com/detail/'+bc.extensionId;
      const pct=bc.extClaimPct;
      let k = kpi(pct==null?'—':pct+'%','Chrome Claim Rate', `${bc.extBrowserClaims}/${bc.extBrowserSignins} sign-ins`,
        pct==null?'':(pct>=95?'ok':pct>=50?'warn':'bad'));
      k += kpi(bc.readyCount,'Proven Ready', bc.pilotGroup?`in ${bc.pilotGroup}`:'in scope', bc.readyCount?'ok':'');
      k += kpi(bc.missingManualCount,'Need Manual Install','no claim in '+bc.windowDays+'d', bc.missingManualCount?'bad':'ok');
      if(bc.missingAutoCount) k += kpi(bc.missingAutoCount,'Pro, Still Missing','Intune profile did not land','bad');
      if(bc.partialCount) k += kpi(bc.partialCount,'Partial','newest sign-in had no claim','warn');
      k += kpi(bc.unseenPilotCount,'State Unknown','no browser sign-in in window', bc.unseenPilotCount?'warn':'ok');
      k += kpi(bc.nativeOnlyCount,'Edge Only','nothing to install','info');

      const scopeTxt = bc.scopePlatforms==null
        ? 'every platform (no platform condition set)'
        : bc.scopePlatforms.map(esc).join(', ');
      let body = help('Conditional Access can only evaluate a device if the sign-in <b>carries a device claim</b>. Edge sends it natively; <b>Chrome does not</b> without the <b>'+esc(bc.extensionName)+'</b> extension. Intune deploys it automatically only on Windows <b>Pro</b> — ADMX ingestion is rejected on <b>Home</b> (<code>0x86000013</code>), so Home devices need the manual install in <code>docs/chrome-sso-extension-guide.md</code>.<br><b>How this is measured:</b> no API lists browser extensions, so this counts claim-bearing sign-ins instead. A claim only appears when the request actually reaches <code>login.microsoftonline.com</code> — so a user who installed it but has not signed out yet still shows as missing. <b>Missing = not yet proven, and an unproven install is an unproven CA outcome.</b><br><b>Scope:</b> only sign-ins on platforms the device policies actually target are counted — <b>'+scopeTxt+'</b>, read from '+(bc.scopePolicies||[]).length+' policy/policies. Sign-ins on other platforms are excluded because those policies never evaluate them, so they are not a rollout task.')
        + `<div class="kpis" style="margin:0 0 8px">${k}</div>`;
      if(bc.outOfScopeSignins){
        body += `<div class="muted sm" style="margin:0 0 8px">Excluded as out of policy scope: ${
          Object.entries(bc.outOfScopeByPlatform||{}).map(([p,n])=>`${esc(p)} ${n}`).join(' · ')
        } — the device policies are scoped to ${esc(scopeTxt)}, so these are never evaluated${
          bc.unknownPlatformSignins?` · ${bc.unknownPlatformSignins} sign-in(s) with an undetermined platform were kept in scope`:''}.</div>`;
      }

      if((bc.byBrowser||[]).length){
        body += table(['Browser','Sign-ins','With device claim','Rate','Extension'],
          bc.byBrowser.map(b=>[
            `<span class="nw">${esc(b.browser)}</span>`, b.total, b.claim,
            `<span class="badge ${b.pct>=95?'b-ok':b.pct>=50?'b-med':'b-high'}">${b.pct}%</span>`,
            b.needsExtension?`<span class="badge b-med" title="The SSO extension fixes this browser">required</span>`
              :b.unfixable?`<span class="badge b-high" title="No SSO extension exists for this browser - it can never send a device claim">none available</span>`
              :`<span class="badge b-ok" title="Sends the claim natively">built in</span>`]));
      }

      const SB={ok:['b-ok','proven'],missing:['b-high','no claim'],partial:['b-med','partial'],
                nativeOnly:['b-info','Edge only'],noData:['b-med','no data']};
      const rows=(bc.users||[]).filter(u=>u.inPilot!==false);
      if(rows.length){
        body += `<div class="muted sm" style="margin:10px 0 4px"><b>${bc.pilotGroup?esc(bc.pilotGroup)+' members':'Users in scope'}</b> — who still has to act`
          + (bc.pilotMemberCount?` <span class="muted">(${rows.length}/${bc.pilotMemberCount} listed)</span>`:'')
          + `</div>`;
        body += table(['User','State','Edition','Chrome claims','Last claim','Last claimless','Other browsers'],
          rows.map(u=>{
            const s=SB[u.status]||['b-info',u.status];
            return [
              `<span class="mono sm trunc">${esc(u.user||'')}</span>`,
              `<span class="badge ${s[0]}">${esc(s[1])}</span>`,
              u.editions&&u.editions.length
                ? u.editions.map(e=>`<span class="badge ${e==='Pro'?'b-ok':'b-med'}" title="${e==='Pro'?'Intune deploys the extension automatically':'ADMX ingestion unsupported - manual install'}">${esc(e)}</span>`).join(' ')
                : `<span class="badge b-zero" title="No Intune-enrolled device found for this user">—</span>`,
              u.status==='noData'?`<span class="muted" title="No browser sign-in of any kind in the window - the state cannot be measured, which is not the same as ready">not measurable</span>`
                : u.needTotal?`${u.needClaim}/${u.needTotal}`:`<span class="muted">no Chrome use</span>`,
              `<span class="mono sm nw">${u.lastClaim?fmt(u.lastClaim):'—'}</span>`,
              `<span class="mono sm nw">${u.lastNoClaim?fmt(u.lastNoClaim):'—'}</span>`,
              u.unfixableTotal?`<span class="badge b-high" title="No extension exists for these - a CA scoping decision, not an install">${esc(u.unfixableBrowsers.join(', '))} ${u.unfixableTotal}</span>`:'—'];
          }), {scroll:300});
      }

      if((bc.findings||[]).length){
        body += `<div class="muted sm" style="margin:10px 0 4px"><b>Findings</b></div>`
          + bc.findings.map(f=>`<div class="muted" style="font-size:12px;white-space:normal;margin:0 0 4px">
              <span class="badge ${f.severity==='high'?'b-high':f.severity==='med'?'b-med':'b-low'}">${esc(f.severity)}</span> ${esc(f.text)}</div>`).join('');
      }
      body += `<div class="muted sm" style="margin:8px 0 0">Extension: <span class="mono sm">${esc(bc.extensionId)}</span> · window ${bc.windowDays}d${bc.truncated?' · <b>sign-in pull hit its bound, rates are partial</b>':''}</div>`;

      return panel('Browser Device Claims — SSO extension rollout',
        `${bc.readyCount} proven · ${bc.missingCount} missing · last ${bc.windowDays}d`, body,
        ext(STORE, 'Chrome Web Store'));
    }

    // Device identity coherence now has its own Access Control tab - it is a Conditional Access
    // prerequisite, not an Intune inventory question, and it was buried above the device list.
    function tabDevId(D){
      const html = deviceIdentityPanel(D.deviceIdentity) + browserClaimPanel(D.browserClaims);
      if(!html) return `<div class="empty">Device identity data not collected.</div>`;
      // Both panels here read the SAME shared pull, so one banner covers the tab.
      return (staleNote(D.deviceIdentity) || staleNote(D.browserClaims)) + html;
    }

    function tabDevices(D){
      const dv=D.intuneDevices;
      if(!dv) return '';
      if(!dv.available) return panel('Intune Devices','',notice(dv));
      let html='';
      const nc=dv.noncompliant||0, grace=dv.gracePeriod||0;
      // Headline = the live inventory, never the cached overview: when the overview lags a deletion
      // the two disagree and "enrolled" stops matching compliant + non-compliant. Show the lag
      // instead of hiding it - a gap that persists means a ghost record is still counted.
      const lag=dv.overviewLag||0;
      let k = kpi(dv.total,'Enrolled Devices',
        lag?`Intune summary still counts ${dv.overviewCount} — ${lag} stale record(s)`
           :(dv.mdmEnrolled!=null?`${dv.mdmEnrolled} MDM`:null), lag?'warn':'', PORTAL.intuneDevices);
      k += kpi(dv.compliant,'Compliant',null,'ok',PORTAL.intuneDevices);
      k += kpi(nc,'Non-compliant', grace?`+${grace} in grace`:null, nc>0?'bad':'ok', PORTAL.intuneCompliance);
      k += kpi(dv.encrypted,'Encrypted', `of ${dv.total}`, dv.total&&dv.encrypted>=dv.total?'ok':'warn', PORTAL.intuneDevices);
      Object.entries(dv.byOs||{}).forEach(([os,c])=>{ if(c>0) k+=kpi(c,os,null,'info',PORTAL.intuneDevices); });
      // Ownership was collected and never displayed. It is the number that settles "is this a BYOD
      // fleet or not" - a question answered wrongly twice from inference instead of from this field.
      if(dv.ownership) k += kpi(dv.ownership.company||0,'Company-owned',
        (dv.ownership.personal?`${dv.ownership.personal} personal`:'no personal devices'),
        dv.ownership.personal?'warn':'ok', PORTAL.intuneDevices);
      // Windows edition decides what Intune can deploy at all: ADMX ingestion (and therefore every
      // ingested-ADMX policy, including the Chrome SSO extension) is rejected on Home. A high Home
      // count is a standing operational cost, not a cosmetic detail.
      Object.entries(dv.byEdition||{}).forEach(([ed,c])=>{ if(c>0)
        k+=kpi(c,'Windows '+ed, ed==='Home'?'no ADMX ingestion':ed==='Unknown'?'edition not reported':null,
               ed==='Home'?'warn':ed==='Unknown'?'':'ok', PORTAL.intuneDevices); });
      html += panel('Device Inventory', `${dv.total} enrolled · ${dv.compliancePolicyCount} compliance policies · ${dv.configProfileCount} config profiles`,
        help('Devices enrolled in Microsoft Intune (MDM). <b>Non-compliant</b> devices fail a compliance-policy rule (encryption, OS version, password). <b>Encrypted</b> = disk encryption (BitLocker/FileVault) on.<br><b>Edition</b> comes from <code>skuFamily</code> (beta API). It is not cosmetic: Intune <b>ADMX ingestion fails on Windows Home</b> (<code>0x86000013</code>), so any policy delivered as an ingested ADMX template must be applied by hand on those devices.') + `<div class="kpis" style="margin:0">${k}</div>`,
        ext(PORTAL.intuneDevices, 'Intune · Devices'));

      const compBadge=s=>{ const cls=s==='compliant'?'b-ok':(s==='noncompliant'||s==='error')?'b-high':s==='inGracePeriod'?'b-med':'b-info';
        return `<span class="badge ${cls}">${esc(s||'unknown')}</span>`; };
      const drows=(dv.devices||[]).map(d=>[
        d.id?`<a class="dl trunc" href="${esc(deepLink.device(d.id))}" target="_blank" rel="noopener noreferrer"
              title="Open this device in the Intune portal ↗">${esc(d.name||'—')}</a>`
            :`<span class="trunc">${esc(d.name||'—')}</span>`,
        `<span class="nw">${esc(d.os||'')} ${esc(d.osVersion||'')}</span>`,
        d.edition?`<span class="badge ${d.edition==='Home'?'b-med':'b-ok'}" title="${d.edition==='Home'?'ADMX ingestion unsupported - ingested-ADMX policies must be applied manually':'ADMX ingestion supported'}">${esc(d.edition)}</span>`
          :`<span class="badge b-zero">—</span>`,
        `<span class="nw">${esc(d.owner||'')}</span>`,
        compBadge(d.compliance),
        d.encrypted?`<span class="badge b-ok">Yes</span>`:`<span class="badge b-med">No</span>`,
        `<span class="mono sm nw">${fmt(d.lastSync)}</span>`,
        `<span class="mono sm trunc">${esc(d.user||'')}</span>`,
        d.id?rowLink(deepLink.device(d.id),'↗','Open this device in the Intune portal'):'']);
      html += panel('Managed Devices', dv.truncated?`showing first ${(dv.devices||[]).length}`:`${(dv.devices||[]).length} device(s)`,
        drows.length?help('Click a device name (or the ↗ on the right) to open that device in the Intune portal in a new tab.')
          + table(['Device','OS','Edition','Owner','Compliance','Encrypted','Last sync','User',''],drows):`<div class="empty">No enrolled devices.</div>`,
        ext(PORTAL.intuneDevices, 'Intune · All devices'));

      const crows=(dv.compliancePolicies||[]).map(p=>[
        `<span class="trunc">${esc(p.name)}</span>`, `<span class="nw">${esc(p.os||'')}</span>`,
        (p.reqs||[]).map(r=>`<span class="badge b-low">${esc(r)}</span>`).join(' ')||'—']);
      html += panel('Compliance Policies', `${dv.compliancePolicyCount}`,
        crows.length?table(['Policy','Platform','Requirements'],crows):`<div class="empty">No compliance policies configured.</div>`,
        ext(PORTAL.intuneCompliance, 'Intune · Compliance'));
      return html;
    }

    function renderHunting(th){
      if(!th) return '';
      if(!th.available){
        const perm=/403|permission|consent|license/i.test(th.reason||'');
        return panel('Email Threat Hunting', perm?'Permission needed':'Temporary error', notice(th) +
          (perm
            ? `<div class="muted" style="font-size:12px;margin-top:6px">Requires <code>ThreatHunting.Read.All</code> consent.</div>`
            : `<div class="muted" style="font-size:12px;margin-top:6px">Possible transient Graph advanced-hunting error; auto-recovers on next collection/refresh.</div>`));
      }
      const byType=th.byType||[], byAction=th.byAction||[], delivered=th.delivered||[];
      const senders=th.senders||[], recips=th.recipients||[], clicks=th.urlClicks||[], risky=th.riskyClicks||[], trend=th.trend||[];
      const total=byType.reduce((s,t)=>s+t.count,0);
      const blockedClicks=clicks.filter(c=>/block/i.test(c.action)).reduce((s,c)=>s+c.count,0);
      let html='';

      const spoofN=th.spoofDelivered||0, extN=th.externalDelivered||0, allowN=th.allowDelivered||0, zapN=th.zapTotal||0;
      let k='';
      k+=kpi(total,'Detected Threat Emails','Last 7 days','warn', PORTAL.explorer);
      k+=kpi(spoofN,'Own-domain Spoofing', spoofN?'⚠ review':'none', spoofN?'bad':'ok', PORTAL.explorer);
      k+=kpi(extN,'External Delivered', extN?'review':'none', extN?'warn':'ok', PORTAL.explorer);
      k+=kpi(allowN,'Allowlisted','treated as normal','ok', PORTAL.tpsReport);
      k+=kpi(zapN,'ZAP Removed (post-delivery)', zapN?'auto-removed':'', 'info', PORTAL.quarantine);
      k+=kpi(blockedClicks,'Blocked Malicious Clicks', '', blockedClicks?'warn':'ok', PORTAL.explorer);
      const sub = th.partial ? 'Last 7 days · some queries had transient errors' : 'Last 7 days · Defender Advanced Hunting';
      html += panel('Email Threat Hunting — Summary', sub, `<div class="kpis" style="margin:0">${k}</div>` +
        (trend.length ? `<div class="muted" style="font-size:12px;margin:14px 0 4px">Daily threat trend (phish/malware/spam)</div>
          ${sparkline(trend.map(t=>t.count))} <span class="muted mono sm">${trend.map(t=>t.count).join(' · ')}</span>` : ''),
        ext(PORTAL.explorer, 'Defender · Explorer'));

      const typeRows=byType.map(t=>{ const bad=/phish|malware/i.test(t.type);
        return [`<span class="badge ${bad?'b-high':'b-med'}">${esc(t.type)}</span>`, t.count]; });
      const actRows=byAction.map(a=>{ const handled=/block|junk|quarant|replac/i.test(a.action);
        return [esc(a.action), `<span class="badge ${handled?'b-ok':'b-high'}">${a.count}</span>`]; });
      html += `<div class="grid2">
        ${panel('By Threat Type (ThreatTypes)', `${byType.length} types`, table(['Type','Count'],typeRows), ext(PORTAL.explorer,'Defender · Explorer'))}
        ${panel('By Delivery Action', 'All threat types · Blocked/quarantined = good, Delivered = caution', table(['Action','Count'],actRows), ext(PORTAL.tpsReport,'Threat protection status'))}</div>`;

      const catBadge={spoof:'<span class="badge b-high">Own-domain</span>',
                      external:'<span class="badge b-med">External</span>',
                      allow:'<span class="badge b-ok">Allowlisted</span>'};
      // One notification per MESSAGE, not per row. EmailEvents emits a row per recipient, so a
      // phish sent to four people is four rows - and clicking each would send four near-identical
      // warnings. Group by sender+subject and address the whole set at once.
      const dkey = d => `${(d.sender||'').toLowerCase()}|${(d.subject||'').toLowerCase()}`;
      const dgroups = {};
      delivered.forEach(d => { (dgroups[dkey(d)] = dgroups[dkey(d)] || []).push(d); });

      // Builds a mailto: draft. Deliberately a DRAFT the operator reviews and sends themselves:
      // the dashboard has no mail-send permission and must never be given one (it is
      // internet-exposed and app-only Mail.Send would let a compromise send as any user).
      function notifyHref(d, recips, cc){
        const dom = (d.sender||'').split('@')[1] || '';
        const subj = '[Security] Malicious email received - please do not open';
        // The closing line is category-aware because a fixed one is FALSE two ways out of three:
        // "the domain has been blocked" is wrong for an allowlisted partner (a partner domain came
        // out of the real data flagged as Phish), and meaningless for own-domain spoofing, where
        // the domain is ours. A pre-filled false statement is what gets sent unread.
        const closing = d.cat === 'spoof'
          ? 'This message forged our own domain - it did not come from a colleague, despite how the sender address looks.'
          : d.cat === 'allow'
            ? 'This sender is on our allowlist, so this may be a false positive - please tell me either way before deleting it.'
            : (dom ? `The sender domain "${dom}" is being blocked.` : '');
        // Wording holds whether or not ZAP removed it afterwards: this table only proves the
        // message was DELIVERED, so claiming it was already deleted could be false.
        const body = [
          'Dear Team,', '',
          `Our mail security system has flagged the message below as ${d.threat||'a threat'}. It was delivered to your mailbox.`, '',
          `  Sender:   ${d.sender||''}`,
          `  Subject:  ${d.subject||''}`,
          `  Received: ${fmt(d.time)}`, '',
          'Please reply and let me know if you have already opened it, clicked any link, or opened any attachment.', '',
          `If the message is still in your mailbox, delete it without opening it.${closing?' '+closing:''}`, '',
          'Thank you.'
        ].join('\r\n');
        // Build from non-empty parts only. An empty `cc=` is not harmless: Outlook swallowed the
        // NEXT parameter into the Cc box, so the draft opened with Cc = "&subject=[Security]..."
        // and an empty subject line (observed 2026-08-11).
        //
        // Addresses are joined with ';', not the RFC 6068 comma: Outlook takes a comma-separated
        // list as ONE unresolved string - the draft showed "a@x.com,b@x.com" sitting in the To box
        // as plain text instead of two resolved recipients (observed 2026-08-11). The separator is
        // left literal rather than percent-encoded, since encoding it merges the list back into a
        // single address. Nothing parses this query but the mail client, so a bare ';' is safe here.
        const parts = [];
        if (cc) parts.push(`cc=${cc.split(/[,;]/).map(s=>s.trim()).filter(Boolean).join(';')}`);
        parts.push(`subject=${encodeURIComponent(subj)}`);
        parts.push(`body=${encodeURIComponent(body)}`);
        return `mailto:${recips.join(';')}?${parts.join('&')}`;
      }

      const drows=delivered.map(d=>{
        const cat=d.cat||'external';
        // Subject = investigate this one message in Advanced Hunting (by NetworkMessageId);
        // Sender  = investigate every message from that sender over the last 30 days.
        const subjCell = d.msgId
          ? `<span class="dl trunc" role="button" tabindex="0" title="Investigate this message in Advanced Hunting — ${esc(d.subject||'')}"
              onclick="hunt('msg',${jsArg(d.msgId)},'')">${esc(d.subject||'(no subject)')}</span>`
          : `<span class="trunc" title="${esc(d.subject||'')}">${esc(d.subject||'')}</span>`;
        const sendCell = d.sender
          ? `<span class="dl trunc" role="button" tabindex="0" title="Investigate this sender's mail from the last 30 days — ${esc(d.sender)}"
              onclick="hunt('sender',${jsArg(d.sender)},'')">${esc(d.sender)}</span>`
          : `<span class="trunc"></span>`;
        const grp = dgroups[dkey(d)] || [d];
        const recips = [...new Set(grp.map(x=>x.recipient).filter(Boolean))];
        const notifyBtn = recips.length
          ? `<a class="rowlink" href="${esc(notifyHref(d, recips, th.notifyCc||''))}"
               title="Open a warning draft in your mail client, addressed to all ${recips.length} recipient(s) of this message: ${esc(recips.join(', '))}. Nothing is sent until you send it.">✉${recips.length>1?recips.length:''}</a>`
          : '';
        const acts = notifyBtn
          + (d.msgId?huntBtn('msg',d.msgId,'','🔎','Investigate this single message in Advanced Hunting (NetworkMessageId)'):'')
          + rowLink(PORTAL.explorer,'EX','Open Defender Explorer (set the date range and filters yourself)');
        return `<tr data-cat="${cat}">
          <td>${catBadge[cat]||''}</td>
          <td><span class="mono sm nw">${fmt(d.time)}</span></td>
          <td>${sendCell}</td>
          <td><span class="trunc">${esc(d.recipient||'')}</span></td>
          <td>${subjCell}</td>
          <td><span class="badge ${/phish|malware/i.test(d.threat||'')?'b-high':/spam/i.test(d.threat||'')?'b-med':'b-info'}">${esc(d.threat||'')}</span></td>
          <td><span class="nw">${esc(d.location||'')}</span></td>
          <td class="acts">${acts}</td></tr>`;
      }).join('');
      const totalDel=spoofN+extN+allowN;
      const pills=`<div id="delivered-filter">
        <span class="fpill active" data-cat="all" onclick="filterDelivered('all')">All (${totalDel})</span>
        <span class="fpill" data-cat="spoof" onclick="filterDelivered('spoof')">Own-domain (${spoofN})</span>
        <span class="fpill" data-cat="external" onclick="filterDelivered('external')">External (${extN})</span>
        <span class="fpill" data-cat="allow" onclick="filterDelivered('allow')">Allowlisted (${allowN})</span></div>`;
      const delBody = delivered.length
        ? help('All threat emails (phish, malware, spam) that Defender <b>delivered</b> (not blocked/quarantined). <b>Own-domain</b> = spoofing your domain (review); <b>External</b> = outside senders (review); <b>Allowlisted</b> = expected senders such as the sales portal / affiliate domains (normally benign). Threat column shows the type; use the filters to focus.')
          + help('<b>Pivots:</b> click a <b>Subject</b> to copy a KQL query for that one message and open Defender <b>Advanced Hunting</b> in a new tab — paste, Run, then click the <b>NetworkMessageId</b> in the results to reach the <b>Email entity</b> page. Click a <b>Sender</b> to pull all mail from that sender over the last 30 days. <b>EX</b> opens Threat Explorer.')
          + help('<b>✉ Notify:</b> opens a warning <b>draft</b> in your own mail client, addressed to <b>every recipient of that message</b> (the number on the button) with the fixed Cc from <code>THREAT_NOTIFY_CC</code>. Review it and send it yourself — <b>the dashboard never sends mail</b>, and must never be given permission to: it is internet-exposed, and app-only <code>Mail.Send</code> would let a compromise send as any user in the tenant. The draft says the message <i>was delivered</i> rather than "already deleted", because this table only proves delivery; if ZAP removed it afterwards, edit that line before sending.')
          + pills
          + `<div class="tbl-wrap dscroll"><table class="tbl" id="delivered-tbl"><thead><tr>
              <th>Class</th><th>Time</th><th>Sender</th><th>Recipient</th><th>Subject</th><th>Threat</th><th>Delivery</th><th>Pivot</th></tr></thead>
              <tbody>${drows}</tbody></table></div>`
        : `<div class="empty">✅ No phish/malware delivered in the last 7 days.</div>`;
      html += panel('Delivered Threat Emails', `${totalDel} delivered (last 7d) · showing up to 200 most recent`, delBody,
        ext(PORTAL.explorer, 'Defender · Explorer'));

      const sndRows=senders.map(s=>[
        `<span class="dl trunc" role="button" tabindex="0" title="Investigate this domain's mail from the last 30 days"
          onclick="hunt('senderDomain',${jsArg(s.domain)},'')">${esc(s.domain)}</span>`, s.count,
        huntBtn('senderDomain',s.domain,'','🔎','Investigate this sender domain in Advanced Hunting')]);
      const recRows=recips.map(r=>[
        `<span class="dl trunc" role="button" tabindex="0" title="Investigate threat mail this recipient received in the last 30 days"
          onclick="hunt('recipient',${jsArg(r.recipient||'')},'')">${esc(r.recipient||'')}</span>`, r.count,
        huntBtn('recipient',r.recipient||'','','🔎','Investigate this recipient in Advanced Hunting')]);
      html += `<div class="grid2">
        ${panel('Top Phishing Sender Domains', 'Click a domain → Advanced Hunting', table(['Sender Domain','Count','Pivot'],sndRows), ext(PORTAL.tabl,'Tenant Allow/Block'))}
        ${panel('Top Targeted Recipients', 'Accounts receiving the most phish/malware', table(['Recipient','Count','Pivot'],recRows), ext(PORTAL.explorer,'Defender · Explorer'))}</div>`;

      const clickRows=clicks.map(c=>{ const b=/block/i.test(c.action);
        return [esc(c.action), `<span class="badge ${b?'b-high':'b-info'}">${c.count}</span>`]; });
      const riskyRows=risky.map(r=>{ const cls=r.through?'b-high':(/block/i.test(r.action)?'b-med':'b-info');
        return [`<span class="mono sm nw">${fmt(r.time)}</span>`,
          `<span class="trunc">${esc(r.user||'')}</span>`,
          `<span class="trunc" title="${esc(r.url||'')}">${esc(r.url||'')}</span>`,
          `<span class="badge ${cls}">${esc(r.action)}${r.through?' · through':''}</span>`,
          huntBtn('click', r.msgId||'', r.url||'', '🔎', 'Investigate this click event in Advanced Hunting')]; });
      html += `<div class="grid2">
        ${panel('Safe Links Clicks (by action)', 'Blocked = risk / Allowed = normal', table(['Action','Count'],clickRows), ext(PORTAL.safeLinks,'Defender · Safe Links'))}
        ${panel('Risky URL Clicks', 'Blocked or clicked through a warning', risky.length? table(['Time','User','URL','Action','Pivot'],riskyRows):`<div class="empty">✅ No risky clicks</div>`, ext(PORTAL.explorer,'Defender · Explorer'))}</div>`;

      return html;
    }

    function tabHunting(D){
      const intro = help(`This tab analyzes inbound email threats from Microsoft Defender (last 7 days). Delivered threats are grouped as <b>Own-domain spoofing</b> (someone forging your own domain), <b>External</b>, and <b>Allowlisted</b> (expected senders such as the sales portal or affiliate domains — excluded from the review list). <b>ZAP Removed</b> means the message was auto-removed after delivery. Under Safe Links, <b>Allowed</b> clicks are normal browsing; <b>Blocked</b> clicks are the real risk signal.`);
      return intro + renderHunting(D.threatHunting);
    }

    function tabThreats(D){
      let html='';

      const inc=D.securityIncidents;
      if(inc?.available){
        const rows=inc.incidents.map(i=>[sev(i.severity),
          i.id?`<a class="dl trunc" href="${esc(deepLink.incident(i.id))}" target="_blank" rel="noopener noreferrer"
                title="Open this incident in the Defender portal ↗">${esc(i.displayName)}</a>`
              :`<span class="trunc">${esc(i.displayName)}</span>`,
          `<span class="badge b-info">${esc(i.status||'')}</span>`, esc(i.classification||'—'),
          `<span class="mono sm muted">${fmt(i.createdDateTime)}</span>`,
          i.id?rowLink(deepLink.incident(i.id),'↗','Open this incident in the Defender portal'):'']);
        html += panel('Security Incidents', `${inc.activeCount} unresolved`,
          inc.incidents.length?table(['Severity','Title','Status','Classification','Created',''],rows):`<div class="empty">✅ No incidents</div>`,
          ext(PORTAL.incidents, 'Defender · Incidents'));
      } else if(inc){ html += panel('Security Incidents','Permission needed',
          notice(inc)+`<div class="muted" style="font-size:12px;margin-top:6px">Requires <code>SecurityIncident.Read.All</code> consent.</div>`); }

      const al=D.securityAlerts;
      if(al?.available){
        const rows=al.alerts.map(a=>[sev(a.severity),
          a.id?`<a class="dl trunc" href="${esc(deepLink.alert(a.id))}" target="_blank" rel="noopener noreferrer"
                title="Open this alert in the Defender portal ↗">${esc(a.title)}</a>`
              :`<span class="trunc">${esc(a.title)}</span>`,
          `<span class="badge b-info">${esc(a.status||'')}</span>`, `<span class="mono sm muted">${fmt(a.created)}</span>`,
          a.id?rowLink(deepLink.alert(a.id),'↗','Open this alert in the Defender portal'):'']);
        html += panel('Security Alerts', `${al.count} unresolved · raw feed — Incidents above aggregate these`,
          al.alerts.length?help('The raw alert stream. Defender groups related alerts into the <b>Security Incidents</b> above — use incidents as the primary view and this list to drill into individual signals.') + table(['Severity','Title','Status','Created',''],rows):`<div class="empty">✅ No active alerts.</div>`,
          ext(PORTAL.alerts, 'Defender · Alerts'));
      } else if(al){
        html += panel('Security Alerts','Permission needed', notice(al) +
          `<div class="muted" style="font-size:12px;margin-top:6px">Add and consent <code>SecurityAlert.Read.All</code> on the app registration to enable.</div>`);
      }

      const as=D.attackSimulation;
      if(as?.available){
        const rows=as.simulations.map(s=>[`<span class="trunc">${esc(s.displayName)}</span>`,
          `<span class="badge b-info">${esc(s.status||'')}</span>`, esc(s.attackType||'—'),
          `<span class="mono sm muted">${day(s.createdDateTime)}</span>`]);
        html += panel('Attack Simulation Training', `${as.count}`,
          as.simulations.length?table(['Simulation','Status','Type','Created'],rows):`<div class="empty">No simulations</div>`,
          ext(PORTAL.attackSim, 'Defender · Attack simulation'));
      } else if(as){ html += panel('Attack Simulation Training','Permission needed',
          notice(as)+`<div class="muted" style="font-size:12px;margin-top:6px">Requires <code>AttackSimulation.Read.All</code> consent.</div>`); }
      return html;
    }

    /* ---- Sign-in activity ---------------------------------------------------------------
       Split out of the old Threats tab, which carried twelve panels. This one answers "who is
       being attacked and from where"; the Conditional Access tab answers "what did policy do".
       Both read the same riskySignins source, so each guards on it independently. -------- */
    function tabSignins(D){
      let html=staleNote(D.riskySignins);
      const rs=D.riskySignins;
      if(rs?.available && rs.collecting){
        html += panel('Anomalous Sign-ins', 'Entra ID sign-in logs',
          `<div class="notice">⏳ ${esc(rs.note||'Collecting…')}</div>`);
      } else if(rs?.available){
        const succ = rs.logins!=null ? rs.logins : (rs.recent||0)-(rs.failed||0);
        const frCls = rs.failRate>=20?'bad':rs.failRate>=5?'warn':'ok';
        const trend = (rs.failedByDay||[]).map(d=>d.count);
        let body = `<div class="kpis" style="margin:0">
          ${kpi(succ,'Successful Sign-ins',`last ${rs.windowDays}d`,'ok',PORTAL.entraSignIns)}
          ${kpi(rs.failed,'Failed Sign-ins',`${rs.failRate}% fail rate`,rs.failed>0?frCls:'ok',PORTAL.entraSignIns)}
          ${kpi(rs.uniqueUsers,'Users seen',null,'',PORTAL.entraSignIns)}
          ${kpi(rs.uniqueIps,'Source IPs',null,'',PORTAL.entraSignIns)}</div>`;
        if(trend.length>1) body += `<div style="margin-top:10px">${sparkline(trend)}<div class="kpi-label">Failed sign-ins · ${rs.windowDays}-day trend</div></div>`;
        if(rs.note) body += `<div class="notice" style="margin-top:8px">⚠ ${esc(rs.note)}</div>`;
        body += `<div class="muted" style="font-size:12px;margin-top:6px">Source: Entra ID sign-in logs (P1). Data as of ${fmt(rs.windowEnd)}${rs.pending?' · refresh in progress':''}${rs.truncated?` · sample capped at ${rs.recordCount}`:''}.</div>`;
        html += panel('Anomalous Sign-ins', `Last ${rs.windowDays} days · Entra ID sign-in logs (P1)`,
          help('Interactive sign-in success/failure from the Entra ID sign-in logs (P1). <b>Top failed users</b> = brute-force targets; <b>spray IPs</b> = one source IP failing against many accounts (password spray); <b>multi-IP users</b> = accounts signing in from many IPs (possible sharing / travel / takeover).') + body,
          ext(PORTAL.entraSignIns, 'Entra · Sign-in logs'));

        const fu=(rs.topFailedUsers||[]).map(u=>[`<span class="mono sm trunc">${esc(u.user)}</span>`, `<span class="badge b-med">${u.count}</span>`]);
        const spray=(rs.sprayIps||[]).map(s=>[`<span class="mono sm">${esc(s.ip)}</span>`, `<span class="badge b-high">${s.users} users</span>`, `<span class="badge b-med">${s.failed} fails</span>`]);
        const siLink = ext(PORTAL.entraSignIns, 'Entra · Sign-in logs');
        html += `<div class="grid2">
          ${panel('Top Failed Sign-in Users', 'Brute-force / spray targets', fu.length?table(['User','Fails'],fu):`<div class="empty">✅ No failed sign-ins</div>`, siLink)}
          ${panel('Password-Spray Source IPs', 'One IP · many accounts', spray.length?table(['Source IP','Breadth','Fails'],spray):`<div class="empty">✅ No spray pattern detected</div>`, siLink)}</div>`;

        const mi=(rs.multiIpUsers||[]).map(m=>[`<span class="mono sm trunc">${esc(m.user)}</span>`, `<span class="badge ${m.ips>=5?'b-high':'b-med'}">${m.ips} IPs</span>`,
          `<span class="mono" style="font-size:12px;white-space:normal;word-break:break-word">${(m.ipList||[]).map(ip=>esc(ip)).join(', ')}</span>`]);
        const rf=(rs.recentFailures||[]).map(f=>[`<span class="mono sm nw">${fmt(f.time)}</span>`, `<span class="trunc">${esc(f.user)}</span>`, `<span class="mono sm">${esc(f.ip)}</span>`, `<span class="nw muted">${esc(f.location||'—')}</span>`, `<span class="trunc muted" title="${esc(f.error||'')}">${esc(f.error||'')}</span>`]);
        html += `<div class="grid2">
          ${panel('Multi-IP Sign-in Users', 'Signed in from many IPs', mi.length?table(['User','Distinct IPs','IP addresses'],mi):`<div class="empty">✅ None above threshold</div>`, siLink)}
          ${panel('Recent Failed Sign-ins', 'Most recent', rf.length?table(['Time','User','Source IP','Location','Error'],rf,{scroll:340}):`<div class="empty">✅ No recent failures</div>`, siLink)}</div>`;
      } else if(rs){ html += panel('Anomalous Sign-ins','',notice(rs)); }
      return html;
    }

    /* Unattended accounts (Teams Rooms, shared device, phone-system resource accounts) that sit
       inside a policy requiring MFA. Nobody is at the console to approve a prompt, so such a
       policy does not challenge them - it locks them out. The Entra blade shows the scope as
       "All users" and never mentions that some of those users are appliances. */
    function unattendedPanel(un){
      if(!un) return '';
      if(!un.available) return panel('Unattended Account Exposure','',notice(un));
      const link = ext(PORTAL.entraCA, 'Entra · Conditional Access');
      let k = kpi(un.exposedCount||0,'Locked out now','in a policy they cannot satisfy',
                  un.exposedCount?'bad':'ok');
      k += kpi(un.reportOnlyExposedCount||0,'Would be locked out','if the report-only policies were enforced',
               un.reportOnlyExposedCount?'warn':'ok');
      // A deliberately narrowed block (e.g. "deny outside the office") is the RECOMMENDED control for
      // a room account, not an outage. Counting it as a lockout reported the operator's own
      // protective policy as a failure the moment they enforced it.
      k += kpi(un.conditionallyGatedCount||0,'Gated, not blocked','protected by a conditional block',
               un.conditionallyGatedCount?'ok':'');
      k += kpi(un.licenceProvenCount||0,'Appliance accounts','proven by licence SKU','info');
      let body = help('A Teams Rooms console or shared-device account signs in with <b>nobody present</b>. '
        + 'A policy that requires MFA cannot prompt it — it <b>locks it out</b>, and the failure looks '
        + 'like an ordinary sign-in error. Fix by excluding these accounts and giving them their own '
        + 'policy that requires a <b>trusted location or compliant device</b> instead of MFA — an excluded '
        + 'account has no authentication requirement at all, and a meeting room is physically open.<br>'
        + '<b>A narrowed block is not a lockout.</b> "Deny outside the office" is the recommended shape for '
        + 'a room account: it permits the room at its desk and denies a stolen password elsewhere. Those '
        + 'show as <i>Gated</i>, not as locked out.')
        + `<div class="kpis" style="margin:0 0 10px">${k}</div>`;

      const f=un.findings||[];
      if(f.length){
        body += table(['Account','Why unattended','Policy','Reaches it?','State','Controls'], f.map(x=>[
          `<span class="trunc">${esc(x.name||x.upn||'?')}</span>`,
          x.evidence==='licence'
            ? `<span class="badge b-high" title="${esc((x.skus||[]).join(', '))}">licence</span>`
            : `<span class="badge b-info" title="Matched on display name only — verify this is not a person">name only</span>`,
          `<span class="trunc">${esc(x.policy||'')}</span>`,
          // Four outcomes, not two: a policy can be unable to touch the account, able to block it
          // only in narrowed circumstances (the intended control), or genuinely unsatisfiable.
          (function(){
            const why = esc(x.reachWhy || '');
            if(x.reach === 'legacyOnly')
              return `<span class="badge b-ok" title="${why}">no · legacy only</span>`;
            if(x.reach === 'conditionalBlock')
              return `<span class="badge b-low" title="${why}">conditional · ${why.length>28?'narrowed':esc(x.reachWhy)}</span>`;
            if(x.reach === 'cannotSatisfy')
              return `<span class="badge b-high" title="${why}">yes · cannot satisfy</span>`;
            return `<span class="badge b-high" title="${why}">yes · blocks outright</span>`;
          })(),
          x.enforced?`<span class="badge b-high">Enforced</span>`:`<span class="badge b-med">Report-only</span>`,
          (x.controls||[]).map(c=>`<span class="badge b-med">${esc(c)}</span>`).join(' ')||'—']));
      } else if(un.candidateCount){
        body += `<div class="empty">✅ ${un.candidateCount} unattended account(s) found, none in scope of a policy that would lock them out.</div>`;
      } else {
        body += `<div class="empty">No unattended (room / shared-device / resource) accounts found.</div>`;
      }
      if((un.roomSkus||[]).length){
        body += `<div class="muted" style="font-size:12px;margin-top:8px">Appliance SKUs in this tenant: ${un.roomSkus.map(esc).join(', ')}</div>`;
      }
      body += `<div class="muted" style="font-size:12px;margin-top:6px">Checked against ${un.policyCount||0} enabled/report-only policy(ies) with a blocking grant control. Configuration check — it answers this <i>before</i> a cutover, unlike the sign-in logs, where an unattended account only shows up in the non-interactive collection.</div>`;
      const sub = un.exposedCount
        ? `${un.exposedCount} locked out by an enforced policy`
        : un.conditionallyGatedCount
          ? `${un.conditionallyGatedCount} gated by a conditional block · none locked out`
          : 'Teams Rooms · shared device · resource accounts';
      return panel('Unattended Account Exposure', sub, body, link);
    }

    /* ---- Conditional Access ---------------------------------------------------------------
       Policy configuration, unattended-account exposure, per-policy outcome, report-only blast
       radius, enforced failures and legacy auth - the whole "will this policy break someone"
       question in one place, in the order you actually ask it. ----------------------------- */
    /* Non-interactive CA blocks. The panel exists because the collection it reads is the one the
       portal does not show by default, and the accounts that live only in it - appliances, workload
       identities, background clients - are exactly the ones a tenant-wide policy breaks silently. */
    function nonInteractivePanel(ni){
      if(!ni) return '';
      if(!ni.available){
        return panel('Non-interactive CA Blocks','',
          `<div class="notice">⚠ ${esc(ni.reason||'not collected')}</div>`);
      }
      const link = ext(PORTAL.entraSignIns, 'Entra · Sign-in logs');
      let k = kpi(ni.stuckCount||0,'Stuck','blocked, nothing succeeded after', ni.stuckCount?'bad':'ok');
      k += kpi(ni.flappingCount||0,'Still blocking',`blocks in the last ${ni.recentMinutes}min`, ni.flappingCount?'warn':'ok');
      k += kpi(ni.recoveredCount||0,'Recovered','normal MFA fallback','ok');
      k += kpi(ni.blockCount||0,'Blocks',`${ni.accountCount||0} account(s), ${ni.windowHours}h window`,'info');

      let body = help('These are sign-ins the portal hides by default: the <b>non-interactive</b> collection. '
        + 'A block here is usually <b>benign</b> — the client tried a silent token refresh, Conditional Access '
        + 'asked for MFA, the client then prompted and the user completed it. What matters is the exception:<br>'
        + '<b>Stuck</b> = blocked and nothing succeeded afterwards. An account that cannot complete a prompt is '
        + 'one that has nobody to answer it — a Teams Rooms console, a shared-device or workload identity. '
        + 'This is a real outage.<br>'
        + `<b>Still blocking</b> = something did succeed, yet blocks are still arriving. Typically one client `
        + 'stuck in a retry loop (a phone mail app) while the account\'s other clients work.')
        + `<div class="kpis" style="margin:0 0 10px">${k}</div>`;

      if(ni.truncated){
        body += `<div class="notice" style="margin-bottom:10px">⚠ Record cap reached — results cover only from `
          + `${fmt(ni.coverageFrom)} onward, not the full ${ni.windowHours}h. Anything blocked before that is not shown.</div>`;
      }

      const accts = ni.accounts||[];
      if(!accts.length){
        body += `<div class="empty">✅ No Conditional Access blocks in the non-interactive logs for the last ${ni.windowHours}h.</div>`;
      } else {
        const vb = a => a.verdict==='stuck'
            ? `<span class="badge b-high" title="No success after the last block — nothing is completing the challenge">Stuck</span>`
          : a.verdict==='flapping'
            ? `<span class="badge b-med" title="Succeeded, but blocks are still arriving — one client is looping">Still blocking</span>`
          : a.verdict==='unknown'
            ? `<span class="badge b-info" title="${esc(a.probeNote||'could not determine')}">Unknown</span>`
          : `<span class="badge b-ok" title="Succeeded after the last block — normal MFA fallback">Recovered</span>`;
        body += table(['Account','Verdict','Blocks',`Last ${ni.recentMinutes}min`,'Last block','Last success','Policy','Client(s)'],
          accts.map(a=>[
            `<span class="mono sm trunc">${esc(a.user)}</span>`
              + (a.kind==='servicePrincipal'?` <span class="badge b-info" title="Workload identity, not a person">app</span>`:''),
            vb(a),
            `<span class="mono sm">${a.blocks}</span>`,
            a.blocksRecent?`<span class="badge b-med">${a.blocksRecent}</span>`:`<span class="badge b-zero">0</span>`,
            `<span class="mono sm nw">${fmt(a.lastBlock)}</span>`,
            a.lastSuccess?`<span class="mono sm nw">${fmt(a.lastSuccess)}</span>`
                          :`<span class="badge b-high">none</span>`,
            `<span class="trunc">${(a.policies||[]).map(esc).join(', ')||'—'}</span>`,
            // The still-looping client is the thing you actually go and fix
            `<span class="trunc muted">${((a.recentApps||[]).length?a.recentApps:a.apps||[]).map(esc).join(', ')||'—'}</span>`]),
          {scroll:400});
      }
      body += `<div class="muted" style="font-size:12px;margin-top:8px">Window ${ni.windowHours}h`
        + (ni.coverageFrom?` (from ${fmt(ni.coverageFrom)})`:'')
        + `. The interactive metrics on the Sign-in Activity tab deliberately exclude these records: a silent-refresh `
        + `challenge is not a failed sign-in, and counting it as one would wreck the failure rate and the spray signal.</div>`;
      return panel('Non-interactive CA Blocks',
        ni.stuckCount?`${ni.stuckCount} stuck`:ni.flappingCount?`${ni.flappingCount} still blocking`:'unattended & background clients',
        body, link);
    }

    function tabCA(D){
      let html = caPolicyPanel(D) + unattendedPanel(D.unattendedAccounts)
               + nonInteractivePanel((D.riskySignins||{}).nonInteractive);
      const rs=D.riskySignins;
      if(rs?.available && rs.collecting){
        html += panel('Conditional Access Evaluation','',`<div class="notice">⏳ ${esc(rs.note||'Collecting…')}</div>`);
      } else if(rs?.available){
        // Per-policy CA evaluation — identical metric for a report-only pilot and, later, the
        // enforced rollout, so the pilot prediction can be compared against the real outcome.
        const pev=rs.caPolicyEval||[];
        if(pev.length){
          const modeBadge=m=>m==='enforced'?`<span class="badge b-ok">Enforced</span>`
            :m==='report-only'?`<span class="badge b-med">Report-only</span>`
            :m==='off'?`<span class="badge b-info">Off</span>`
            :`<span class="badge b-info">—</span>`;
          // Scope, not raw evaluations. Entra logs an entry for every policy on every sign-in, so
          // "evaluated" is the tenant sign-in count on every row and tells you nothing; what a
          // rollout needs is the size of the audience the policy can actually reach.
          const scopeCell=p=>p.inScope===null||p.inScope===undefined
            ?`<span class="muted" title="Policy scope could not be resolved">—</span>`
            :p.scopeKind==='all'
              ?`<span class="mono sm" title="Targets all users">${p.inScope}</span>`
              :`<span class="mono sm" title="Sign-ins by the users this policy targets, out of ${p.evaluated} in the tenant">${p.inScope}</span>`;
          // One verdict per policy, at the far left, so the table answers "is anything wrong?"
          // before you read a single number. Ordered by severity, because a row that blocked
          // someone and a row that has simply never engaged both used to look like a wall of digits.
          // A block is not automatically a problem. An MFA policy stopping 38 bad sign-ins that all
          // then succeeded is the control working; one user left with no success afterwards is a
          // person who cannot work. Colour follows that distinction, not the raw block count -
          // otherwise every healthy MFA policy screams red and the column stops meaning anything.
          const verdict=p=>p.stuckUsers
            ?{c:'b-high', ic:'⛔', t:'Locked out', d:`${p.stuckUsers} user(s) blocked with no successful sign-in afterwards in this window. (They may simply not have retried — check before acting.)`}
            :p.blocked
              ?{c:'b-med', ic:'⚠', t:'Blocked, recovered', d:`${p.blocked} sign-in(s) blocked, but every affected user signed in successfully afterwards — the control working, or a transient failure`}
              :(p.wouldBlock||p.interrupted)
                ?{c:'b-med', ic:'⚠', t:'Would block', d:'Report-only: these would be stopped if you enforced this policy today'}
                :!p.applied
                  ?{c:'b-info', ic:'·', t:'No activity', d:'The policy never engaged on any in-scope sign-in — no evidence either way, not a pass'}
                  :{c:'b-ok', ic:'✅', t:'Clean', d:'The policy engaged and stopped nobody'};
          // The three claim columns only carry meaning when something was stopped, and as permanent
          // columns of zeroes they were pure noise. Collapsed into one cell that is blank when clean.
          const diag=p=>{
            const b=[];
            if(p.noClaim) b.push(`<span class="badge b-info" title="No device claim presented — fix the client/browser SSO or the device registration, NOT device compliance">No claim ${p.noClaim}</span>`);
            if(p.claimNotCompliant) b.push(`<span class="badge b-med" title="A known device reported as non-compliant — a real compliance gap">Not compliant ${p.claimNotCompliant}</span>`);
            if(p.claimCompliant) b.push(`<span class="badge b-high" title="Device was compliant and still stopped — suspect the policy itself">Compliant but hit ${p.claimCompliant}</span>`);
            if(p.interrupted) b.push(`<span class="badge b-med" title="Would have been interrupted (e.g. an extra MFA prompt) rather than blocked">Interrupted ${p.interrupted}</span>`);
            return b.join(' ')||'<span class="muted">—</span>';
          };
          const pevRows=pev.map(p=>{const v=verdict(p); return [
            `<span class="badge ${v.c} nw" title="${v.d}">${v.ic} ${v.t}</span>`,
            `<span class="trunc">${esc(p.policy)}</span>`,
            // Labelled, not a bare glyph: an unexplained ↻ next to "Enforced" tells the reader
            // nothing, and this one is load-bearing - it is the only reason a single row can show
            // both a real Blocked count and a hypothetical Would-block count.
            modeBadge(p.mode)+(p.switched?` <span class="badge b-info nw" title="Mode changed inside this ${rs.windowDays}-day window (the cutover). That is why this row can show both Blocked (after the change) and Would block (before it).">↻ was report-only</span>`:''),
            scopeCell(p),
            `<span class="mono sm">${p.applied}</span>`,
            `<span class="mono sm">${p.pass}</span>`,
            p.blocked?`<span class="badge ${p.stuckUsers?'b-high':'b-med'}" title="${p.blockedUsers||0} user(s) affected${p.stuckUsers?`, ${p.stuckUsers} with no success afterwards`:', all recovered'}">${p.blocked}</span>`:`<span class="badge b-zero">0</span>`,
            p.stuckUsers?`<span class="badge b-high" title="Blocked with no successful sign-in afterwards: ${(p.stuckSample||[]).map(esc).join(', ')}">${p.stuckUsers}</span>`:`<span class="badge b-zero">0</span>`,
            p.wouldBlock?`<span class="badge b-med" title="Report-only: would have been blocked, was not">${p.wouldBlock}</span>`:`<span class="badge b-zero">0</span>`,
            diag(p),
            p.usersImpacted?`<span class="badge b-med">${p.usersImpacted}</span>`:`<span class="badge b-zero">0</span>`,
            (p.controls||[]).map(c=>`<span class="badge b-low">${esc(c)}</span>`).join(' ')||'—'];});
          const stuckPols=pev.filter(p=>p.stuckUsers);
          const nStuckUsers=new Set(stuckPols.flatMap(p=>p.stuckSample||[])).size;
          const nBlock=pev.filter(p=>!p.stuckUsers&&p.blocked).length;
          const nWould=pev.filter(p=>!p.stuckUsers&&!p.blocked&&(p.wouldBlock||p.interrupted)).length;
          const nIdle=pev.filter(p=>!p.blocked&&!p.wouldBlock&&!p.interrupted&&!p.applied).length;
          // The headline verdict, above the table, in the words you would use to answer "any problem?"
          const headline = stuckPols.length
            ? `<div class="verdict bad">⛔ <b>${nStuckUsers} user(s) blocked with no successful sign-in afterwards</b> — ${stuckPols.map(p=>`${esc(p.policy)} (${p.stuckUsers})`).join(', ')}. Start here; they may just not have retried, so confirm before acting. Then read Diagnosis: <b>No claim</b> = fix the browser or the device registration, <b>Compliant but hit</b> = suspect the policy.</div>`
            : nBlock
              ? `<div class="verdict warn">⚠ <b>Nobody is locked out.</b> ${nBlock} policy(ies) blocked sign-ins, but every affected user got in afterwards — the control working, or transient failures.</div>`
              : nWould
                ? `<div class="verdict warn">⚠ <b>Nothing is being blocked.</b> ${nWould} report-only policy(ies) would stop sign-ins if enforced today — that is the pre-enforce work queue.</div>`
                : `<div class="verdict ok">✅ <b>No policy blocked or would block any sign-in</b> in the last ${rs.windowDays} days.</div>`;
          html += panel('Conditional Access Policy Evaluation',
            stuckPols.length?`⛔ ${nStuckUsers} not recovered · ${pev.length} policies · ${rs.windowDays}d`
                  :`✅ 0 locked out · ${pev.length} policies · ${rs.windowDays}d`,
            headline
            + help('Read the <b>Status</b> column first — the rest is the evidence behind it. A block on its own is not a fault: what matters is <b>Not recovered</b> — users blocked with no successful sign-in afterwards. An MFA policy stopping bad sign-ins that then all succeed is the control working. <b>No activity</b> is not a pass either: the policy never engaged, so it has told you nothing. <b>In scope</b> = sign-ins by the users the policy can reach (include groups/roles/users, minus exclusions); Entra records an entry for every policy on <i>every</i> sign-in, so a raw evaluated count reads the same on every row and cannot tell a 13-person pilot from a tenant-wide policy. <b>Applied</b> = the policy actually engaged. <b>Blocked</b> is what it <i>did</i>; <b>Would block</b> is what a report-only policy <i>would have</i> done — a policy with both changed mode inside the window (↻). For a <b>Block</b>-control policy, "Passed" is always 0 by design.'
              + (nIdle?` <b>${nIdle}</b> policy(ies) show "No activity" — they are unmeasured, not proven.`:''))
            + table(['Status','Policy','Mode','In scope','Applied','Passed','Blocked','Not recovered','Would block','Diagnosis','Users hit','Controls'],pevRows),
            ext(PORTAL.entraCA, 'Entra · Conditional Access'));
        }

        // Report-only pilot blast radius — what enforcing the pilot policies would break today
        const roImp=rs.caReportOnlyImpact||[];
        if(rs.caReportOnlyPolicyCount){
          let rk = kpi(rs.caReportOnlyBlockCount||0,'Would be blocked','hard lockouts to fix first',(rs.caReportOnlyBlockCount?'bad':'ok'));
          rk += kpi(rs.caReportOnlyInterruptCount||0,'Would be interrupted','e.g. extra MFA prompt',(rs.caReportOnlyInterruptCount?'info':'ok'));
          rk += kpi(rs.caReportOnlyUsers||0,'Users affected',`across ${rs.caReportOnlyPolicyCount} report-only policy(ies)`);
          let roBody=help('Sign-ins that the <b>report-only</b> policies evaluated as not satisfied — i.e. the blast radius if you enforced them right now. Counted from each policy\'s current state, so a policy enforced yesterday leaves this panel immediately.')
            + `<div class="kpis" style="margin:0 0 8px">${rk}</div>`;
          // A policy enforced mid-window keeps its earlier report-only rows in the log for the rest
          // of the window. They are history, not a forecast, so they are excluded here - and saying
          // so is what stops the reader wondering why the number dropped.
          const sw=rs.caSwitchedPolicies||[];
          if(sw.length) roBody += `<div class="muted" style="font-size:12px;margin-bottom:8px">`
            + `Enforced inside this window and therefore excluded from the figures above: `
            + sw.map(n=>`<b>${esc(n)}</b>`).join(', ')
            + `. Their real outcome is in the evaluation table and in Conditional Access Failures.</div>`;

          // The remediation split. Without this the raw block count is misleading: most "blocked"
          // sign-ins in a device-policy pilot usually carried no device claim at all, which is a
          // client/registration problem, NOT evidence that the devices are non-compliant.
          const cl=rs.caReportOnlyByClaim||{};
          const clTot=(cl.noClaim||0)+(cl.claimNotCompliant||0)+(cl.claimCompliant||0);
          if(clTot){
            const pct=n=>Math.round((n||0)/clTot*100);
            roBody += `<div class="help" style="margin-bottom:8px"><span class="help-ic">▣</span><span>
              <b>Why they would be stopped</b> — this decides what you actually fix:<br>
              <span class="badge b-info">${cl.noClaim||0} (${pct(cl.noClaim)}%)</span> <b>no device claim presented</b> —
                the client never sent a device identity (browser without the Windows Accounts extension,
                embedded IE/legacy-Edge webview, or an unregistered device). Fix the client or the
                device registration; this is <i>not</i> a compliance failure.<br>
              <span class="badge b-med">${cl.claimNotCompliant||0} (${pct(cl.claimNotCompliant)}%)</span> <b>known device, not compliant</b> —
                a genuine compliance gap on a device Entra can see.<br>
              <span class="badge b-high">${cl.claimCompliant||0} (${pct(cl.claimCompliant)}%)</span> <b>compliant and still stopped</b> —
                suspect the policy itself (a device filter, an app/platform condition, or a tag on the
                wrong device object).
            </span></div>`;
          }
          const roCtl=(rs.caReportOnlyByControl||[]).map(c=>`${esc(c.control)} (${c.count})`).join(', ');
          if(roCtl) roBody += `<div class="muted" style="font-size:12px;margin-bottom:8px">By control: ${roCtl}</div>`;
          if(roImp.length){
            const claimBadge=c=>c==='noClaim'?`<span class="badge b-info" title="No device claim presented">No claim</span>`
              :c==='claimNotCompliant'?`<span class="badge b-med" title="Known device, not compliant">Not compliant</span>`
              :c==='claimCompliant'?`<span class="badge b-high" title="Device compliant yet stopped - suspect the policy">Compliant!</span>`:'—';
            roBody += table(['Time','Severity','Why','User','Policy','Control','App','Client','Device','Location'],
              roImp.map(f=>[`<span class="mono sm nw">${fmt(f.time)}</span>`,
                f.severity==='block'?`<span class="badge b-high">Block</span>`:`<span class="badge b-med">Interrupt</span>`,
                claimBadge(f.claim),
                `<span class="trunc">${esc(f.user)}</span>`,
                `<span class="trunc">${(f.policies||[]).map(esc).join(', ')||'—'}</span>`,
                (f.controls||[]).map(c=>`<span class="badge b-low">${esc(c)}</span>`).join(' ')||'—',
                `<span class="trunc">${esc(f.app||'—')}</span>`,
                `<span class="trunc muted">${esc(f.client||'—')}</span>`,
                `<span class="nw muted">${esc(f.device||'—')}</span>`,
                `<span class="nw muted">${esc(f.location||'—')}</span>`]),
              {scroll:420});
          } else {
            roBody += `<div class="empty">✅ No sign-in would be blocked or interrupted by the report-only policies in the last ${rs.windowDays} days — safe to enforce on this evidence.</div>`;
          }
          html += panel('Report-only Pilot Impact', `${rs.caReportOnlyImpactCount||0} sign-in(s) affected in ${rs.windowDays}d`, roBody,
            ext(PORTAL.entraCA, 'Entra · Conditional Access'));
        }

        // Conditional Access failure diagnostics — which policy, and which control, blocked it
        const caFails=rs.caFailures||[], caStat=rs.caStatusCounts||{};
        const caRows=caFails.map(f=>[`<span class="mono sm nw">${fmt(f.time)}</span>`,
          `<span class="trunc">${esc(f.user)}</span>`,
          `<span class="trunc">${(f.policies||[]).map(esc).join(', ')||'—'}</span>`,
          (f.controls||[]).map(c=>`<span class="badge b-med">${esc(c)}</span>`).join(' ')||'—',
          `<span class="trunc muted" title="${esc(f.error||'')}">${esc(f.error||'')}</span>`,
          `<span class="nw muted">${esc(f.location||'—')}</span>`]);
        const caSub=Object.entries(caStat).map(([k,v])=>`${k}: ${v}`).join(' · ')||'no CA evaluation yet';
        let caBody=help('When a sign-in is blocked or challenged by <b>Conditional Access</b>, this pinpoints <b>which policy</b> failed and <b>which control</b> (MFA / compliant device / …) was not met — the fastest way to explain a CA failure. Empty until CA policies are enabled.')
          + `<div class="muted" style="font-size:12px;margin-bottom:8px">CA evaluation (last ${rs.windowDays}d): ${esc(caSub)}</div>`;
        if(caRows.length){
          const byPol=(rs.caFailByPolicy||[]).map(p=>`${esc(p.policy)} (${p.count})`).join(', ');
          const byCtl=(rs.caFailByControl||[]).map(c=>`${esc(c.control)} (${c.count})`).join(', ');
          caBody += `<div class="muted" style="font-size:12px;margin-bottom:8px">By policy: ${byPol||'—'} · By control: ${byCtl||'—'}</div>`
            + table(['Time','User','Failed policy','Control','Reason','Location'],caRows,{scroll:360});
        } else {
          caBody += `<div class="empty">✅ No Conditional Access failures in the last ${rs.windowDays} days.</div>`;
        }
        html += panel('Conditional Access Failures', `${rs.caFailedCount||0} in last ${rs.windowDays}d`, caBody,
          ext(PORTAL.entraCA, 'Entra · Conditional Access'));

        // Legacy authentication — an MFA bypass path; recommend blocking it with CA
        const legRows=(rs.legacyByClient||[]).map(l=>[`<span class="nw">${esc(l.client)}</span>`, `<span class="badge b-med">${l.count}</span>`]);
        html += panel('Legacy Authentication', `${rs.legacyAuthCount||0} sign-in(s) · ${rs.legacyUsers||0} user(s)`,
          help('Legacy protocols (IMAP/POP/SMTP/ActiveSync/Other clients) bypass MFA and are a top account-takeover vector. If this is 0, you can safely block legacy auth with a Conditional Access policy.')
          + (legRows.length?table(['Legacy client','Sign-ins'],legRows):`<div class="empty">✅ No legacy authentication seen — safe to block via CA.</div>`),
          ext(PORTAL.entraSignIns, 'Entra · Sign-in logs'));
      } else if(rs){ html += panel('Conditional Access Evaluation','',notice(rs)); }
      return html;
    }

    function tabPosture(D){
      let html='';
      const ss=D.secureScore;
      if(ss?.available && ss.current!=null){
        const pct=ss.max?Math.round(ss.current/ss.max*100):0;
        const body=`<div class="score-row">
            <div><div class="kpi-val">${ss.current}<small> / ${ss.max} (${pct}%)</small></div>
            <div class="kpi-label">Current Secure Score</div></div>
            <div class="bar" style="max-width:300px"><span style="width:${pct}%"></span></div>
            <div>${sparkline(ss.history.map(h=>h.score))}<div class="kpi-label">${ss.history.length}-day trend</div></div>
          </div>`;
        html += panel('Secure Score', '', help("Microsoft's measure of how securely your tenant is configured (higher is better). The recommendations below show the largest available improvements.") + body,
          ext(PORTAL.secureScore, 'Defender · Secure Score'));
      } else if(ss){ html += panel('Secure Score','',notice(ss)); }

      const sa=D.secureScoreActions;
      if(sa?.available){
        const rows=sa.recommendations.map(r=>[`<span class="trunc">${esc(r.title)}</span>`,
          `<span class="badge b-info">${esc(r.category||'')}</span>`, `<span class="badge b-med">+${r.gap}</span>`]);
        html += panel('Secure Score Recommendations', 'Top potential gains', table(['Recommendation','Category','Gain'],rows),
          ext(PORTAL.secureScore, 'Defender · Secure Score'));
      } else if(sa){ html += panel('Secure Score Recommendations','',notice(sa)); }

      const lic=D.licenses;
      if(lic?.available){
        const rows=lic.skus.map(s=>{
          const cls=s.total&&s.consumed>=s.total?'b-med':'b-ok';
          return [`<span class="mono sm trunc">${esc(s.sku)}</span>`, `<span class="badge ${cls}">${s.consumed} / ${s.total}</span>`];
        });
        html += panel('License Usage','Consumed/total by SKU', table(['SKU','Consumed/Total'],rows),
          ext(PORTAL.licenses, 'M365 admin · Licenses'));
      }
      return html;
    }

    function tabActivity(D){
      const a=D.recentAudits;
      if(!a) return '';
      if(!a.available) return panel('Recent Directory Audit','',notice(a));
      const rows=a.items.map(x=>[`<span class="trunc">${esc(x.activity)}</span>`,
        `<span class="mono sm muted trunc">${esc(x.by)}</span>`,
        x.result==='success'?`<span class="badge b-ok">Success</span>`:`<span class="badge b-med">${esc(x.result||'')}</span>`,
        `<span class="mono sm muted">${fmt(x.time)}</span>`]);
      return panel('Recent Directory Audit', 'Entra Free 7-day retention', table(['Activity','By','Result','Time'],rows),
        ext(PORTAL.entraAudit, 'Entra · Audit logs'));
    }

    /* SharePoint / OneDrive external-sharing posture.
       Conditional Access can only govern access that carries an identity. sharingCapability decides
       whether that is even true: anonymous "Anyone with the link" sharing needs no authentication, so
       it produces no sign-in record and no CA evaluation - every MFA and device policy is bypassed on
       that path, and no identity-side card would ever show it. Hence a card just for these settings. */
    function sharingPanel(sp){
      if(!sp) return '';
      if(!sp.available) return panel('External Sharing (SharePoint / OneDrive)','',notice(sp));
      const yn=(v,goodWhen)=>v===goodWhen?`<span class="badge b-ok">${v?'on':'off'}</span>`
        :`<span class="badge b-med">${v?'on':'off'}</span>`;
      const idle=sp.idleSessionSignOut||{};
      // Renamed from "Anonymous Links": the sibling sub-tab uses that exact label for the COUNT of
      // real links, and after the split the two sat next to each other meaning different things.
      let k = kpi(sp.anonymousLinksEnabled?'ON':'OFF','Anonymous Sharing (tenant)',
        sp.anonymousLinksEnabled?'access with NO identity — CA cannot see it':'all external access authenticates',
        sp.anonymousLinksEnabled?'bad':'ok', PORTAL.spoSharing);
      k += kpi(sp.findingCount,'Findings', sp.highFindingCount?`${sp.highFindingCount} high`:'review items',
        sp.highFindingCount?'bad':(sp.findingCount?'info':'ok'));
      k += kpi(idle.enabled?`${idle.signOutAfterMinutes}m`:'OFF','Idle Sign-out',
        idle.enabled?`warn at ${idle.warnAfterMinutes}m`:'sessions never time out', idle.enabled?'ok':'info');
      const rows=[
        ['External sharing level', `<span class="badge ${sp.sharingCapabilitySeverity==='bad'?'b-high':'b-ok'}">${esc(sp.sharingCapabilityLabel||'')}</span>`],
        ['Domain restriction', `<span class="muted">${esc(sp.domainRestrictionMode||'none')}</span>${(sp.allowedDomains||[]).length?` · ${sp.allowedDomains.length} allowed`:''}${(sp.blockedDomains||[]).length?` · ${sp.blockedDomains.length} blocked`:''}`],
        ['Guests can re-share', yn(sp.externalResharingEnabled,false)],
        ['Legacy auth protocols', yn(sp.legacyAuthEnabled,false)],
        ['Sync blocked on unmanaged devices', yn(sp.unmanagedSyncRestricted,true)],
        ['Users can create sites', yn(sp.siteCreationEnabled,false)],
        ['File activity notifications', yn(sp.fileActivityNotification,true)],
      ];
      let body = help('These settings decide how much external access exists <b>outside</b> identity control. <b>Anonymous links</b> are the one that matters most: that access has no user, so it never appears in sign-in logs and no Conditional Access policy — MFA included — can apply to it. A domain allow-list is usually impractical for an org that shares with many customers and vendors; turning anonymous links off achieves the same containment without maintaining a list.')
        + `<div class="kpis" style="margin:0 0 8px">${k}</div>`
        + table(['Setting','Value'], rows);
      if((sp.findings||[]).length){
        body += table(['','Finding'], sp.findings.map(f=>[
          sev(f.severity==='high'?'High':f.severity==='med'?'Medium':'Low'),
          `<span style="white-space:normal">${esc(f.text)}</span>`]));
      } else {
        body += `<div class="empty">✅ No sharing-posture findings.</div>`;
      }
      return panel('External Sharing (SharePoint / OneDrive)',
        sp.anonymousLinksEnabled?'anonymous links ENABLED':'authenticated sharing only', body,
        ext(PORTAL.spoSharing, 'SharePoint · Sharing'));
    }

    /* The links that actually exist, as opposed to the tenant setting that permits them.
       The tenant flag alone is a permanent false positive here: it is deliberately open so two sites
       can be shared with a partner, while ~32 others are Disabled per-site. Per-site sharingCapability
       is absent from Graph, so this panel shows the concrete links found on the sites configured as
       anonymous-capable, plus newly created sites (which inherit the open tenant default). */
    function anonLinkPanel(sl){
      if(!sl) return '';
      if(!sl.available) return panel('Anonymous Sharing Links','',notice(sl));
      let k = kpi(sl.anonCount,'Anonymous Links',
        sl.anonCount?`on ${sl.scannedSiteCount} scanned site(s)`:'none found',
        sl.anonCount?(sl.editableCount?'bad':'warn'):'ok', PORTAL.spoSharing);
      k += kpi(sl.editableCount,'Grant EDIT',
        sl.editableCount?'unauthenticated write access':'none', sl.editableCount?'bad':'ok');
      k += kpi(sl.noExpiryCount,'No Expiry',
        sl.noExpiryCount?'live indefinitely':'all links expire', sl.noExpiryCount?'bad':'ok');
      k += kpi(sl.newSiteCount,`New Sites (${sl.newSiteDays}d)`,
        sl.newSiteCount?'inherit the open tenant default':'none', sl.newSiteCount?'warn':'ok');

      let body = help('The tenant sharing level is only a <b>ceiling</b>. What matters is which links exist and what they grant. An anonymous link carries <b>no identity</b>: it produces no sign-in record and no Conditional Access evaluation, so MFA, device and location policies are all bypassed on that path. A link of type <b>edit</b> also allows modifying and downloading the file. <b>Per-site sharing level is not available in Microsoft Graph</b> — this scan targets a configured list of sites, so verify it with <span class="mono sm">Get-SPOSite -Limit All | ft Url,SharingCapability</span>.')
        + `<div class="kpis" style="margin:0 0 8px">${k}</div>`;

      if((sl.links||[]).length){
        body += table(['Site','Item','Grants','Download','Expires'],
          sl.links.map(x=>[
            `<span class="trunc">${esc(x.site||'')}</span>`,
            `<span class="trunc">${esc(x.item||'')}</span>`,
            `<span class="badge ${x.editable?'b-high':'b-med'}">${esc(x.type||'?')}</span>`,
            x.preventsDownload?`<span class="badge b-ok">blocked</span>`:`<span class="badge b-med">allowed</span>`,
            x.expired?`<span class="badge b-info" title="Past expiry — no longer grants access">expired ${Math.abs(x.daysLeft)}d ago</span>`
              :x.daysLeft==null?`<span class="badge b-high">never</span>`
              :x.daysLeft<=7?`<span class="badge b-high">${x.daysLeft}d</span>`
              :`<span class="badge b-med">${x.daysLeft}d</span>`,
          ]), {scroll:340});
      } else {
        body += `<div class="empty">✅ No anonymous links found on the scanned site(s).</div>`;
      }

      body += `<div class="muted sm" style="margin:8px 0 0">Scanned: ${esc((sl.scannedSites||[]).join(', ')||'none')} · of ${sl.siteCount} site(s) in the tenant · other link scopes present: ${sl.orgLinkCount} organisation, ${sl.userLinkCount} specific-people${sl.truncated?' · <b>scan hit its bound, list incomplete</b>':''}</div>`;

      if((sl.newSites||[]).length){
        body += table(['New site','Created'], sl.newSites.map(s=>[
          `<span class="trunc">${esc(s.name||'')}</span>`, `<span class="mono sm muted">${fmt(s.created)}</span>`]),
          {scroll:200});
      }
      if((sl.findings||[]).length){
        body += table(['','Finding'], sl.findings.map(f=>[
          sev(f.severity==='high'?'High':f.severity==='med'?'Medium':'Low'),
          `<span style="white-space:normal">${esc(f.text)}</span>`]));
      }
      return panel('Anonymous Sharing Links',
        sl.anonCount?`${sl.anonCount} link(s) · ${sl.editableCount} grant edit`:'none found', body,
        ext(PORTAL.spoSharing, 'SharePoint · Sharing'));
    }

    // External sharing gets its own tab: it is a data-exfiltration surface, not mail security,
    // and it was appended above the mail panels where nobody would look for it.
    function tabSharing(D){
      return (anonLinkPanel(D.sharingLinks) + sharingPanel(D.sharepointSharing)) ||
        `<div class="empty">SharePoint sharing data not collected.</div>`;
    }

    function tabMailSec(D){
      const x=D.exchangeEop;
      if(!x) return '';
      if(!x.available) return panel('Mail Security (Exchange / EOP)','Collection needed', notice(x) +
        `<div class="muted" style="font-size:12px;margin-top:8px">After setup, running <code>scripts/exo_collector.ps1</code> creates a snapshot that appears here automatically. (See the Exchange section in README.)</div>`);

      let html='';
      // Next collection = the first scheduled local time after now (else the first time tomorrow)
      const times = x.collectTimes || ['10:00','13:00','16:00'];
      const now = new Date(); let next=null;
      for(const t of times){ const [hh,mm]=t.split(':').map(Number);
        const d=new Date(now); d.setHours(hh,mm,0,0); if(d>now){ next=d; break; } }
      if(!next){ const [hh,mm]=times[0].split(':').map(Number);
        next=new Date(now); next.setDate(next.getDate()+1); next.setHours(hh,mm,0,0); }
      const nextTxt = `Collects at ${times.join(', ')} + on startup · next ≈ ${fmt(next.toISOString())}`;
      if(x.stale) html += `<div class="notice" style="margin-bottom:14px">⚠ Snapshot is ${x.ageHours}h old — a scheduled collection was likely missed (PC off/asleep). ${nextTxt}. You can also re-run the collector now.</div>`;
      else html += `<div class="tab-sub" style="margin-top:-8px">Collected: ${fmt(x.collectedAt)}${x.ageHours!=null?` (${x.ageHours}h ago)`:''} · ${nextTxt}</div>`;

      const fwdRows=(x.forwarding||[]).map(f=>[`<span class="trunc">${esc(f.mailbox)}</span>`,
        `<span class="mono sm">${esc(f.forwardingSmtpAddress||f.forwardingAddress||'')}</span>`,
        `<span class="nw">${f.deliverToMailboxAndForward?'Forward+keep':'Forward only'}</span>`, `<span class="badge b-high">Auto-forward</span>`]);
      const ruleRows=(x.riskyRules||[]).map(r=>[`<span class="trunc">${esc(r.mailbox)}</span>`,
        `<span class="trunc">${esc(r.rule)}</span>`,
        (r.actions||[]).map(a=>`<span class="badge ${a==='DeleteMessage'?'b-med':'b-high'}">${esc(a)}</span>`).join(' '),
        `<span class="mono sm muted trunc">${esc((r.targets||[]).join(', '))}</span>`,
        r.enabled?`<span class="badge b-high">On</span>`:`<span class="badge b-info">Off</span>`]);
      html += `<div class="grid2">
        ${panel('Mailbox Auto-forwarding', `${(x.forwarding||[]).length} · BEC risk`, help('Auto-forwarding to external addresses is a classic sign of account takeover (BEC). Review any unexpected entries.') + table(['Mailbox','Forward to','Mode','Status'],fwdRows), ext(PORTAL.eacMbx,'EAC · Mailboxes'))}
        ${panel('Risky Inbox Rules', `${(x.riskyRules||[]).length}`, table(['Mailbox','Rule','Action','Target','Status'],ruleRows), ext(PORTAL.eacMbx,'EAC · Mailboxes'))}</div>`;

      // Delegation shown two ways, each grouped into collapsible accordions to tame long lists:
      //  (1) by mailbox: mailbox → delegate → permission   (2) by delegate: delegate → mailbox → permission
      // FullAccess/SendAs for the same (outer, inner) pair are merged onto one row as badges.
      const dels=(x.delegations||[]);
      const delBadge=a=>`<span class="badge ${a==='SendAs'?'b-med':'b-low'}">${esc(a)}</span>`;
      const delGroupAccordion=(byOuter, outerLabel, innerLabel)=>{
        const outers=Object.keys(byOuter).sort((a,b)=>a.localeCompare(b));
        if(!outers.length) return `<div class="del-empty">No data to display.</div>`;
        const items=outers.map(o=>{
          const inners=Object.keys(byOuter[o]).sort((a,b)=>a.localeCompare(b));
          const rows=inners.map(n=>{
            const perms=[...byOuter[o][n]].sort();  // FullAccess → SendAs
            return `<tr><td><span class="trunc">${esc(n)}</span></td><td class="di-perms">${perms.map(delBadge).join(' ')}</td></tr>`;
          }).join('');
          const hay=esc((o+' '+inners.join(' ')).toLowerCase());  // filter on both the outer and inner names
          return `<details class="del-acc" data-search="${hay}">
              <summary><span class="del-caret">▸</span><span class="del-name" title="${esc(o)}">${esc(o)}</span><span class="del-count">${inners.length}</span></summary>
              <div class="del-inner"><table><tbody>${rows}</tbody></table></div>
            </details>`;
        }).join('');
        return `<div class="del-view">
            <div class="del-controls">
              <input class="del-search" type="search" placeholder="Search ${esc(outerLabel)} · ${esc(innerLabel)}…" oninput="delFilter(this)">
              <span class="del-lnk" onclick="delExpandAll(this,true)">Expand all</span>
              <span class="del-lnk" onclick="delExpandAll(this,false)">Collapse all</span>
            </div>${items}</div>`;
      };
      const byMbx={}, byUser={};
      dels.forEach(d=>{
        const m=d.mailbox||'—', u=d.user||'—';
        if(!byMbx[m]) byMbx[m]={};   if(!byMbx[m][u]) byMbx[m][u]=new Set();   byMbx[m][u].add(d.access);
        if(!byUser[u]) byUser[u]={}; if(!byUser[u][m]) byUser[u][m]=new Set(); byUser[u][m].add(d.access);
      });
      const nMbx=Object.keys(byMbx).length, nUser=Object.keys(byUser).length;
      let delBody;
      if(!dels.length){ delBody=`<div class="empty">No data to display.</div>`; }
      else {
        delBody=`<div id="del-toggle">
            <span class="fpill active" data-mode="mbx" onclick="switchDelGroup('mbx')">By mailbox (${nMbx})</span>
            <span class="fpill" data-mode="user" onclick="switchDelGroup('user')">By delegate (${nUser})</span></div>
          <div id="del-by-mbx">${delGroupAccordion(byMbx,'Mailbox (Sharebox)','Delegate')}</div>
          <div id="del-by-user" style="display:none">${delGroupAccordion(byUser,'Delegate','Mailbox (Sharebox)')}</div>`;
      }
      html += panel('Mailbox Delegation · Permissions', `${nMbx} mailboxes · ${nUser} delegates · ${dels.length} grants`, help('<b>FullAccess</b> lets someone open another mailbox; <b>SendAs</b> lets them send as that user. Switch between the by-mailbox and by-delegate views and expand any entry — review anything you do not recognise.') + delBody,
        ext(PORTAL.eacMbx, 'EAC · Mailboxes'));

      const q=x.quarantine||{byType:[],total:0,days:7};
      let qk=kpi(q.total,'Quarantined Messages',`Last ${q.days}d`, q.total>0?'warn':'ok', PORTAL.quarantine);
      (q.byType||[]).forEach(t=>{ const bad=/phish|malware/i.test(t.type); qk+=kpi(t.count, t.type, null, bad?'bad':'info', PORTAL.quarantine); });
      html += panel('EOP Quarantine / Spam·Phish Trend', `Last ${q.days}d`, `<div class="kpis" style="margin:0">${qk}</div>`,
        ext(PORTAL.quarantine, 'Defender · Quarantine'));

      const trRows=(x.transportRules||[]).map(t=>[`<span class="trunc">${esc(t.name)}</span>`,
        t.state==='Enabled'?`<span class="badge b-ok">On</span>`:`<span class="badge b-info">Off</span>`,
        esc(t.priority), `<span class="muted trunc">${esc(t.description||'')}</span>`]);
      const ob=(x.outboundForwarding&&x.outboundForwarding[0])?x.outboundForwarding[0].AutoForwardingMode:null;
      const obBody = ob
        ? `<div class="kpis" style="margin:0">${kpi(esc(ob),'AutoForwardingMode',null,/On|Automatic/i.test(ob)?'warn':'ok')}</div>
           <div class="muted" style="font-size:12px;margin-top:8px">Automatic/On allows external auto-forwarding. Review from a data-exfiltration standpoint.</div>`
