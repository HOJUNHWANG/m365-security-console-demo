    function deviceIdentityPanel(di){
      if(!di) return '';
      if(!di.available) return panel('Device Identity Coherence','',notice(di));
      const bad=(di.devices||[]).filter(d=>!d.ok);
      const warned=(di.devices||[]).filter(d=>d.ok&&(d.warnings||[]).length);
      let k = kpi(di.enrolled,'Enrolled','devices checked');
      k += kpi(di.healthy,'Coherent','sign-in = Intune = tag', di.healthy===di.enrolled?'ok':'');
      k += kpi(di.problem,'Mismatched','CA cannot see these correctly', di.problem?'bad':'ok');
      k += kpi(di.staleIntunePointerCount||0,'Stale pointers','cosmetic, after a re-registration', (di.staleIntunePointerCount?'info':'ok'));
      k += kpi(di.phantomLinkCount||0,'Phantom links','Intune bound to a stub', di.phantomLinkCount?'bad':'ok');
      if(di.totalEntraObjects!=null) k += kpi(di.totalEntraObjects,'Entra Objects',
        tf('{0} enrolled · {1} not Intune-managed', di.enrolled, di.totalEntraObjects-di.enrolled),'info');
      if(di.tagInertCount!=null) k += kpi(di.tagInertCount,'Tag Inert','tagged but not Intune-managed', di.tagInertCount?'bad':'ok');
      const split=(di.devices||[]).filter(d=>d.complianceSplit);
      if(split.length) k += kpi(split.length,'Compliance not in CA','Intune says compliant, CA sees otherwise','bad');
      let body = help('Conditional Access evaluates the Entra device object that the <b>sign-in</b> presents. Intune tracks a device by its own <code>azureADDeviceId</code>. A device-filter tag sits on whichever object was picked. This card checks all three agree:<br><b>sign-in deviceId == Intune azureADDeviceId == the tagged object</b><br>When they disagree, a device that is enrolled, compliant <i>and</i> tagged is still blocked by a device-based policy — and neither portal shows it. Tag in use: <code>'+esc(di.tag||'')+'</code>.')
        + `<div class="kpis" style="margin:0 0 8px">${k}</div>`;
      if(split.length){
        body += `<div class="verdict bad">⛔ <b>${split.length} device(s): Intune says compliant, but the object
          Conditional Access reads does not.</b> These fail <i>require compliant device</i> (53000) while every
          Intune view shows them green. This is the normal state right after a re-registration, before the
          device checks in — <b>one Company Portal sync</b> fixes it.
          <b>Do not re-register again on the strength of this</b>; that is how stubs get made.</div>`
          + table(['Device','User','Intune','What CA reads'],
            split.map(d=>[
              `<span class="trunc">${esc(d.device||'?')}</span>`,
              `<span class="mono sm trunc">${esc(d.user||'—')}</span>`,
              `<span class="badge b-ok">${esc(d.complianceState||'?')}</span>`,
              d.compliancePublishedToCa===false
                ? `<span class="badge b-high">not compliant</span>`
                : `<span class="badge b-med" title="No compliance state has reached Entra for this registration yet">no state yet</span>`]));
      }
      if(!bad.length){
        body += `<div class="empty">✅ ${esc(t('Every enrolled device has one coherent identity — device-based Conditional Access can be trusted.'))}</div>`;
      } else {
        const yn=(v,src)=>{
          const inf = src==='entraReal';
          const tip = inf?' title="No sign-in claim in this window, so this is read from the Entra object the device registers with (dsregcmd shows WorkplaceDeviceId pointing at that object)."':'';
          return v===true?`<span class="badge b-ok"${tip}>yes${inf?'*':''}</span>`
            :v===false?`<span class="badge b-high"${tip}>no${inf?'*':''}</span>`
            :'<span class="badge b-zero" title="Cannot be judged: no sign-in claim in this window and no non-stub Entra object to fall back on. This is NOT &quot;untagged&quot;.">can&#39;t tell</span>';
        };
        body += table(['Device','Compliance','Entra objects','Intune object','Sign-in object','Tagged?','Findings'],
          bad.map(d=>[
            `<span class="trunc">${esc(d.device||'?')}</span>`,
            d.complianceState==='compliant'?`<span class="badge b-ok">compliant</span>`:`<span class="badge b-med">${esc(d.complianceState||'?')}</span>`,
            d.entraObjectCount>1?`<span class="badge b-high" title="Duplicate objects for one physical device">${d.entraObjectCount}</span>`:`<span class="badge b-zero">${d.entraObjectCount}</span>`,
            `<span class="mono sm">${esc((d.intuneDeviceId||'—').slice(0,8))}</span> ${d.intuneObjectTrustType?`<span class="badge b-ok">${esc(d.intuneObjectTrustType)}</span>`:`<span class="badge b-high" title="No trustType - an MDM-only stub, carries no compliance state for CA">phantom</span>`}`,
            d.signInDeviceId?`<span class="mono sm">${esc(d.signInDeviceId.slice(0,8))}</span> ${d.signInExistsInEntra===false
                  ?(d.reregistered?`<span class="badge b-med" title="Expected: the device re-registered onto a new object. Sign-in history keeps naming the old one for up to ${di.windowDays}d. The object it registers with now is Intune-managed.">stale claim</span>`
                                  :`<span class="badge b-high" title="The object this device signs in with no longer exists in Entra, and it has NOT re-registered onto a sound one.">orphaned</span>`)
                  :`<span class="badge b-info">${esc(d.signInTrustType||'—')}</span>`}`
              :d.presentedDeviceId?`<span class="mono sm">${esc(d.presentedDeviceId.slice(0,8))}</span> <span class="badge b-zero" title="No sign-in claim in ${di.windowDays}d - this is the Entra object the device registers with">registered*</span>`
              :`<span class="muted">${esc(tf('no claim in {0}d', di.windowDays))}</span>`,
            yn(d.presentedTagged, d.presentedSource),
            `<span class="muted" style="font-size:12px;white-space:normal">${d.problems.map(esc).join('<br>')}</span>`]));
        const anyPhantom = bad.some(d=>d.intuneTargetState==='liveStub');
        const anyUntagged = bad.some(d=>d.presentedTagged===false);
        const anyUnknown = bad.some(d=>d.presentedTagged==null);
        const anyInferred = bad.some(d=>d.presentedSource==='entraReal');
        let fix = [];
        if(anyPhantom) fix.push(t('A <i>phantom</i> Intune link means Intune\'s <code>azureADDeviceId</code> points at an MDM-only stub (no <code>trustType</code>) instead of the real registration, so compliance is reported to an object Conditional Access never sees. Note Intune can <b>create</b> such a stub on its own to repair a dangling pointer — a new phantom does not mean the device changed.'));
        if(anyUntagged) fix.push(t('An untagged sign-in object just needs the tag moved onto the object the device actually authenticates with (not the one Intune points at).'));
        if(anyInferred) fix.push(t('An asterisk (<b>*</b>) means the verdict comes from the Entra object the device <i>registers</i> with rather than from a sign-in claim, because no claim landed in the window. On split devices <code>dsregcmd /status</code> shows <code>WorkplaceDeviceId</code> matching that object, not the stub. Without this fallback such devices would drop out of the Tag Inert count, even though they can be blocked <i>and</i> invisible in the log.'));
        if(bad.some(d=>d.presentedTagged===true && !d.presentedSound)) fix.push(t('<b>Tag inert:</b> the object is tagged but <code>isManaged</code> is not <code>true</code>, and the device filter does <b>not</b> honour the tag on such an object — such a device fails the policy even with an exact <code>Approved-Device</code> value. Tagging cannot fix it; the device must re-register (<i>Add a work or school account</i>) so Intune state attaches to the object it signs in with. Disconnect the existing work account first, then delete the stub, then re-add — deleting while the device is still attached makes Intune mint a new stub.'));
        if(anyUnknown) fix.push(t('<b>can\'t tell</b> in the Tagged? column now means something stronger than before: no sign-in carried a device claim <i>and</i> there is no non-stub Entra object to read instead, so this device has no sound registration anywhere. It is not simply "unverified".'));
        if(fix.length) body += `<div class="muted" style="font-size:12px;margin-top:8px"><b>${esc(t('How to read this:'))}</b> ${fix.join(' ')}</div>`;
      }
      if(warned.length){
        body += `<div class="muted" style="font-size:12px;margin-top:10px"><b>${esc(t('Warnings — no action needed:'))}</b></div>`
          + table(['Device','Intune points at','Sign-in object','Note'], warned.map(d=>[
              `<span class="trunc">${esc(d.device||'?')}</span>`,
              `<span class="mono sm">${esc((d.intuneDeviceId||'—').slice(0,8))}</span> <span class="badge b-info">${esc(d.intuneTargetState||'')}</span>`,
              d.signInDeviceId?`<span class="mono sm">${esc(d.signInDeviceId.slice(0,8))}</span> ${d.signInObjectSound?`<span class="badge b-ok">sound</span>`:''}`:'—',
              `<span class="muted" style="font-size:12px;white-space:normal">${(d.warnings||[]).map(esc).join('<br>')}</span>`]));
      }
      if(di.taggedObjectCount!=null){
        const anomaly=(di.taggedNotEnrolled||[]).length;
        body += `<div class="muted sm" style="margin:10px 0 0"><b>${esc(t('Tag inventory'))}</b> — ${esc(tf('{0} object(s) carry', di.taggedObjectCount))} <code>${esc(di.tag||'')}</code>`
          + (di.taggedStubCount?` · ${esc(tf('{0} of them are stubs (harmless: a stub is never the object CA reads)', di.taggedStubCount))}`:'')
          + (anomaly?` · <span class="badge b-high">${esc(tf('{0} tagged but NOT enrolled', anomaly))}</span> ${esc(di.taggedNotEnrolled.join(', '))} — ${esc(t('a tag applied outside the approval process'))}`
                    :` · <span class="badge b-ok">${esc(t('no tag outside the enrolled set'))}</span>`)
          + ((di.enrolledNotTagged||[]).length?` · ${esc(tf('{0} enrolled device(s) not tagged:', di.enrolledNotTagged.length))} ${esc(di.enrolledNotTagged.join(', '))}`:'')
          + `</div>`;
      }
      if((di.multiAccountDevices||[]).length){
        body += `<div class="muted sm" style="margin:8px 0 0"><span class="badge b-med">${esc(t('second account seen'))}</span> `
          + di.multiAccountDevices.map(d=>`<b>${esc(d.device)}</b> ← ${esc((d.extra||[]).join(', '))}`).join(' · ')
          + ` — ${t('harmless while enrolled, but <b>re-enrolling one of these with both accounts present mints a stub</b>')}`
          + ` ${t('(the same procedure with the second account as the only difference reproduces it). Disconnect the second account before any re-registration. Detection only — check the device\'s <i>Access work or school</i> screen, which is the only authoritative source.')}</div>`;
      }
      return panel('Device Identity Coherence', tf('{0}/{1} coherent · last {2}d', di.healthy, di.enrolled, di.windowDays), body,
        ext(PORTAL.intuneDevices, 'Intune · Devices'));
    }

    function browserClaimPanel(bc){
      if(!bc) return '';
      if(!bc.available) return panel('Browser Device Claims','',notice(bc));
      const STORE='https://chromewebstore.google.com/detail/'+bc.extensionId;
      const pct=bc.extClaimPct;
      let k = kpi(pct==null?'—':pct+'%','Chrome Claim Rate', tf('{0}/{1} sign-ins', bc.extBrowserClaims, bc.extBrowserSignins),
        pct==null?'':(pct>=95?'ok':pct>=50?'warn':'bad'));
      k += kpi(bc.readyCount,'Proven Ready', bc.pilotGroup?`in ${bc.pilotGroup}`:'in scope', bc.readyCount?'ok':'');
      k += kpi(bc.missingManualCount,'Need Manual Install', tf('no claim in {0}d', bc.windowDays), bc.missingManualCount?'bad':'ok');
      if(bc.missingAutoCount) k += kpi(bc.missingAutoCount,'Pro, Still Missing','Intune profile did not land','bad');
      if(bc.partialCount) k += kpi(bc.partialCount,'Partial','newest sign-in had no claim','warn');
      k += kpi(bc.unseenPilotCount,'State Unknown','no browser sign-in in window', bc.unseenPilotCount?'warn':'ok');
      k += kpi(bc.nativeOnlyCount,'Edge Only','nothing to install','info');

      const scopeTxt = bc.scopePlatforms==null
        ? 'every platform (no platform condition set)'
        : bc.scopePlatforms.map(esc).join(', ');
      let body = help(
        tf('Conditional Access can only evaluate a device if the sign-in <b>carries a device claim</b>. Edge sends it natively; <b>Chrome does not</b> without the <b>{0}</b> extension. Intune deploys it automatically only on Windows <b>Pro</b> — ADMX ingestion is rejected on <b>Home</b> (<code>0x86000013</code>), so Home devices need the manual install in <code>docs/chrome-sso-extension-guide.md</code>.', esc(bc.extensionName))
        + '<br>' + t('<b>How this is measured:</b> no API lists browser extensions, so this counts claim-bearing sign-ins instead. A claim only appears when the request actually reaches <code>login.microsoftonline.com</code> — so a user who installed it but has not signed out yet still shows as missing. <b>Missing = not yet proven, and an unproven install is an unproven CA outcome.</b>')
        + '<br>' + tf('<b>Scope:</b> only sign-ins on platforms the device policies actually target are counted — <b>{0}</b>, read from {1} policy/policies. Sign-ins on other platforms are excluded because those policies never evaluate them, so they are not a rollout task.', scopeTxt, (bc.scopePolicies||[]).length))
        + `<div class="kpis" style="margin:0 0 8px">${k}</div>`;
      if(bc.outOfScopeSignins){
        body += `<div class="muted sm" style="margin:0 0 8px">${esc(t('Excluded as out of policy scope:'))} ${
          Object.entries(bc.outOfScopeByPlatform||{}).map(([p,n])=>`${esc(p)} ${n}`).join(' · ')
        } — ${esc(tf('the device policies are scoped to {0}, so these are never evaluated', scopeTxt))}${
          bc.unknownPlatformSignins?` · ${esc(tf('{0} sign-in(s) with an undetermined platform were kept in scope', bc.unknownPlatformSignins))}`:''}.</div>`;
      }

      if((bc.byBrowser||[]).length){
        body += table(['Browser','Sign-ins','With device claim','Rate','Extension'],
          bc.byBrowser.map(b=>[
            `<span class="nw">${esc(b.browser)}</span>`, b.total, b.claim,
            `<span class="badge ${b.pct>=95?'b-ok':b.pct>=50?'b-med':'b-high'}">${b.pct}%</span>`,
            b.needsExtension?`<span class="badge b-med" title="${esc(t('The SSO extension fixes this browser'))}">${esc(t('required'))}</span>`
              :b.unfixable?`<span class="badge b-high" title="${esc(t('No SSO extension exists for this browser - it can never send a device claim'))}">${esc(t('none available'))}</span>`
              :`<span class="badge b-ok" title="${esc(t('Sends the claim natively'))}">${esc(t('built in'))}</span>`]));
      }

      const SB={ok:['b-ok','proven'],missing:['b-high','no claim'],partial:['b-med','partial'],
                nativeOnly:['b-info','Edge only'],noData:['b-med','no data']};
      const rows=(bc.users||[]).filter(u=>u.inPilot!==false);
      if(rows.length){
        body += `<div class="muted sm" style="margin:10px 0 4px"><b>${esc(t('In device-CA scope'))}${bc.pilotGroup?` (${esc(bc.pilotGroup)})`:''}</b> — ${esc(t('who still has to act'))}`
          + (bc.pilotMemberCount?` <span class="muted">${esc(tf('({0}/{1} listed)', rows.length, bc.pilotMemberCount))}</span>`:'')
          + `</div>`;
        body += table(['User','State','Edition','Chrome claims','Last claim','Last claimless','Other browsers'],
          rows.map(u=>{
            const s=SB[u.status]||['b-info',u.status];
            return [
              `<span class="mono sm trunc">${esc(u.user||'')}</span>`,
              `<span class="badge ${s[0]}">${esc(s[1])}</span>`,
              u.editions&&u.editions.length
                ? u.editions.map(e=>`<span class="badge ${e==='Pro'?'b-ok':'b-med'}" title="${e==='Pro'?'Intune deploys the extension automatically':'ADMX ingestion unsupported - manual install'}">${esc(e)}</span>`).join(' ')
                : `<span class="badge b-zero" title="No Intune-enrolled device found for this user">—</span>`,
              u.status==='noData'?`<span class="muted" title="No browser sign-in of any kind in the window - the state cannot be measured, which is not the same as ready">not measurable</span>`
                : u.needTotal?`${u.needClaim}/${u.needTotal}`:`<span class="muted">no Chrome use</span>`,
              `<span class="mono sm nw">${u.lastClaim?fmt(u.lastClaim):'—'}</span>`,
              `<span class="mono sm nw">${u.lastNoClaim?fmt(u.lastNoClaim):'—'}</span>`,
              u.unfixableTotal?`<span class="badge b-high" title="No extension exists for these - a CA scoping decision, not an install">${esc(u.unfixableBrowsers.join(', '))} ${u.unfixableTotal}</span>`:'—'];
          }), {scroll:300});
      }

      if((bc.findings||[]).length){
        body += `<div class="muted sm" style="margin:10px 0 4px"><b>Findings</b></div>`
          + bc.findings.map(f=>`<div class="muted" style="font-size:12px;white-space:normal;margin:0 0 4px">
              <span class="badge ${f.severity==='high'?'b-high':f.severity==='med'?'b-med':'b-low'}">${esc(f.severity)}</span> ${esc(ftext(f))}</div>`).join('');
      }
      body += `<div class="muted sm" style="margin:8px 0 0">Extension: <span class="mono sm">${esc(bc.extensionId)}</span> · window ${bc.windowDays}d${bc.truncated?' · <b>sign-in pull hit its bound, rates are partial</b>':''}</div>`;

      return panel('Browser Device Claims — SSO extension rollout',
        tf('{0} proven · {1} missing · last {2}d', bc.readyCount, bc.missingCount, bc.windowDays), body,
        ext(STORE, 'Chrome Web Store'));
    }

    function tabDevId(D){
      const html = deviceIdentityPanel(D.deviceIdentity) + browserClaimPanel(D.browserClaims);
      if(!html) return `<div class="empty">Device identity data not collected.</div>`;
      return (staleNote(D.deviceIdentity) || staleNote(D.browserClaims)) + html;
    }

    function tabDevices(D){
      const dv=D.intuneDevices;
      if(!dv) return '';
      if(!dv.available) return panel('Intune Devices','',notice(dv));
      let html='';
      const nc=dv.noncompliant||0, grace=dv.gracePeriod||0;
      const lag=dv.overviewLag||0;
      let k = kpi(dv.total,'Enrolled Devices',
        lag?`Intune summary still counts ${dv.overviewCount} — ${lag} stale record(s)`
           :(dv.mdmEnrolled!=null?tf('{0} MDM', dv.mdmEnrolled):null), lag?'warn':'', PORTAL.intuneDevices);
      k += kpi(dv.compliant,'Compliant',null,'ok',PORTAL.intuneDevices);
      k += kpi(nc,'Non-compliant', grace?tf('+{0} in grace', grace):null, nc>0?'bad':'ok', PORTAL.intuneCompliance);
      k += kpi(dv.encrypted,'Encrypted', tf('of {0}', dv.total), dv.total&&dv.encrypted>=dv.total?'ok':'warn', PORTAL.intuneDevices);
      Object.entries(dv.byOs||{}).forEach(([os,c])=>{ if(c>0) k+=kpi(c,os,null,'info',PORTAL.intuneDevices); });
      if(dv.ownership) k += kpi(dv.ownership.company||0,'Company-owned',
        (dv.ownership.personal?tf('{0} personal', dv.ownership.personal):'no personal devices'),
        dv.ownership.personal?'warn':'ok', PORTAL.intuneDevices);
      Object.entries(dv.byEdition||{}).forEach(([ed,c])=>{ if(c>0)
        k+=kpi(c,'Windows '+ed, ed==='Home'?'no ADMX ingestion':ed==='Unknown'?'edition not reported':null,
               ed==='Home'?'warn':ed==='Unknown'?'':'ok', PORTAL.intuneDevices); });
      html += panel('Device Inventory', tf('{0} enrolled · {1} compliance policies · {2} config profiles', dv.total, dv.compliancePolicyCount, dv.configProfileCount),
        help('Devices enrolled in Microsoft Intune (MDM). <b>Non-compliant</b> devices fail a compliance-policy rule (encryption, OS version, password). <b>Encrypted</b> = disk encryption (BitLocker/FileVault) on.<br><b>Edition</b> comes from <code>skuFamily</code> (beta API). It is not cosmetic: Intune <b>ADMX ingestion fails on Windows Home</b> (<code>0x86000013</code>), so any policy delivered as an ingested ADMX template must be applied by hand on those devices.') + `<div class="kpis" style="margin:0">${k}</div>`,
        ext(PORTAL.intuneDevices, 'Intune · Devices'));

      const compBadge=s=>{ const cls=s==='compliant'?'b-ok':(s==='noncompliant'||s==='error')?'b-high':s==='inGracePeriod'?'b-med':'b-info';
        return `<span class="badge ${cls}">${esc(s||'unknown')}</span>`; };
      const drows=(dv.devices||[]).map(d=>[
        d.id?`<a class="dl trunc" href="${esc(deepLink.device(d.id))}" target="_blank" rel="noopener noreferrer"
              title="Open this device in the Intune portal ↗">${esc(d.name||'—')}</a>`
            :`<span class="trunc">${esc(d.name||'—')}</span>`,
        `<span class="nw">${esc(d.os||'')} ${esc(d.osVersion||'')}</span>`,
        d.edition?`<span class="badge ${d.edition==='Home'?'b-med':'b-ok'}" title="${d.edition==='Home'?'ADMX ingestion unsupported - ingested-ADMX policies must be applied manually':'ADMX ingestion supported'}">${esc(d.edition)}</span>`
          :`<span class="badge b-zero">—</span>`,
        `<span class="nw">${esc(d.owner||'')}</span>`,
        compBadge(d.compliance),
        d.encrypted?`<span class="badge b-ok">Yes</span>`:`<span class="badge b-med">No</span>`,
        `<span class="mono sm nw">${fmt(d.lastSync)}</span>`,
        `<span class="mono sm trunc">${esc(d.user||'')}</span>`,
        d.id?rowLink(deepLink.device(d.id),'↗','Open this device in the Intune portal'):'']);
      html += panel('Managed Devices', dv.truncated?tf('showing first {0}', (dv.devices||[]).length):tf('{0} device(s)', (dv.devices||[]).length),
        drows.length?help('Click a device name (or the ↗ on the right) to open that device in the Intune portal in a new tab.')
          + table(['Device','OS','Edition','Owner','Compliance','Encrypted','Last sync','User',''],drows,{scroll:460}):`<div class="empty">No enrolled devices.</div>`,
        ext(PORTAL.intuneDevices, 'Intune · All devices'));

      const crows=(dv.compliancePolicies||[]).map(p=>[
        `<span class="trunc">${esc(p.name)}</span>`, `<span class="nw">${esc(p.os||'')}</span>`,
        ((p.reqs||[]).map(r=>`<span class="badge b-low">${esc(r)}</span>`)
          .concat((p.inert||[]).map(r=>`<span class="badge b-warn" title="${esc(tf('Configured on the policy but not evaluated - the master switch for it is off, so this is not enforced.'))}">${esc(tf('{0} (set, not enforced)', r))}</span>`))
          .join(' ')||'—')]);
      html += panel('Compliance Policies', `${dv.compliancePolicyCount}`,
        crows.length?table(['Policy','Platform','Requirements'],crows):`<div class="empty">No compliance policies configured.</div>`,
        ext(PORTAL.intuneCompliance, 'Intune · Compliance'));
      return html;
    }

    function renderHunting(th){
      if(!th) return '';
      if(!th.available){
        const perm=/403|permission|consent|license/i.test(th.reason||'');
        return panel('Email Threat Hunting', perm?'Permission needed':'Temporary error', notice(th) +
          (perm
            ? `<div class="muted" style="font-size:12px;margin-top:6px">Requires <code>ThreatHunting.Read.All</code> consent.</div>`
            : `<div class="muted" style="font-size:12px;margin-top:6px">Possible transient Graph advanced-hunting error; auto-recovers on next collection/refresh.</div>`));
      }
      const byType=th.byType||[], byAction=th.byAction||[], delivered=th.delivered||[];
      const senders=th.senders||[], recips=th.recipients||[], clicks=th.urlClicks||[], risky=th.riskyClicks||[], trend=th.trend||[];
      const total=byType.reduce((s,t)=>s+t.count,0);
      const blockedClicks=clicks.filter(c=>/block/i.test(c.action)).reduce((s,c)=>s+c.count,0);
      let html='';

      const spoofN=th.spoofDelivered||0, extN=th.externalDelivered||0, allowN=th.allowDelivered||0, zapN=th.zapTotal||0;
      let k='';
      k+=kpi(total,'Detected Threat Emails','Last 7 days','warn', PORTAL.explorer);
      k+=kpi(spoofN,'Own-domain Spoofing', spoofN?'⚠ review':'none', spoofN?'bad':'ok', PORTAL.explorer);
      k+=kpi(extN,'External Delivered', extN?'review':'none', extN?'warn':'ok', PORTAL.explorer);
      k+=kpi(allowN,'Allowlisted','treated as normal','ok', PORTAL.tpsReport);
      k+=kpi(zapN,'ZAP Removed (post-delivery)', zapN?'auto-removed':'', 'info', PORTAL.quarantine);
      k+=kpi(blockedClicks,'Blocked Malicious Clicks', '', blockedClicks?'warn':'ok', PORTAL.explorer);
      const sub = th.partial ? 'Last 7 days · some queries had transient errors' : 'Last 7 days · Defender Advanced Hunting';
      html += panel('Email Threat Hunting — Summary', sub, `<div class="kpis" style="margin:0">${k}</div>` +
        (trend.length ? `<div class="muted" style="font-size:12px;margin:14px 0 4px">Daily threat trend (phish/malware/spam)</div>
          ${sparkline(trend.map(t=>t.count))} <span class="muted mono sm">${trend.map(t=>t.count).join(' · ')}</span>` : ''),
        ext(PORTAL.explorer, 'Defender · Explorer'));

      const typeRows=byType.map(t=>{ const bad=/phish|malware/i.test(t.type);
        return [`<span class="badge ${bad?'b-high':'b-med'}">${esc(t.type)}</span>`, t.count]; });
      const actRows=byAction.map(a=>{ const handled=/block|junk|quarant|replac/i.test(a.action);
        return [esc(a.action), `<span class="badge ${handled?'b-ok':'b-high'}">${a.count}</span>`]; });
      html += `<div class="grid2">
        ${panel('By Threat Type (ThreatTypes)', tf('{0} types', byType.length), table(['Type','Count'],typeRows), ext(PORTAL.explorer,'Defender · Explorer'))}
        ${panel('By Delivery Action', 'All threat types · Blocked/quarantined = good, Delivered = caution', table(['Action','Count'],actRows), ext(PORTAL.tpsReport,'Threat protection status'))}</div>`;

      const catBadge={spoof:'<span class="badge b-high">Own-domain</span>',
                      external:'<span class="badge b-med">External</span>',
                      allow:'<span class="badge b-ok">Allowlisted</span>'};
      const dkey = d => `${(d.sender||'').toLowerCase()}|${(d.subject||'').toLowerCase()}`;
      const dgroups = {};
      delivered.forEach(d => { (dgroups[dkey(d)] = dgroups[dkey(d)] || []).push(d); });

      function notifyHref(d, recips, cc){
        const dom = (d.sender||'').split('@')[1] || '';
        const subj = '[Security] Malicious email received - please do not open';
        const closing = d.cat === 'spoof'
          ? 'This message forged our own domain - it did not come from a colleague, despite how the sender address looks.'
          : d.cat === 'allow'
            ? 'This sender is on our allowlist, so this may be a false positive - please tell me either way before deleting it.'
            : (dom ? `The sender domain "${dom}" is being blocked.` : '');
        const body = [
          'Dear Team,', '',
          `Our mail security system has flagged the message below as ${d.threat||'a threat'}. It was delivered to your mailbox.`, '',
          `  Sender:   ${d.sender||''}`,
          `  Subject:  ${d.subject||''}`,
          `  Received: ${fmtMail(d.time)}`, '',
          'Please reply and let me know if you have already opened it, clicked any link, or opened any attachment.', '',
          `If the message is still in your mailbox, delete it without opening it.${closing?' '+closing:''}`, '',
          'Thank you.'
        ].join('\r\n');
        const parts = [];
        if (cc) parts.push(`cc=${cc.split(/[,;]/).map(s=>s.trim()).filter(Boolean).join(';')}`);
        parts.push(`subject=${encodeURIComponent(subj)}`);
        parts.push(`body=${encodeURIComponent(body)}`);
        return `mailto:${recips.join(';')}?${parts.join('&')}`;
      }

      const drows=delivered.map(d=>{
        const cat=d.cat||'external';
        const subjCell = d.msgId
          ? `<span class="dl trunc" role="button" tabindex="0" title="Investigate this message in Advanced Hunting — ${esc(d.subject||'')}"
              onclick="hunt('msg',${jsArg(d.msgId)},'')">${esc(d.subject||'(no subject)')}</span>`
          : `<span class="trunc" title="${esc(d.subject||'')}">${esc(d.subject||'')}</span>`;
        const sendCell = d.sender
          ? `<span class="dl trunc" role="button" tabindex="0" title="Investigate this sender's mail from the last 30 days — ${esc(d.sender)}"
              onclick="hunt('sender',${jsArg(d.sender)},'')">${esc(d.sender)}</span>`
          : `<span class="trunc"></span>`;
        const grp = dgroups[dkey(d)] || [d];
        const recips = [...new Set(grp.map(x=>x.recipient).filter(Boolean))];
        const notifyBtn = recips.length
          ? `<a class="rowlink" href="${esc(notifyHref(d, recips, th.notifyCc||''))}"
               title="Open a warning draft in your mail client, addressed to all ${recips.length} recipient(s) of this message: ${esc(recips.join(', '))}. Nothing is sent until you send it.">✉${recips.length>1?recips.length:''}</a>`
          : '';
        const acts = notifyBtn
          + (d.msgId?huntBtn('msg',d.msgId,'','🔎','Investigate this single message in Advanced Hunting (NetworkMessageId)'):'')
          + rowLink(PORTAL.explorer,'EX','Open Defender Explorer (set the date range and filters yourself)');
        return `<tr data-cat="${cat}">
          <td>${catBadge[cat]||''}</td>
          <td><span class="mono sm nw">${fmt(d.time)}</span></td>
          <td>${sendCell}</td>
          <td><span class="trunc">${esc(d.recipient||'')}</span></td>
          <td>${subjCell}</td>
          <td><span class="badge ${/phish|malware/i.test(d.threat||'')?'b-high':/spam/i.test(d.threat||'')?'b-med':'b-info'}">${esc(d.threat||'')}</span></td>
          <td><span class="nw">${esc(d.location||'')}</span></td>
          <td class="acts">${acts}</td></tr>`;
      }).join('');
      const totalDel=spoofN+extN+allowN;
      const pills=`<div id="delivered-filter">
        <span class="fpill active" data-cat="all" onclick="filterDelivered('all')">All (${totalDel})</span>
        <span class="fpill" data-cat="spoof" onclick="filterDelivered('spoof')">Own-domain (${spoofN})</span>
        <span class="fpill" data-cat="external" onclick="filterDelivered('external')">External (${extN})</span>
        <span class="fpill" data-cat="allow" onclick="filterDelivered('allow')">Allowlisted (${allowN})</span></div>`;
      const delBody = delivered.length
        ? help('All threat emails (phish, malware, spam) that Defender <b>delivered</b> (not blocked/quarantined). <b>Own-domain</b> = spoofing your domain (review); <b>External</b> = outside senders (review); <b>Allowlisted</b> = expected senders such as the sales portal / affiliate domains (normally benign). Threat column shows the type; use the filters to focus.')
          + help('<b>Pivots:</b> click a <b>Subject</b> to copy a KQL query for that one message and open Defender <b>Advanced Hunting</b> in a new tab — paste, Run, then click the <b>NetworkMessageId</b> in the results to reach the <b>Email entity</b> page. Click a <b>Sender</b> to pull all mail from that sender over the last 30 days. <b>EX</b> opens Threat Explorer.')
          + help('<b>✉ Notify:</b> opens a warning <b>draft</b> in your own mail client, addressed to <b>every recipient of that message</b> (the number on the button) with the fixed Cc from <code>THREAT_NOTIFY_CC</code>. Review it and send it yourself — <b>the dashboard never sends mail</b>, and must never be given permission to: it is internet-exposed, and app-only <code>Mail.Send</code> would let a compromise send as any user in the tenant. The draft says the message <i>was delivered</i> rather than "already deleted", because this table only proves delivery; if ZAP removed it afterwards, edit that line before sending.')
          + pills
          + `<div class="tbl-wrap dscroll"><table class="tbl" id="delivered-tbl"><thead><tr>
              <th>Class</th><th>Time</th><th>Sender</th><th>Recipient</th><th>Subject</th><th>Threat</th><th>Delivery</th><th>Pivot</th></tr></thead>
              <tbody>${drows}</tbody></table></div>`
        : `<div class="empty">✅ No phish/malware delivered in the last 7 days.</div>`;
      html += panel('Delivered Threat Emails', tf('{0} delivered (last 7d) · showing up to 200 most recent', totalDel), delBody,
        ext(PORTAL.explorer, 'Defender · Explorer'));

      const sndRows=senders.map(s=>[
        `<span class="dl trunc" role="button" tabindex="0" title="Investigate this domain's mail from the last 30 days"
          onclick="hunt('senderDomain',${jsArg(s.domain)},'')">${esc(s.domain)}</span>`, s.count,
        huntBtn('senderDomain',s.domain,'','🔎','Investigate this sender domain in Advanced Hunting')]);
      const recRows=recips.map(r=>[
        `<span class="dl trunc" role="button" tabindex="0" title="Investigate threat mail this recipient received in the last 30 days"
          onclick="hunt('recipient',${jsArg(r.recipient||'')},'')">${esc(r.recipient||'')}</span>`, r.count,
        huntBtn('recipient',r.recipient||'','','🔎','Investigate this recipient in Advanced Hunting')]);
      html += `<div class="grid2">
        ${panel('Top Phishing Sender Domains', 'Click a domain → Advanced Hunting', table(['Sender Domain','Count','Pivot'],sndRows), ext(PORTAL.tabl,'Tenant Allow/Block'))}
        ${panel('Top Targeted Recipients', 'Accounts receiving the most phish/malware', table(['Recipient','Count','Pivot'],recRows), ext(PORTAL.explorer,'Defender · Explorer'))}</div>`;

      const clickRows=clicks.map(c=>{ const b=/block/i.test(c.action);
        return [esc(c.action), `<span class="badge ${b?'b-high':'b-info'}">${c.count}</span>`]; });
      const urlCell = u => {
        if(!u) return '';
        let host = ''; try { host = new URL(u).host; } catch(e) { host = ''; }
        const rest = host ? u.slice(u.indexOf(host)+host.length) : u;
        return `<span class="trunc" title="${esc(u)}">`
             + (host?`<b>${esc(host)}</b>`:'')
             + `<span class="muted"> ${esc(rest.length>48?rest.slice(0,48)+'…':rest)}</span></span>`;
      };
      const riskyRows=risky.map(r=>{ const cls=r.through?'b-high':(/block/i.test(r.action)?'b-med':'b-info');
        const hint = /error/i.test(r.action)
          ? t('Safe Links could not resolve the destination - not a block and not a bypass')
          : (r.through ? t('The user saw a warning and went anyway') : '');
        return [`<span class="mono sm nw">${fmt(r.time)}</span>`,
          `<span class="trunc">${esc(r.user||'')}</span>`,
          urlCell(r.url||''),
          `<span class="badge ${cls}"${hint?` title="${esc(hint)}"`:''}>${esc(r.action)}${r.through?' · through':''}</span>`,
          huntBtn('click', r.msgId||'', r.url||'', '🔎', 'Investigate this click event in Advanced Hunting')]; });
      html += `<div class="grid2">
        ${panel('Safe Links Clicks (by action)', 'Blocked = risk / Allowed = normal', table(['Action','Count'],clickRows), ext(PORTAL.safeLinks,'Defender · Safe Links'))}
        ${panel('Risky URL Clicks', 'Blocked, bypassed, or the scan could not resolve it', risky.length? table(['Time','User','URL','Action','Pivot'],riskyRows):`<div class="empty">✅ No risky clicks</div>`, ext(PORTAL.explorer,'Defender · Explorer'))}</div>`;

      const clicked = th.clickedThreats||[];
      function clickFacts(c){
        return [`  Sender:            ${c.sender||''}`,
                `  Subject:           ${c.subject||''}`,
                `  Received:          ${fmtMail(c.received)}`,
                `  Judged malicious:  ${fmtMail(c.zapTime)}${c.threat?` (${c.threat})`:''}`].join('\r\n');
      }
      function clickerBody(c){
        const opened = `  Link opened:       ${fmtMail(c.firstClick)}${c.clickCount>1?` (${c.clickCount} times)`:''}`;
        if(c.state==='blocked') return ['Hello,','',
          'Our mail security system blocked a link you opened, so nothing was exposed and there is nothing you need to do. This note is only so that you know it happened.','',
          clickFacts(c), opened,'',
          'If that message looked like it came from a colleague or from a supplier you deal with, please tell me — that pattern is worth a closer look.','',
          'Thank you.'].join('\r\n');
        const lead = c.state==='through'
          ? 'The link below was flagged when you opened it, and the warning page was passed to continue to the site. The message itself has since been removed from your mailbox automatically.'
          : 'A link you opened from the message below has since been judged malicious. The link was not yet known to be malicious when you opened it, so Safe Links did not block it. The message has already been removed from your mailbox automatically.';
        return ['Hello,','', lead,'', clickFacts(c), opened,'',
          'As a precaution the following will be done on your account:','',
          '  1. Sign-out from all sessions on every device',
          '  2. Your password reset to the temporary one below',
          '  3. Microsoft Authenticator and phone sign-in registrations removed','',
          `  Temporary password:  ${tempPasswordFor(c.msgId+'|'+(c.user||''))}`,'',
          'That temporary password stops working the moment you use it - you will be asked to set your own straight away. Please delete this email once you are back in.','',
          'Your Windows Hello PIN on your company laptop is not affected. Sign in with it as usual — you will then be asked to set a new password and to register the Authenticator app again yourself.','',
          'Please reply and tell me whether you entered your password, or any other information, on a page opened from that link. That changes what needs to be done — and telling me quickly matters far more than not having clicked, so please reply either way.','',
          'One thing for next time: if Outlook showed the "you do not often get email from this sender" banner on that message, it is worth a second look whenever a message like that asks you to open or download something.','',
          'Thank you.'].join('\r\n');
      }
      function othersBody(c){
        return ['Dear Team,','',
          'The message below was delivered to you and has since been judged malicious. It has already been removed from your mailbox automatically, so there is nothing for you to delete.','',
          clickFacts(c),'',
          'Our records do not show you opening the link. Those records only cover links rewritten by Safe Links, so they are not proof. If you did open it, or entered any information on a page it led to, please reply and tell me.','',
          'Thank you.'].join('\r\n');
      }
      function clickHref(c, who){
        const toClicker = who==='clicker';
        const recips = toClicker ? [c.user].filter(Boolean) : (c.others||[]);
        const subj = toClicker
          ? (c.state==='blocked' ? '[Security] A malicious link you opened was blocked'
                                 : '[Security] Action required - a link you opened was found malicious')
          : '[Security] A malicious email was removed from your mailbox';
        const parts = [];
        const cc = th.notifyCc||'';
        if(cc) parts.push(`cc=${cc.split(/[,;]/).map(s=>s.trim()).filter(Boolean).join(';')}`);
        parts.push(`subject=${encodeURIComponent(subj)}`);
        parts.push(`body=${encodeURIComponent(toClicker?clickerBody(c):othersBody(c))}`);
        return `mailto:${recips.join(';')}?${parts.join('&')}`;
      }
      const clickState = {late:['b-high','Verdict after click'], through:['b-high','Clicked through'],
                          blocked:['b-med','Blocked']};
      const clickedRows = clicked.map(c=>{
        const st = clickState[c.state]||['b-info',c.state||''];
        const gap = (c.firstClick&&c.zapTime) ? Math.round((new Date(c.zapTime)-new Date(c.firstClick))/36e5) : null;
        const toUser = c.user
          ? `<a class="rowlink" href="${esc(clickHref(c,'clicker'))}"
               title="Open a draft to the person who clicked. Nothing is sent until you send it.">✉</a>` : '';
        const toOthers = (c.others||[]).length
          ? `<a class="rowlink" href="${esc(clickHref(c,'others'))}"
               title="Open a draft to the ${c.others.length} other recipient(s) of the same message: ${esc(c.others.join(', '))}. Nothing is sent until you send it.">✉${c.others.length}</a>` : '';
        const pwCell = c.state==='blocked'
          ? '<span class="muted sm">—</span>'
          : `<span class="mono sm nw" title="Reset the account to exactly this, then send the draft. Regenerated only when the page reloads.">${esc(tempPasswordFor(c.msgId+'|'+(c.user||'')))}</span>`;
        return [`<span class="mono sm nw">${fmt(c.firstClick)}</span>`,
          `<span class="trunc">${esc(c.user||'')}</span>`,
          `<span class="trunc" title="${esc(c.subject||'')}">${esc(c.subject||'')}</span>
           <div class="muted sm trunc">${esc(c.sender||'')}</div>`,
          `<span class="badge ${st[0]}">${esc(t(st[1]))}</span>`,
          gap===null?'—':`<span class="mono sm nw">${gap}h</span>`,
          `<span class="mono sm">${c.clickCount||0}</span>`,
          pwCell,
          toUser + toOthers + huntBtn('click', c.msgId||'', c.url||'', '🔎', 'Investigate this click in Advanced Hunting')];
      });
      html += panel('Clicked Threats — notify',
        'Clicks on a message ZAP later pulled back — the ✉ buttons open drafts you review and send',
        clicked.length
          ? table(['First click','User','Message','Verdict','Click→verdict','Clicks','Temp password','Notify'], clickedRows)

          ${kpi(rs.uniqueUsers,'Users seen',null,'',PORTAL.entraSignIns)}

        if(trend.length>1) body += `<div style="margin-top:10px">${sparkline(trend)}<div class="kpi-label">${esc(tf('Failed sign-ins · {0}-day trend', rs.windowDays))}</div></div>`;

          help('Interactive sign-in success/failure from the Entra ID sign-in logs (P1). <b>Top failed users</b> = brute-force targets; <b>spray IPs</b> = one source IP failing against many accounts (password spray); <b>multi-IP users</b> = accounts signing in from many IPs (possible sharing / travel / takeover).') + body,
          ext(PORTAL.entraSignIns, 'Entra · Sign-in logs'));

        const fu=(rs.topFailedUsers||[]).map(u=>[`<span class="mono sm trunc">${esc(u.user)}</span>`, `<span class="badge b-med">${u.count}</span>`]);
        const spray=(rs.sprayIps||[]).map(s=>[`<span class="mono sm">${esc(s.ip)}</span>`, `<span class="badge b-high">${s.users} users</span>`, `<span class="badge b-med">${s.failed} fails</span>`,

            `<span class="muted nw">${esc(e.location||'—')}</span>`]);
          sprayBody += help('Spray leaves no successes — an IP where most sign-ins succeed is where your own people come out (SASE / VPN / office NAT), not an attacker. Those are listed below and excluded from the count above. ⚠ An IP that a takeover already succeeded from also has successes, so this exclusion cannot stand alone: the "failures then a success" rule in High-signal Sign-in Events deliberately ignores it.')
            + table(['Corporate egress','Success','Failures','Location'], eg);
        }
        html += `<div class="grid2">
          ${panel('Top Failed Sign-in Users', 'Brute-force / spray targets', fu.length?table(['User','Fails'],fu):`<div class="empty">✅ No failed sign-ins</div>`, siLink)}

        const sg=(rs.riskSignals||[]).map(g=>[

          `<span class="mono sm trunc">${esc(g.user)}</span>`,
          `<span class="mono sm" style="white-space:normal;word-break:break-word">${esc(g.ip)}</span>`,
          `<span class="muted nw">${esc(g.location||'—')}</span>`,
          `<span class="nw muted">${g.lastSeen?fmt(g.lastSeen):'—'}</span>`,
          `<span style="white-space:normal">${esc(LANG==='ko'?(g.detailKo||g.detailEn):(g.detailEn||g.detailKo))}</span>`]);
        let sgBody = sg.length
          ? table(['','User','Source IP','Location','Last','Why this is here'], sg, {scroll:360})
          : `<div class="empty">✅ ${esc(t('Nothing met the high-signal rules in this window.'))}</div>`;
        sgBody += help('Four rules, in priority order: (1) repeated credential failures followed by a SUCCESS from the same IP — a spray that worked; (2) a successful sign-in from a country under 1% of this tenant\'s traffic — travel and takeover look identical here, so ask the person; (3) credential failures from an IP with zero successes; (4) attempts against a disabled account. A single failure is only listed when it came from something that is not a human client — no device, no browser — because a single event from such a client (PowerShell from a hosting range, for example) can be the most useful signal.');
        if(rs.unclassifiedFailCodes && Object.keys(rs.unclassifiedFailCodes).length)
          sgBody += help(tf('{0} failure code(s) are not classified as either attack or policy-working and are counted in neither: {1}. They are printed rather than dropped — an allowlist that silently swallows an unknown code is the one way this can go quiet.', Object.keys(rs.unclassifiedFailCodes).length, Object.entries(rs.unclassifiedFailCodes).map(([k,v])=>k+'×'+v).join(', ')));
        html += panel('High-signal Sign-in Events',
          tf('{0} signal(s) · {1} high', rs.riskSignalCount||0, rs.riskSignalHigh||0), sgBody, siLink);

        const rf=(rs.recentFailures||[]).map(f=>[`<span class="mono sm nw">${fmt(f.time)}</span>`, `<span class="trunc">${esc(f.user)}</span>`, `<span class="mono sm">${esc(f.ip)}</span>`, `<span class="nw muted">${esc(f.location||'—')}</span>`, `<span class="trunc muted" title="${esc((LANG==='ko'?(f.errorKo||f.error):f.error)||'')}">${esc((LANG==='ko'?(f.errorKo||f.error):f.error)||'')}</span>`]);
        html += `<div class="grid2">
          ${panel('Multi-IP Sign-in Users', 'Signed in from many IPs', mi.length?table(['User','Distinct IPs','IP addresses'],mi):`<div class="empty">✅ None above threshold</div>`, siLink)}
          ${panel('Recent Failed Sign-ins', 'Most recent', rf.length?table(['Time','User','Source IP','Location','Error'],rf,{scroll:340}):`<div class="empty">✅ No recent failures</div>`, siLink)}</div>`;
      } else if(rs){ html += panel('Anomalous Sign-ins','',notice(rs)); }
      return html;

    function unattendedPanel(un, roPolicyCount){
      if(!un) return '';
      if(!un.available) return panel('Unattended Account Exposure','',notice(un));
      const link = ext(PORTAL.entraCA, 'Entra · Conditional Access');
      let k = kpi(un.exposedCount||0,'Locked out now','in a policy they cannot satisfy',
                  un.exposedCount?'bad':'ok');
      k += kpi(un.reportOnlyExposedCount||0,'Would be locked out',
               roPolicyCount ? 'if the report-only policies were enforced'
                             : 'no report-only policy to simulate',
               un.reportOnlyExposedCount?'warn':(roPolicyCount?'ok':'info'));
      k += kpi(un.conditionallyGatedCount||0,'Gated, not blocked','protected by a conditional block',
               un.conditionallyGatedCount?'ok':'');
      k += kpi(un.licenceProvenCount||0,'Appliance accounts','proven by licence SKU','info');
      let body = help('A Teams Rooms console or shared-device account signs in with <b>nobody present</b>. '
        + 'A policy that requires MFA cannot prompt it — it <b>locks it out</b>, and the failure looks '
        + 'like an ordinary sign-in error. Fix by excluding these accounts and giving them their own '
        + 'policy that requires a <b>trusted location or compliant device</b> instead of MFA — an excluded '
        + 'account has no authentication requirement at all, and a meeting room is physically open.<br>'
        + '<b>A narrowed block is not a lockout.</b> "Deny outside the office" is the recommended shape for '
        + 'a room account: it permits the room at its desk and denies a stolen password elsewhere. Those '
        + 'show as <i>Gated</i>, not as locked out.')
        + `<div class="kpis" style="margin:0 0 10px">${k}</div>`;

      const f=un.findings||[];
      if(f.length){
        body += table(['Account','Why unattended','Policy','Reaches it?','State','Controls'], f.map(x=>[
          `<span class="trunc">${esc(x.name||x.upn||'?')}</span>`,
          x.evidence==='licence'
            ? `<span class="badge b-high" title="${esc((x.skus||[]).join(', '))}">${esc(t('licence'))}</span>`
            : `<span class="badge b-info" title="${esc(t('Matched on display name only — verify this is not a person'))}">${esc(t('name only'))}</span>`,
          `<span class="trunc">${esc(x.policy||'')}</span>`,
          (function(){
            const raw = (LANG==='ko' ? (x.reachWhyKo || x.reachWhy) : x.reachWhy) || '';
            const why = esc(raw);
            if(x.reach === 'legacyOnly')
              return `<span class="badge b-ok" title="${why}">${esc(t('no · legacy only'))}</span>`;
            if(x.reach === 'conditionalBlock')
              return `<span class="badge b-low" title="${why}">${esc(t('conditional'))} · ${raw.length>28?esc(t('narrowed')):why}</span>`;
            if(x.reach === 'cannotSatisfy')
              return `<span class="badge b-high" title="${why}">${esc(t('yes · cannot satisfy'))}</span>`;
            return `<span class="badge b-high" title="${why}">${esc(t('yes · blocks outright'))}</span>`;
          })(),
          x.enforced?`<span class="badge b-high">${esc(t('Enforced'))}</span>`:`<span class="badge b-med">${esc(t('Report-only'))}</span>`,
          (x.controls||[]).map(c=>`<span class="badge b-med">${esc(c)}</span>`).join(' ')||'—']));
      } else if(un.candidateCount){
        body += `<div class="empty">✅ ${esc(tf('{0} unattended account(s) found, none in scope of a policy that would lock them out.', un.candidateCount))}</div>`;
      } else {
        body += `<div class="empty">${esc(t('No unattended (room / shared-device / resource) accounts found.'))}</div>`;
      }
      if((un.roomSkus||[]).length){
        body += `<div class="muted" style="font-size:12px;margin-top:8px">${esc(t('Appliance SKUs in this tenant:'))} ${un.roomSkus.map(esc).join(', ')}</div>`;
      }
      body += `<div class="muted" style="font-size:12px;margin-top:6px">${esc(tf('Checked against {0} enabled/report-only policy(ies) with a blocking grant control. Configuration check — it answers this before a cutover, unlike the sign-in logs, where an unattended account only shows up in the non-interactive collection.', un.policyCount||0))}</div>`;
      const sub = un.exposedCount
        ? tf('{0} locked out by an enforced policy', un.exposedCount)
        : un.conditionallyGatedCount
          ? tf('{0} gated by a conditional block · none locked out', un.conditionallyGatedCount)
          : 'Teams Rooms · shared device · resource accounts';
      return panel('Unattended Account Exposure', sub, body, link);
    }

    function nonInteractivePanel(ni){
      if(!ni) return '';
      if(!ni.available){
        return panel('Non-interactive CA Blocks','',
          `<div class="notice">⚠ ${esc(ni.reason||'not collected')}</div>`);
      }
      const link = ext(PORTAL.entraSignIns, 'Entra · Sign-in logs');
      let k = kpi(ni.stuckCount||0,'Stuck','blocked, nothing succeeded after', ni.stuckCount?'bad':'ok');
      k += kpi(ni.flappingCount||0,'Still blocking',tf('blocks in the last {0}min', ni.recentMinutes), ni.flappingCount?'warn':'ok');
      k += kpi(ni.recoveredCount||0,'Recovered','normal MFA fallback','ok');
      k += kpi(ni.blockCount||0,'Blocks',tf('{0} account(s), {1}h window', ni.accountCount||0, ni.windowHours),'info');

      let body = help('These are sign-ins the portal hides by default: the <b>non-interactive</b> collection. '
        + 'A block here is usually <b>benign</b> — the client tried a silent token refresh, Conditional Access '
        + 'asked for MFA, the client then prompted and the user completed it. What matters is the exception:<br>'
        + '<b>Stuck</b> = blocked and nothing succeeded afterwards. An account that cannot complete a prompt is '
        + 'one that has nobody to answer it — a Teams Rooms console, a shared-device or workload identity. '
        + 'This is a real outage.<br>'
        + `<b>Still blocking</b> = something did succeed, yet blocks are still arriving. Typically one client `
        + 'stuck in a retry loop (a phone mail app) while the account\'s other clients work.')
        + `<div class="kpis" style="margin:0 0 10px">${k}</div>`;

      if(ni.truncated){
        body += `<div class="notice" style="margin-bottom:10px">⚠ Record cap reached — results cover only from `
          + `${fmt(ni.coverageFrom)} onward, not the full ${ni.windowHours}h. Anything blocked before that is not shown.</div>`;
      }

      const accts = ni.accounts||[];
      if(!accts.length){
        body += `<div class="empty">✅ No Conditional Access blocks in the non-interactive logs for the last ${ni.windowHours}h.</div>`;
      } else {
        const vb = a => a.verdict==='stuck'
            ? `<span class="badge b-high" title="No success after the last block — nothing is completing the challenge">Stuck</span>`
          : a.verdict==='flapping'
            ? `<span class="badge b-med" title="Succeeded, but blocks are still arriving — one client is looping">Still blocking</span>`
          : a.verdict==='unknown'
            ? `<span class="badge b-info" title="${esc(a.probeNote||'could not determine')}">Unknown</span>`
          : `<span class="badge b-ok" title="Succeeded after the last block — normal MFA fallback">Recovered</span>`;
        body += table(['Account','Verdict','Blocks',tf('Last {0}min', ni.recentMinutes),'Last block','Last success','Policy','Client(s)'],
          accts.map(a=>[
            `<span class="mono sm trunc">${esc(a.user)}</span>`
              + (a.kind==='servicePrincipal'?` <span class="badge b-info" title="Workload identity, not a person">app</span>`:''),
            vb(a),
            `<span class="mono sm">${a.blocks}</span>`,
            a.blocksRecent?`<span class="badge b-med">${a.blocksRecent}</span>`:`<span class="badge b-zero">0</span>`,
            `<span class="mono sm nw">${fmt(a.lastBlock)}</span>`,
            a.lastSuccess?`<span class="mono sm nw">${fmt(a.lastSuccess)}</span>`
                          :`<span class="badge b-high">none</span>`,
            `<span class="trunc">${(a.policies||[]).map(esc).join(', ')||'—'}</span>`,
            `<span class="trunc muted">${((a.recentApps||[]).length?a.recentApps:a.apps||[]).map(esc).join(', ')||'—'}</span>`]),
          {scroll:400});
      }
      body += `<div class="muted" style="font-size:12px;margin-top:8px">Window ${ni.windowHours}h`
        + (ni.coverageFrom?` (from ${fmt(ni.coverageFrom)})`:'')
        + `. The interactive metrics on the Sign-in Activity tab deliberately exclude these records: a silent-refresh `
        + `challenge is not a failed sign-in, and counting it as one would wreck the failure rate and the spray signal.</div>`;
      return panel('Non-interactive CA Blocks',
        ni.stuckCount?tf('{0} stuck', ni.stuckCount):ni.flappingCount?tf('{0} still blocking', ni.flappingCount):'unattended & background clients',
        body, link);
    }

    function deviceBlockPanel(rs){
      const rows=rs.deviceCaBlocks||[], nU=rs.deviceCaBlockUsers||0, nE=rs.deviceCaBlockEvents||0;
      const pols=(rs.deviceCaPolicies||[]);
      if(rs.deviceCaClassifiable===false){
        return panel('Device CA Blocks', 'cannot classify',
          `<div class="verdict bad">⛔ <b>The Conditional Access policy list could not be read</b>, so device
           policies cannot be told apart from the rest. This panel is <b>not</b> reporting zero blocks —
           it is reporting that it does not know. Check the app registration's
           <span class="mono sm">Policy.Read.All</span> permission on the Data Health tab.</div>`,
          ext(PORTAL.entraCA, 'Entra · Conditional Access'));
      }
      const CLAIM={
        noClaim:['b-high','no device claim',
          'The sign-in never presented a device identity. Fix the CLIENT — Edge work profile, or the '
          + 'Chrome SSO extension. The machine itself is usually healthy, so re-registering it is the wrong move.'],
        claimNotCompliant:['b-med','device not compliant',
          'A known device was presented but failed the tag or compliance test. This one really is a device fix.'],
        claimCompliant:['b-info','compliant, still blocked',
          'The device is healthy and was still stopped. Suspect the policy, not the device.'],
      };
      const n24=rs.deviceCaBlockUsers24h||0, e24=rs.deviceCaBlockEvents24h||0;
      let body;
      if(!nU){
        body=`<div class="verdict ok">✅ ${tf('<b>Nobody has been blocked by a device policy</b> in the last {0} days.', rs.windowDays)}</div>`;
      } else if(!n24){
        body=`<div class="verdict ok">✅ ${tf('<b>Nobody blocked in the last 24 hours.</b> {0} person(s) were blocked earlier in the {1}-day window and it has stopped — check the <b>Last</b> column before treating any of these as open.', nU, rs.windowDays)}</div>`;
      } else {
        body=`<div class="verdict ${e24>=10?'bad':'warn'}">${e24>=10?'⛔':'⚠'} ${tf('<b>{0} person(s) blocked in the last 24 hours</b> — {1} sign-in(s)', n24, e24)}${nU>n24?tf(', plus {0} more earlier in the {1}-day window that have stopped', nU-n24, rs.windowDays):''}. ${t('Repeated hits mean somebody is retrying and cannot work; reach out rather than waiting for the ticket.')}</div>`;
      }
      body+=help('A device policy stopping a sign-in is not the control working — it is somebody unable to '
        + 'reach their own mail on a laptop we already approved. Read <b>Why</b> before acting: <b>no device '
        + 'claim</b> is a browser problem and re-registering the machine will not fix it, while <b>device not '
        + 'compliant</b> is the opposite. The quickest remedy for the first is Edge with the work profile — '
        + 'it needs no install. Grant a time-boxed exception only when you cannot reach the person: it '
        + 'suspends every device requirement they have.');
      if(nU){
        body+=table(['User','Blocked','Why','First','Last','Browser / client','Policy'],
          rows.map(r=>{
            const c=CLAIM[r.claim]||['b-info',r.claim||'unknown',''];
            return [`<span class="mono sm trunc">${esc(r.user)}</span>`,
              `<span class="badge ${r.count>=10?'b-high':'b-med'}">${r.count}</span>`,
              `<span class="badge ${c[0]}" title="${esc(t(c[2]))}">${esc(t(c[1]))}</span>`,
              `<span class="mono sm nw">${r.first?fmt(r.first):'—'}</span>`,
              `<span class="mono sm nw">${r.last?fmt(r.last):'—'}</span>`,
              `<span class="trunc muted">${(r.browsers||[]).map(b=>`${esc(b.name)} ${b.count}`).join(', ')||'—'}</span>`,
              `<span class="trunc muted">${(r.policies||[]).map(esc).join(', ')||'—'}</span>`];
          }), {scroll:300});
      }
      body+=`<div class="muted sm" style="margin:8px 0 0">${esc(t('Device policies in force:'))}
        ${pols.length?pols.map(p=>`<span class="mono sm">${esc(p)}</span>`).join(' · ')
                     :t('<b>none enabled</b> — nothing here can block anyone')} · ${esc(tf('window {0}d', rs.windowDays))}</div>`;
      return panel('Device CA Blocks — who cannot work right now',
        n24?tf('⛔ {0} blocked in 24h · {1} in {2}d', n24, nU, rs.windowDays)
          :nU?tf('✅ 0 in 24h · {0} earlier in {1}d', nU, rs.windowDays)
             :tf('✅ 0 blocked · {0}d', rs.windowDays),
        body, ext(PORTAL.entraCA, 'Entra · Conditional Access'));
    }

    function caExceptionPanel(ce){
      if(!ce) return '';
      if(!ce.available) return panel('CA Exceptions', '', notice(ce), ext(PORTAL.entraCA, 'Entra · Conditional Access'));
      const need=ce.actionNeeded||0, exp=ce.expiringCount||0;
      const STATUS={
        overdue:['b-high','overdue','Past its deadline and still in place. This is the one that was supposed to be gone.'],
        undocumented:['b-high','no record','In the tenant with nothing saying why. Find the reason or remove it.'],
        expiring:['b-med','due soon','Still valid. Decide before it becomes overdue — extend with a real date, or revoke.'],
      };
      const rows=[]
        .concat((ce.overdue||[]).map(r=>({...r, s:'overdue', when:`${r.expires} · ${r.daysOver}d ago`})))
        .concat((ce.undocumented||[]).map(r=>({...r, s:'undocumented', when:'—'})))
        .concat((ce.expiring||[]).map(r=>({...r, s:'expiring', when:`${r.expires} · D-${r.daysLeft}`})));
      let body = need
        ? `<div class="verdict bad">⛔ <b>${need} person(s) need a decision</b> —
           ${ce.overdueCount} past deadline, ${ce.undocumentedCount} with no record. An exclusion
           suspends <b>every</b> device requirement for that person, so this is the widest hole the
           tenant has.</div>`
        : exp
        ? `<div class="verdict warn">⚠ <b>${esc(tf('{0} exception(s) due within {1} days.', exp, ce.expiringSoonDays))}</b>
           ${esc(t('Nothing breaks when the date passes — decide now, while it is still a decision rather than an oversight.'))}</div>`
        : `<div class="verdict ok">✅ <b>${esc(t('Every exclusion is recorded and within its date.'))}</b></div>`;
      body += `<div class="verdict ${need?'bad':'warn'}" style="margin-top:8px">★ <b>${esc(t('These dates are not enforced.'))}</b> ${esc(ce.autoExpiryReason||'')} ${esc(t('Nobody is re-blocked when a date passes — the exception simply stays, which is why it has to be looked at rather than waited out.'))}</div>`;
      if(ce.recordError){
        body += `<div class="verdict bad">⛔ <b>${esc(t('The record file could not be read'))}</b>
          (<span class="mono sm">${esc(ce.recordPath)}</span>): ${esc(ce.recordError)}. ${esc(t('Counts below are about the tenant only — treat "no record" rows as unknown, not as findings.'))}</div>`;
      } else if(!ce.recordExists){
        body += `<div class="verdict warn">⚠ <b>No record file yet</b>
          (<span class="mono sm">${esc(ce.recordPath)}</span>), so every exclusion below reports as
          "no record". That is the correct reading of "nothing was written down".</div>`;
      }
      body += help('An exclusion is the only control change that gets weaker with time and never says '
        + 'so. Grant and revoke with the same script so the record cannot drift from the tenant: '
        + '<span class="mono sm">Grant-CaTempException.ps1</span> — it refuses to grant without '
        + 'writing the reason down. <b>Revoking is a manual step and always will be on this licence.</b>');
      if(rows.length){
        body += table(['User','Status','Deadline','Policy','Device','Reason'],
          rows.map(r=>{
            const c=STATUS[r.s];
            return [`<span class="mono sm trunc">${esc(r.upn)}</span>`,
              `<span class="badge ${c[0]}" title="${esc(t(c[2]))}">${esc(t(c[1]))}</span>`,
              `<span class="mono sm nw">${esc(r.when)}</span>`,
              `<span class="trunc muted">${esc(r.policy||'—')}</span>`,
              `<span class="trunc muted">${esc(r.device||'—')}</span>`,
              `<span class="trunc muted" title="${esc(r.reason||'')}">${esc(r.reason||'—')}</span>`];
          }), {scroll:280});
        body += `<div class="muted sm" style="margin:8px 0 0">${esc(t('Revoke:'))}
          <span class="mono sm">${esc(ce.revokeCommand||'')}</span></div>`;
      }
      body += `<div class="muted sm" style="margin:6px 0 0">
        ${esc(tf('{0} approved permanent (break-glass, room consoles)', ce.permanentCount))} ·
        ${esc(tf('{0} stale record(s) — written down but already out of the tenant', ce.staleCount))} ·
        ${esc(tf('{0} policy/policies carry exclusions', ce.policyCount))}</div>`;
      return panel('CA Exceptions — nothing expires on its own',
        need?tf('⛔ {0} need a decision', need):exp?tf('⚠ {0} due within {1}d', exp, ce.expiringSoonDays):'✅ all within date',
        body, ext(PORTAL.entraCA, 'Entra · Conditional Access'));
    }

    function tabCA(D){
      let html = caPolicyPanel(D) + unattendedPanel(D.unattendedAccounts, (D.riskySignins||{}).caReportOnlyPolicyCount||0)
               + nonInteractivePanel((D.riskySignins||{}).nonInteractive);
      const rs=D.riskySignins;
      if(rs?.available && rs.collecting){
        html += panel('Conditional Access Evaluation','',`<div class="notice">⏳ ${esc(rs.note||'Collecting…')}</div>`);
      } else if(rs?.available){
        html += deviceBlockPanel(rs);
        html += caExceptionPanel(D.caExceptions);
        const pev=rs.caPolicyEval||[];
        if(pev.length){
          const modeBadge=m=>m==='enforced'?`<span class="badge b-ok">Enforced</span>`
            :m==='report-only'?`<span class="badge b-med">Report-only</span>`
            :m==='off'?`<span class="badge b-info">Off</span>`
            :m==='gone'?`<span class="badge b-info nw" title="${esc(t('This policy no longer exists in the tenant. The rows below are history from before it was deleted, not a forecast.'))}">${esc(t('Deleted'))}</span>`
            :`<span class="badge b-info">—</span>`;
          const scopeCell=p=>p.inScope===null||p.inScope===undefined
            ?`<span class="muted" title="Policy scope could not be resolved">—</span>`
            :p.scopeKind==='all'
              ?`<span class="mono sm" title="Targets all users">${p.inScope}</span>`
              :`<span class="mono sm" title="Sign-ins by the users this policy targets, out of ${p.evaluated} in the tenant">${p.inScope}</span>`;
          const verdict=p=>p.stuckUsers
            ?{c:'b-high', ic:'⛔', t:'Locked out', d:`${p.stuckUsers} user(s) blocked with no successful sign-in afterwards in this window. (They may simply not have retried — check before acting.)`}
            :p.blocked
              ?{c:'b-med', ic:'⚠', t:'Blocked, recovered', d:`${p.blocked} sign-in(s) blocked, but every affected user signed in successfully afterwards — the control working, or a transient failure`}
              :(p.wouldBlock||p.interrupted)
                ?{c:'b-med', ic:'⚠', t:'Would block', d:'Report-only: these would be stopped if you enforced this policy today'}
                :!p.applied
                  ?{c:'b-info', ic:'·', t:'No activity', d:'The policy never engaged on any in-scope sign-in — no evidence either way, not a pass'}
                  :{c:'b-ok', ic:'✅', t:'Clean', d:'The policy engaged and stopped nobody'};
          const diag=p=>{
            const b=[];
            if(p.noClaim) b.push(`<span class="badge b-info" title="${esc(t('No device claim presented — fix the client/browser SSO or the device registration, NOT device compliance'))}">${esc(t('No claim'))} ${p.noClaim}</span>`);
            if(p.claimNotCompliant) b.push(`<span class="badge b-med" title="${esc(t('A known device reported as non-compliant — a real compliance gap'))}">${esc(t('Not compliant'))} ${p.claimNotCompliant}</span>`);
            if(p.claimCompliant) b.push(`<span class="badge b-high" title="${esc(t('Device was compliant and still stopped — suspect the policy itself'))}">${esc(t('Compliant but hit'))} ${p.claimCompliant}</span>`);
            if(p.interrupted) b.push(`<span class="badge b-med" title="${esc(t('Would have been interrupted (e.g. an extra MFA prompt) rather than blocked'))}">${esc(t('Interrupted'))} ${p.interrupted}</span>`);
            return b.join(' ')||'<span class="muted">—</span>';
          };
          const pevRows=pev.map(p=>{const v=verdict(p); return [
            `<span class="badge ${v.c} nw" title="${v.d}">${v.ic} ${v.t}</span>`,
            `<span class="trunc">${esc(p.policy)}</span>`,
            modeBadge(p.mode)+(p.switched?` <span class="badge b-info nw" title="${esc(tf('Mode changed inside this {0}-day window (the cutover). That is why this row can show both Blocked (after the change) and Would block (before it).', rs.windowDays))}">↻ ${esc(t('was report-only'))}</span>`:''),
            scopeCell(p),
            `<span class="mono sm">${p.applied}</span>`,
            `<span class="mono sm">${p.pass}</span>`,
            p.blocked?`<span class="badge ${p.stuckUsers?'b-high':'b-med'}" title="${p.blockedUsers||0} user(s) affected${p.stuckUsers?`, ${p.stuckUsers} with no success afterwards`:', all recovered'}">${p.blocked}</span>`:`<span class="badge b-zero">0</span>`,
            p.stuckUsers?`<span class="badge b-high" title="Blocked with no successful sign-in afterwards: ${(p.stuckSample||[]).map(esc).join(', ')}">${p.stuckUsers}</span>`:`<span class="badge b-zero">0</span>`,
            p.wouldBlock?`<span class="badge b-med" title="Report-only: would have been blocked, was not">${p.wouldBlock}</span>`:`<span class="badge b-zero">0</span>`,
            diag(p),
            p.usersImpacted?`<span class="badge b-med">${p.usersImpacted}</span>`:`<span class="badge b-zero">0</span>`,
            (p.controls||[]).map(c=>`<span class="badge b-low">${esc(c)}</span>`).join(' ')||'—'];});
          const stuckPols=pev.filter(p=>p.stuckUsers);
          const nStuckUsers=new Set(stuckPols.flatMap(p=>p.stuckSample||[])).size;
          const nBlock=pev.filter(p=>!p.stuckUsers&&p.blocked).length;
          const nWould=pev.filter(p=>!p.stuckUsers&&!p.blocked&&(p.wouldBlock||p.interrupted)).length;
          const nIdle=pev.filter(p=>!p.blocked&&!p.wouldBlock&&!p.interrupted&&!p.applied).length;
          const headline = stuckPols.length
            ? `<div class="verdict bad">⛔ <b>${esc(tf('{0} user(s) blocked with no successful sign-in afterwards', nStuckUsers))}</b> — ${stuckPols.map(p=>`${esc(p.policy)} (${p.stuckUsers})`).join(', ')}. ${t('Start here; they may just not have retried, so confirm before acting. Then read Diagnosis: <b>No claim</b> = fix the browser or the device registration, <b>Compliant but hit</b> = suspect the policy.')}</div>`
            : nBlock
              ? `<div class="verdict warn">⚠ <b>${esc(t('Nobody is locked out.'))}</b> ${esc(tf('{0} policy(ies) blocked sign-ins, but every affected user got in afterwards — the control working, or transient failures.', nBlock))}</div>`
              : nWould
                ? `<div class="verdict warn">⚠ <b>${esc(t('Nothing is being blocked.'))}</b> ${esc(tf('{0} report-only policy(ies) would stop sign-ins if enforced today — that is the pre-enforce work queue.', nWould))}</div>`
                : `<div class="verdict ok">${tf('✅ <b>No policy blocked or would block any sign-in</b> in the last {0} days.', rs.windowDays)}</div>`;
          html += panel('Conditional Access Policy Evaluation',
            stuckPols.length?tf('⛔ {0} not recovered · {1} policies · {2}d', nStuckUsers, pev.length, rs.windowDays)
                  :tf('✅ 0 locked out · {0} policies · {1}d', pev.length, rs.windowDays),
            headline
            + help(t('Read the <b>Status</b> column first — the rest is the evidence behind it. A block on its own is not a fault: what matters is <b>Not recovered</b> — users blocked with no successful sign-in afterwards. An MFA policy stopping bad sign-ins that then all succeed is the control working. <b>No activity</b> is not a pass either: the policy never engaged, so it has told you nothing. <b>In scope</b> = sign-ins by the users the policy can reach (include groups/roles/users, minus exclusions); Entra records an entry for every policy on <i>every</i> sign-in, so a raw evaluated count reads the same on every row and cannot tell a small pilot from a tenant-wide policy. <b>Applied</b> = the policy actually engaged. <b>Blocked</b> is what it <i>did</i>; <b>Would block</b> is what a report-only policy <i>would have</i> done — a policy with both changed mode inside the window (↻). For a <b>Block</b>-control policy, "Passed" is always 0 by design.')
              + (nIdle?' '+tf('<b>{0}</b> policy(ies) show "No activity" — they are unmeasured, not proven.', nIdle):''))
            + table(['Status','Policy','Mode','In scope','Applied','Passed','Blocked','Not recovered','Would block','Diagnosis','Users hit','Controls'],pevRows),
            ext(PORTAL.entraCA, 'Entra · Conditional Access'));
        }

        const roImp=rs.caReportOnlyImpact||[];
        if(rs.caReportOnlyPolicyCount){
          let rk = kpi(rs.caReportOnlyBlockCount||0,'Would be blocked','hard lockouts to fix first',(rs.caReportOnlyBlockCount?'bad':'ok'));
          rk += kpi(rs.caReportOnlyInterruptCount||0,'Would be interrupted','e.g. extra MFA prompt',(rs.caReportOnlyInterruptCount?'info':'ok'));
          rk += kpi(rs.caReportOnlyUsers||0,'Users affected',tf('across {0} report-only policy(ies)', rs.caReportOnlyPolicyCount));
          let roBody=help('Sign-ins that the <b>report-only</b> policies evaluated as not satisfied — i.e. the blast radius if you enforced them right now. Counted from each policy\'s current state, so a policy enforced <b>or deleted</b> yesterday leaves this panel immediately rather than a window later.')
            + `<div class="kpis" style="margin:0 0 8px">${rk}</div>`;
          const sw=rs.caSwitchedPolicies||[];
          if(sw.length) roBody += `<div class="muted" style="font-size:12px;margin-bottom:8px">`
            + `Enforced inside this window and therefore excluded from the figures above: `
            + sw.map(n=>`<b>${esc(n)}</b>`).join(', ')
            + `. Their real outcome is in the evaluation table and in Conditional Access Failures.</div>`;

          const cl=rs.caReportOnlyByClaim||{};
          const clTot=(cl.noClaim||0)+(cl.claimNotCompliant||0)+(cl.claimCompliant||0);
          if(clTot){
            const pct=n=>Math.round((n||0)/clTot*100);
            roBody += `<div class="help" style="margin-bottom:8px"><span class="help-ic">▣</span><span>
              ${t('<b>Why they would be stopped</b> — this decides what you actually fix:')}<br>
              <span class="badge b-info">${cl.noClaim||0} (${pct(cl.noClaim)}%)</span> ${t('<b>no device claim presented</b> — the client never sent a device identity (browser without the Windows Accounts extension, embedded IE/legacy-Edge webview, or an unregistered device). Fix the client or the device registration; this is <i>not</i> a compliance failure.')}<br>
              <span class="badge b-med">${cl.claimNotCompliant||0} (${pct(cl.claimNotCompliant)}%)</span> ${t('<b>known device, not compliant</b> — a genuine compliance gap on a device Entra can see.')}<br>
              <span class="badge b-high">${cl.claimCompliant||0} (${pct(cl.claimCompliant)}%)</span> ${t('<b>compliant and still stopped</b> — suspect the policy itself (a device filter, an app/platform condition, or a tag on the wrong device object).')}
            </span></div>`;
          }
          const roCtl=(rs.caReportOnlyByControl||[]).map(c=>`${esc(c.control)} (${c.count})`).join(', ');
          if(roCtl) roBody += `<div class="muted" style="font-size:12px;margin-bottom:8px">${esc(t('By control:'))} ${roCtl}</div>`;
          if(roImp.length){
            const claimBadge=c=>c==='noClaim'?`<span class="badge b-info" title="No device claim presented">No claim</span>`
              :c==='claimNotCompliant'?`<span class="badge b-med" title="Known device, not compliant">Not compliant</span>`
              :c==='claimCompliant'?`<span class="badge b-high" title="Device compliant yet stopped - suspect the policy">Compliant!</span>`:'—';
            roBody += table(['Time','Severity','Why','User','Policy','Control','App','Client','Device','Location'],
              roImp.map(f=>[`<span class="mono sm nw">${fmt(f.time)}</span>`,
                f.severity==='block'?`<span class="badge b-high">Block</span>`:`<span class="badge b-med">Interrupt</span>`,
                claimBadge(f.claim),
                `<span class="trunc">${esc(f.user)}</span>`,
                `<span class="trunc">${(f.policies||[]).map(esc).join(', ')||'—'}</span>`,
                (f.controls||[]).map(c=>`<span class="badge b-low">${esc(c)}</span>`).join(' ')||'—',
                `<span class="trunc">${esc(f.app||'—')}</span>`,
                `<span class="trunc muted">${esc(f.client||'—')}</span>`,
                `<span class="nw muted">${esc(f.device||'—')}</span>`,
                `<span class="nw muted">${esc(f.location||'—')}</span>`]),
              {scroll:420});
          } else {
            roBody += `<div class="empty">✅ No sign-in would be blocked or interrupted by the report-only policies in the last ${rs.windowDays} days — safe to enforce on this evidence.</div>`;
          }
          html += panel('Report-only Impact', tf('{0} sign-in(s) affected in {1}d', rs.caReportOnlyImpactCount||0, rs.windowDays), roBody,
            ext(PORTAL.entraCA, 'Entra · Conditional Access'));
        }

        const caFails=rs.caFailures||[], caStat=rs.caStatusCounts||{};
        const caRows=caFails.map(f=>[`<span class="mono sm nw">${fmt(f.time)}</span>`,
          `<span class="trunc">${esc(f.user)}</span>`,
          `<span class="trunc">${(f.policies||[]).map(esc).join(', ')||'—'}</span>`,
          (f.controls||[]).map(c=>`<span class="badge b-med">${esc(c)}</span>`).join(' ')||'—',
          `<span class="trunc muted" title="${esc((LANG==='ko'?(f.errorKo||f.error):f.error)||'')}">${esc((LANG==='ko'?(f.errorKo||f.error):f.error)||'')}</span>`,
          `<span class="nw muted">${esc(f.location||'—')}</span>`]);
        const caSub=Object.entries(caStat).map(([k,v])=>`${k}: ${v}`).join(' · ')||t('no CA evaluation yet');
        let caBody=help('When a sign-in is blocked or challenged by <b>Conditional Access</b>, this pinpoints <b>which policy</b> failed and <b>which control</b> (MFA / compliant device / …) was not met — the fastest way to explain a CA failure. Empty until CA policies are enabled.')
          + `<div class="muted" style="font-size:12px;margin-bottom:8px">${esc(tf('CA evaluation (last {0}d):', rs.windowDays))} ${esc(caSub)}</div>`;
        if(caRows.length){
          const byPol=(rs.caFailByPolicy||[]).map(p=>`${esc(p.policy)} (${p.count})`).join(', ');
          const byCtl=(rs.caFailByControl||[]).map(c=>`${esc(c.control)} (${c.count})`).join(', ');
          caBody += `<div class="muted" style="font-size:12px;margin-bottom:8px">${esc(t('By policy:'))} ${byPol||'—'} · ${esc(t('By control:'))} ${byCtl||'—'}</div>`
            + table(['Time','User','Failed policy','Control','Reason','Location'],caRows,{scroll:360});
        } else {
          caBody += `<div class="empty">✅ ${esc(tf('No Conditional Access failures in the last {0} days.', rs.windowDays))}</div>`;
        }
        html += panel('Conditional Access Failures', tf('{0} in last {1}d', rs.caFailedCount||0, rs.windowDays), caBody,
          ext(PORTAL.entraCA, 'Entra · Conditional Access'));

        const legRows=(rs.legacyByClient||[]).map(l=>[`<span class="nw">${esc(l.client)}</span>`, `<span class="badge b-med">${l.count}</span>`]);
        html += panel('Legacy Authentication', tf('{0} sign-in(s) · {1} user(s)', rs.legacyAuthCount||0, rs.legacyUsers||0),
          help('Legacy protocols (IMAP/POP/SMTP/ActiveSync/Other clients) bypass MFA and are a top account-takeover vector. If this is 0, you can safely block legacy auth with a Conditional Access policy.')
          + (legRows.length?table(['Legacy client','Sign-ins'],legRows):`<div class="empty">✅ ${esc(t('No legacy authentication seen — safe to block via CA.'))}</div>`),
          ext(PORTAL.entraSignIns, 'Entra · Sign-in logs'));
      } else if(rs){ html += panel('Conditional Access Evaluation','',notice(rs)); }
      return html;
    }

    function tabPosture(D){
      let html='';
      const ss=D.secureScore;
      if(ss?.available && ss.current!=null){
        const pct=ss.max?Math.round(ss.current/ss.max*100):0;
        const body=`<div class="score-row">
            <div><div class="kpi-val">${ss.current}<small> / ${ss.max} (${pct}%)</small></div>
