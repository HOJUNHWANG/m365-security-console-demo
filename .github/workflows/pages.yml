name: pages

# Publishes app/static/ as the live demo. Serving the real UI directory rather than a copy is
# deliberate: a duplicated index.html under docs/ would drift from the one the tests exercise, and
# then the published page would stop being the thing that was verified.
#
# Requires Settings -> Pages -> Source = "GitHub Actions" once, by hand.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Nothing is published that has not passed the sanitisation and coherence checks first.
      - run: python demo/verify_demo.py
      - run: python demo/audit_fixture.py
      - run: node tests/demo_render_test.js

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/static
      - id: deployment
        uses: actions/deploy-pages@v4
